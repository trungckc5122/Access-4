    <div class="question-nav">

    </div>

    <div class="bottom-bar">

    </div>

    <div class="context-menu" id="contextMenu">

        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>
</div>

<script src="core-reading.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const testData = {
            type: 'split-layout',
            part: 6,
            answerKey: {
                q27: ["which", "that"],
                q28: ["to"],
                q29: ["and"],
                q30: ["up"],
                q31: ["by"],
                q32: ["has"]
            },
            displayAnswers: {
                q27: "which / that",
                q28: "to",
                q29: "and",
                q30: "up",
                q31: "by",
                q32: "has"
            },
            detailedExplanations: {
                27: `<div><strong>Đáp án: which / that</strong><br>
                     <strong>Mệnh đề quan hệ (relative clause):</strong> <em>which</em> hoặc <em>that</em> dùng để giới thiệu mệnh đề quan hệ chỉ vật/sự việc.<br>
                     Câu: <em>"We talk about anything <u>which/that</u> may interest people, from food..."</em><br>
                     Dịch: Chúng tôi nói về bất cứ điều gì có thể thú vị với mọi người.<br><br>
                     <strong>Lưu ý:</strong> "anything" là antecedent (danh từ đứng trước) → dùng <em>which</em> hoặc <em>that</em>, không dùng "who" (chỉ người).</div>`,
                28: `<div><strong>Đáp án: to</strong><br>
                     <strong>Cấu trúc song song (parallel structure):</strong> <em>from A to B</em> = từ A đến B.<br>
                     Câu: <em>"from food people enjoy <u>to</u> literature and politics."</em><br>
                     Dịch: Từ món ăn mọi người thích đến văn học và chính trị.<br><br>
                     <strong>Lưu ý:</strong> Cụm "from ... to ..." là cấu trúc cố định chỉ phạm vi, không dùng "until" hay "and" ở đây.</div>`,
                29: `<div><strong>Đáp án: and</strong><br>
                     <strong>Liên từ (conjunction):</strong> <em>and</em> nối hai thời điểm để tạo thành khoảng thời gian.<br>
                     Câu: <em>"We meet between 4.30 p.m. <u>and</u> 6.30 p.m. every Tuesday."</em><br>
                     Dịch: Chúng tôi gặp nhau từ 4:30 chiều đến 6:30 chiều mỗi thứ Ba.<br><br>
                     <strong>Lưu ý:</strong> Cấu trúc <em>between X and Y</em> = giữa X và Y. "Between" luôn đi kèm với "and".</div>`,
                30: `<div><strong>Đáp án: up</strong><br>
                     <strong>Cụm động từ (phrasal verb):</strong> <em>set up</em> = thành lập, thiết lập.<br>
                     Câu: <em>"Staff from the School of Tourism at the University set <u>up</u> the group three years ago."</em><br>
                     Dịch: Nhân viên từ Trường Du lịch tại Đại học đã thành lập nhóm ba năm trước.<br><br>
                     <strong>Lưu ý:</strong> "set up" là phrasal verb tách ly được — "set the group up" hoặc "set up the group" đều đúng.</div>`,
                31: `<div><strong>Đáp án: by</strong><br>
                     <strong>Giới từ chỉ tác nhân (agent):</strong> <em>by</em> dùng trong câu bị động để chỉ người thực hiện.<br>
                     Câu: <em>"it's now organised <u>by</u> volunteers."</em><br>
                     Dịch: Bây giờ nó được tổ chức bởi các tình nguyện viên.<br><br>
                     <strong>Cấu trúc bị động:</strong> be + V3 + by + agent. "organised by volunteers" = được tổ chức bởi tình nguyện viên.</div>`,
                32: `<div><strong>Đáp án: has</strong><br>
                     <strong>Thì hiện tại hoàn thành (present perfect):</strong> <em>has + V3</em> dùng với chủ ngữ số ít ("The number") để diễn tả kết quả tính đến hiện tại.<br>
                     Câu: <em>"The number of members <u>has</u> grown a lot during this time."</em><br>
                     Dịch: Số lượng thành viên đã tăng nhiều trong thời gian này.<br><br>
                     <strong>Lưu ý:</strong> "The number of + danh từ số nhiều" → động từ chia theo số ÍT: "The number... <em>has</em>" (không phải "have").</div>`
            },
            template: `
                <div class="reading-card" id="passageCard">
                    <div class="review-title">Spanish conversation club</div>
                    <p>We're a group of people aged 16–25 who meet every week for two hours of chat in Spanish. You don't have to be able to speak much Spanish: we welcome beginners, too.</p>
                    <p>
                        We talk about anything
                        <span class="input-wrapper">
                            <input type="text" id="q27" class="gap-input" data-q="27" autocomplete="off">
                            <span class="eye-icon" data-question="27">👁️</span>
                        </span>
                        may interest people, from food people enjoy
                        <span class="input-wrapper">
                            <input type="text" id="q28" class="gap-input" data-q="28" autocomplete="off">
                            <span class="eye-icon" data-question="28">👁️</span>
                        </span>
                        literature and politics.
                    </p>
                    <p>
                        We meet between 4.30 p.m.
                        <span class="input-wrapper">
                            <input type="text" id="q29" class="gap-input" data-q="29" autocomplete="off">
                            <span class="eye-icon" data-question="29">👁️</span>
                        </span>
                        6.30 p.m. every Tuesday, in a large, comfortable room in the Central Library. The sessions are free, but we do ask people to pay £1 a session for coffee or juice.
                    </p>
                    <p>
                        Staff from the School of Tourism at the University set
                        <span class="input-wrapper">
                            <input type="text" id="q30" class="gap-input" data-q="30" autocomplete="off">
                            <span class="eye-icon" data-question="30">👁️</span>
                        </span>
                        the group three years ago, but it's now organised
                        <span class="input-wrapper">
                            <input type="text" id="q31" class="gap-input" data-q="31" autocomplete="off">
                            <span class="eye-icon" data-question="31">👁️</span>
                        </span>
                        volunteers. The number of members
                        <span class="input-wrapper">
                            <input type="text" id="q32" class="gap-input" data-q="32" autocomplete="off">
                            <span class="eye-icon" data-question="32">👁️</span>
                        </span>
                        grown a lot during this time. As well as allowing people to practise their Spanish, the club brings people from different backgrounds together in order to enjoy each other's company.
                    </p>
                </div>
            `,
            questions: [
                { num: 27 }, { num: 28 }, { num: 29 }, { num: 30 }, { num: 31 }, { num: 32 }
            ]
        };

        window.readingCore = new ReadingCore();
        window.readingCore.initializeTest(testData);
    });
</script>
</body>
</html>
