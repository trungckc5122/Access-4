<body>

            <div class="questions-panel" id="questionsPanel">

                </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">

        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest4Part4Data = {
            title: "KET 5 · Test 4 · Listening Part 4",
            type: "multiple-choice",
            part: 4,
            book: 5,
            test: 4,

            answerKey: { q16: 'A', q17: 'B', q18: 'C', q19: 'C', q20: 'A' },
            displayAnswers: { q16: 'A', q17: 'B', q18: 'C', q19: 'C', q20: 'A' },

            detailedExplanations: {
                q16: `<strong>Đáp án: A – She has hurt herself (Cô ấy bị thương)</strong><br>
                      Gemma nói: <em>"After seeing the dentist, when I was getting out of my mum's car <span class='keyword-highlight'>my hockey stick fell out of my sports bag and hit my foot.</span>"</em><br>
                      Và: <em>"It's really painful and I can't run."</em><br>
                      Gậy khúc côn cầu rơi trúng chân Gemma khiến cô ấy đau và không thể chạy.<br><br>
                      <strong>✗ B (dentist's appointment) sai:</strong> Gemma đã đi khám nha sĩ rồi ("you're back from the dentist's"), đó không phải lý do cô không chơi được.<br>
                      <strong>✗ C (forgotten her sports kit) sai:</strong> Gậy khúc côn cầu vẫn có trong túi thể thao của cô, không bị quên.<br>
                      <strong>✓ A (She has hurt herself) là đáp án chính xác.</strong>`,

                q17: `<strong>Đáp án: B – He wrote a story (Cậu viết một câu chuyện)</strong><br>
                      Cậu bé nói: <em>"I won a prize last week, <span class='keyword-highlight'>for a 500-word story I did in English.</span> It was about coming first in a running race. It wasn't true. I don't even like sport!"</em><br>
                      Cậu giành giải thưởng cho bài viết truyện ngắn trong môn tiếng Anh.<br><br>
                      <strong>✗ A (He won a race) sai:</strong> Cậu viết truyện về việc về nhất trong cuộc đua chạy, nhưng đó là nội dung câu chuyện, không phải điều thực sự xảy ra. Cậu còn nói "It wasn't true. I don't even like sport!"<br>
                      <strong>✗ C (He acted in a play) sai:</strong> Người cô hỏi về việc tham gia kịch nhà trường, nhưng cậu chưa làm điều đó ("No. But I might try.").<br>
                      <strong>✓ B (He wrote a story) là đáp án chính xác.</strong>`,

                q18: `<strong>Đáp án: C – It has nice things to eat (Có đồ ăn ngon)</strong><br>
                      Cô gái nói: <em>"And <span class='keyword-highlight'>the cookies are the best.</span>"</em><br>
                      Cậu bé nói: <em>"True. <span class='keyword-highlight'>And the cakes.</span>"</em><br>
                      Cả hai đều đồng ý về đồ ăn ngon ở quán.<br><br>
                      <strong>✗ A (They meet friends there) sai:</strong> Cậu bé ngạc nhiên vì không nhiều bạn từ trường đến đây ("not many other people from school hang out there").<br>
                      <strong>✗ B (The prices are low) sai:</strong> Cô gái nói quán "a bit expensive" (hơi đắt).<br>
                      <strong>✓ C (It has nice things to eat) là đáp án chính xác.</strong>`,

                q19: `<strong>Đáp án: C – It was cold and sunny (Lạnh và nắng)</strong><br>
                      Cô gái nói: <em>"<span class='keyword-highlight'>It was so bright all week that I had to wear sunglasses whenever I went outside.</span>"</em> → trời nắng sáng.<br>
                      Và đây là chuyến đi trượt tuyết (skiing trip) → trời lạnh.<br>
                      → Thời tiết: lạnh và nắng.<br><br>
                      <strong>✗ A (It snowed every day) sai:</strong> Cô gái nói "There wasn't much snow when we got there. Then the last two nights, nearly a metre fell." – không phải tuyết rơi mỗi ngày.<br>
                      <strong>✗ B (It was cloudy most of the time) sai:</strong> Cô gái than thở về thời tiết ở nhà là nhiều mây ("It's hard being back here – grey clouds, day after day"), không phải ở nơi cô đi nghỉ.<br>
                      <strong>✓ C (It was cold and sunny) là đáp án chính xác.</strong>`,

                q20: `<strong>Đáp án: A – when to meet (khi nào gặp nhau)</strong><br>
                      Girl 1 nhắc: <em>"You know we're meeting outside the cinema to go shopping tomorrow?"</em><br>
                      Girl 2 nói mẹ chở lúc 12 giờ trưa ("she's fetching my brother from the train station at midday").<br>
                      Girl 1 nói: <em>"My bus arrives just before then. So see you at quarter past."</em><br>
                      Girl 2 xác nhận: <em>"Sure."</em><br>
                      Họ đang quyết định giờ gặp nhau (quarter past 12).<br><br>
                      <strong>✗ B (which shops to visit) sai:</strong> Girl 2 đề cập đến cửa hàng quần áo mới ("that new clothes shop opposite the department store"), nhưng đây chỉ là kế hoạch cá nhân, không phải điều họ đang quyết định cùng nhau.<br>
                      <strong>✗ C (how to get home afterwards) sai:</strong> Họ nói về cách đến nơi hẹn, không phải về đường về.<br>
                      <strong>✓ A (when to meet) là đáp án chính xác.</strong>`
            },

            transcript: `
            <p><strong>PART 4</strong></p>
            <p><em>For each question, choose the correct answer.</em></p>

            <p><strong>Question 16</strong><br>
            You will hear a teacher talking to a student called Gemma. Why can't Gemma play hockey today?<br>
            <strong>Man:</strong> Ah Gemma, you're back from the dentist's. I hope you're playing in this afternoon's hockey match.<br>
            <strong>Girl:</strong> I'm really sorry I can't. After seeing the dentist, when I was getting out of my mum's car <span class="highlightable" data-q="16">my hockey stick fell out of my sports bag and hit my foot.</span><br>
            <strong>Man:</strong> Oh dear.<br>
            <strong>Girl:</strong> <span class="highlightable" data-q="16">It's really painful and I can't run.</span><br>
            <strong>Man:</strong> I'm sorry to hear that.<br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 17</strong><br>
            You will hear a boy talking to his aunt about school. What did he do at school last week?<br>
            <strong>Woman:</strong> How's school, Sam?<br>
            <strong>Boy:</strong> It's great! I won a prize last week, <span class="highlightable" data-q="17">for a 500-word story I did in English.</span> It was about coming first in a running race. It wasn't true. I don't even like sport!<br>
            <strong>Woman:</strong> Wow! Have you ever considered getting a part in the school play?<br>
            <strong>Boy:</strong> No. But I might try.<br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 18</strong><br>
            You will hear two friends talking about a café. Why do they like going there?<br>
            <strong>Boy:</strong> I really like going to Toni's Café.<br>
            <strong>Girl:</strong> So do I. It's a good place to do homework after school. You can always get a table. <span class="highlightable" data-q="18">And the cookies are the best.</span><br>
            <strong>Boy:</strong> True. <span class="highlightable" data-q="18">And the cakes.</span> I'm surprised that not many other people from school hang out there.<br>
            <strong>Girl:</strong> I guess it's a bit expensive.<br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 19</strong><br>
            You will hear a girl telling a friend about a holiday. What was the weather like on her holiday?<br>
            <strong>Boy:</strong> How was your skiing trip?<br>
            <strong>Girl:</strong> Fantastic! <span class="highlightable" data-q="19">It was so bright all week that I had to wear sunglasses whenever I went outside.</span> It's hard being back here – grey clouds, day after day.<br>
            <strong>Boy:</strong> But it's warmer here.<br>
            <strong>Girl:</strong> True. I don't need so many clothes! There wasn't much snow when we got there. Then the last two nights, nearly a metre fell.<br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 20</strong><br>
            You will hear two friends talking about going shopping. What are they deciding?<br>
            <strong>Girl 1:</strong> You know we're meeting outside the cinema to go shopping tomorrow?<br>
            <strong>Girl 2:</strong> Yes. I'm looking forward to going to that new clothes shop opposite the department store. I'm still getting a lift with Mum – she's fetching my brother from the train station at midday.<br>
            <strong>Girl 1:</strong> Perfect. <span class="highlightable" data-q="20">My bus arrives just before then. So see you at quarter past.</span><br>
            <strong>Girl 2:</strong> Sure.<br>
            <em>Now listen again. [repeat]</em></p>

            <p><em>That is the end of Part Four.</em></p>
            `,

            questions: [
                { num: 16, text: "You will hear a teacher talking to a student called Gemma. Why can't Gemma play hockey today?", options: ["She has hurt herself.", "She has a dentist's appointment.", "She has forgotten her sports kit."] },
                { num: 17, text: "You will hear a boy talking to his aunt about school. What did he do at school last week?", options: ["He won a race.", "He wrote a story.", "He acted in a play."] },
                { num: 18, text: "You will hear two friends talking about a café. Why do they like going there?", options: ["They meet friends there.", "The prices are low.", "It has nice things to eat."] },
                { num: 19, text: "You will hear a girl telling a friend about her holiday. What was the weather like on her holiday?", options: ["It snowed every day.", "It was cloudy most of the time.", "It was cold and sunny."] },
                { num: 20, text: "You will hear two friends talking about going shopping. What are they deciding?", options: ["when to meet", "which shops to visit", "how to get home afterwards"] }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest4Part4Data);
            console.log('KET 5 Test 4 Listening Part 4 loaded');
        });
    </script>
