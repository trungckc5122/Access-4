<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>PET 1 - Test 4 - Part 2</title>
    <link rel="stylesheet" href="listening-pet-common.css" id="styleLink">
</head>
<body>
    <div class="test-wrapper" id="testWrapper">
        <!-- Header -->
        <div class="ielts-header">
            <div class="brand">
                <div class="ielts-logo">PET</div>
                <div class="candidate"></div>
                <div class="audio-controls">
                    <audio id="listeningAudio" controls>
                        <source src="audio/B1 Preliminary 1 - Test 4 Part 2.mp3" type="audio/mpeg">
                        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
                    </audio>
                    <select class="speed-select" id="speedSelect">
                        <option value="0.7">0.7x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1x</option>
                        <option value="1.1">1.1x</option>
                        <option value="1.25">1.25x</option>
                    </select>
                    <span class="volume-icon">🔊</span>
                </div>
            </div>

</div>

        <!-- Question navigator (8-13) -->
        <div class="question-nav">
            
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">
            <!-- Transcript panel (ẩn ban đầu) -->
            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header">
                    <span>TRANSCRIPT</span>
                </div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 8-13</span>
                    <span class="answer-badge" id="answeredCount">0/6 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 2 Questions 8-13</h3>
                        <p><em>Choose the correct answer (A, B or C).</em></p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/6</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">

                <span class="close-btn" id="closeExplanation">✕ Đóng</span>

        </div>

    <!-- Context menu for manual highlighting -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <!-- Core Listening Engine -->
    <script src="core-listening.js"></script>
    
    <script>
        // Test Data for PET 1 Test 4 Part 2
        const pet1Test4Part2Data = {
            title: "B1 Preliminary 1 · Test 4 · Part 2",
            type: "multiple-choice",
            part: 2,
            book: 1,
            test: 4,

            answerKey: { q8: 'A', q9: 'C', q10: 'A', q11: 'C', q12: 'A', q13: 'A' },
            displayAnswers: { q8: 'A', q9: 'C', q10: 'A', q11: 'C', q12: 'A', q13: 'A' },

            detailedExplanations: {
                q8: `<strong>Đáp án: A – It is too heavy to carry home (quá nặng để mang về nhà)</strong><br>
              Người phụ nữ nhận xét: <em>"<span class='keyword-highlight'>it weighs so much, can you imagine us trying to take it on the bus?</span>"</em> Lò vi sóng nặng quá, không thể mang lên xe buýt. Do đó, họ quyết định đặt mua trực tuyến để được giao hàng tận nhà.
              <br><br>
              <strong>✗ B (It is unavailable in the shop) sai:</strong> Không có thông tin về việc hàng không có sẵn tại cửa hàng.
              <br>
              <strong>✗ C (It is difficult to get to the shop) sai:</strong> Dù họ nhắc đến việc đi xe buýt, nhưng lý do chính là món đồ quá nặng để tự mang về.
              <br>
              <strong>✓ A (It is too heavy to carry home) là đáp án đúng.</strong>`,

                q9: `<strong>Đáp án: C – Change her type of transport (thay đổi phương tiện di chuyển)</strong><br>
              Người đàn ông gợi ý: <em>"<span class='keyword-highlight'>Wouldn't it be better if you flew? It would save so much time</span>."</em> Chẳng phải sẽ tốt hơn nếu cô bay sao? Nó sẽ tiết kiệm được rất nhiều thời gian.
              <br><br>
              <strong>✗ A (Go somewhere different) sai:</strong> Cô đã chọn đi Ireland, người đàn ông không hề gợi ý một địa điểm mới.
              <br>
              <strong>✗ B (Go away for longer) sai:</strong> Cô đã quyết định đi hai tuần (<em>"<span class='keyword-highlight'>a fortnight</span>"</em>), người đàn ông không khuyên cô đi lâu hơn.
              <br>
              <strong>✓ C (Change her type of transport) là đáp án đúng - thay đổi loại phương tiện.</strong>`,

                q10: `<strong>Đáp án: A – His doctor told him to rest (bác sĩ bảo anh nên nghỉ ngơi)</strong><br>
              Người đàn ông giải thích: <em>"<span class='keyword-highlight'>my doctor told me to take things easy</span>"</em> - bác sĩ bảo tuần này nên vận động nhẹ nhàng/nghỉ ngơi. Điều này để chuẩn bị cho ca phẫu thuật chân vào thứ Sáu.
              <br><br>
              <strong>✗ B (He has a cold) sai:</strong> Anh nói mình từng bị cảm nhưng giờ đã khỏi rồi (<em>"<span class='keyword-highlight'>it's over now</span>"</em>).
              <br>
              <strong>✗ C (He's just had an operation) sai:</strong> Ca phẫu thuật sẽ diễn ra vào thứ Sáu tới (<em>"<span class='keyword-highlight'>Friday</span>"</em>), chứ không phải anh vừa mới phẫu thuật xong.
              <br>
              <strong>✓ A (His doctor told him to rest) là đáp án đúng.</strong>`,

                q11: `<strong>Đáp án: C – The acting was disappointing (diễn xuất gây thất vọng)</strong><br>
              Khi được hỏi về diễn xuất, người phụ nữ nói: <em>"<span class='keyword-highlight'>I expected them to be a lot better. Rather disappointing</span>."</em> Cô mong đợi họ diễn tốt hơn nhiều, nhưng khá là thất vọng.
              <br><br>
              <strong>✗ A (The second half was better) sai:</strong> Cô nhận xét hiệp hai còn kém thú vị hơn (<em>"<span class='keyword-highlight'>less interesting</span>"</em>), nên không phải là phim hay hơn sau giờ nghỉ.
              <br>
              <strong>✗ B (The costumes were strange) sai:</strong> Cô thực tế đã khen trang phục rất tuyệt vời (<em>"<span class='keyword-highlight'>The costumes were brilliant</span>"</em>), chứ không phải thấy chúng kỳ lạ.
              <br>
              <strong>✓ C (The acting was disappointing) là đáp án đúng.</strong>`,

                q12: `<strong>Đáp án: A – It appeals to people of all ages (nó thu hút mọi lứa tuổi)</strong><br>
              Người phụ nữ nhận xét: <em>"<span class='keyword-highlight'>the music is definitely popular with a much wider range of people – all ages</span>."</em> Âm nhạc chắc chắn phổ biến với nhiều đối tượng người nghe hơn – mọi lứa tuổi.
              <br><br>
              <strong>✗ B (It helps people to relax) sai:</strong> Thông tin về việc nhạc giúp thư giãn không được nhắc đến.
              <br>
              <strong>✗ C (It is better than the film) sai:</strong> Cô không đưa ra nhận xét so sánh trực tiếp rằng nhạc hay hơn phim.
              <br>
              <strong>✓ A (It appeals to people of all ages) là đáp án đúng.</strong>`,

                q13: `<strong>Đáp án: A – Reading the news is an essential part of the day (đọc tin tức là phần thiết yếu trong ngày)</strong><br>
              Cả hai đều đồng ý việc cập nhật tin tức mỗi sáng rất quan trọng. Người phụ nữ nói cô kiểm tra tin tức mỗi sáng và anh đáp lại: <em>"<span class='keyword-highlight'>So do I</span>"</em>. Cô nhấn mạnh: <em>"<span class='keyword-highlight'>it's essential to know what's happening in the world</span>."</em>
              <br><br>
              <strong>✗ B (Reading the news online is the best way) sai:</strong> Người phụ nữ đọc tin online, nhưng người đàn ông cho biết mình thích đọc báo giấy hơn (<em>"<span class='keyword-highlight'>I prefer reading a newspaper</span>"</em>).
              <br>
              <strong>✗ C (They are both interested in celebrities) sai:</strong> Người đàn ông thích đọc tin về người nổi tiếng, nhưng người phụ nữ lại không hề quan tâm.
              <br>
              <strong>✓ A (Reading the news is an essential part of the day) là đáp án đúng.</strong>`
            },

            transcript: `
                <p><strong>Now look at Part Two. For each question, choose the correct answer.</strong></p>

                <p><strong>Question 8 – You will hear a brother and sister talking about a gift for their cousin.</strong><br>
                <strong>Man:</strong> So what do you think we should give our cousin Lucy for her birthday? She's just moved into her new apartment.<br>
                <strong>Woman:</strong> I think she'd like a microwave. In fact, I've already had a quick look online and seen a few special offers.<br>
                <strong>Man:</strong> Shall we go and have a look in the big department store in town?<br>
                <strong>Woman:</strong> What for? It's likely to be more expensive. And besides, <span class="highlightable" data-q="8">it weighs so much, can you imagine us trying to take it on the bus?</span><br>
                <strong>Man:</strong> OK, but we'd better hurry up and order online, or they might not have any left.<br>
                <em>Now listen again.</em></p>

                <p><strong>Question 9 – You will hear two colleagues discussing their holiday travel plans.</strong><br>
                <strong>Woman:</strong> I've finally decided on my holiday plans. What about you?<br>
                <strong>Man:</strong> Well, actually, I'm going to Greece next week. And you?<br>
                <strong>Woman:</strong> We're off to the coast of Ireland in a month's time.<br>
                <strong>Man:</strong> Going by car and the ferry again?<br>
                <strong>Woman:</strong> Yes.<br>
                <strong>Man:</strong> You must love it – you go there every holiday!<br>
                <strong>Woman:</strong> I do. And this time we're going for a fortnight, not just a week. So that's exciting.<br>
                <strong>Man:</strong> <span class="highlightable" data-q="9">Wouldn't it be better if you flew? You wouldn't waste so much time getting to where you're going.</span><br>
                <strong>Woman:</strong> We like to be able to get around easily once we're there.<br>
                <em>Now listen again.</em></p>

                <p><strong>Question 10 – You will hear a man talking to a friend about a fitness training session.</strong><br>
                <strong>Man:</strong> Hi Joanna. I'm afraid I can't make today's fitness training session.<br>
                <strong>Woman:</strong> Oh? Are you OK?<br>
                <strong>Man:</strong> Well, I'm not too bad. I had this really awful cold, which took about a week to get rid of. Fortunately it's over now. But <span class="highlightable" data-q="10">my doctor told me to take things easy anyway</span> – I don't know if I mentioned it to you – I need to have an operation on my foot on Friday. It's nothing serious, though. I'll be back at fitness training very soon.<br>
                <strong>Woman:</strong> Oh good! Well, you take care then. See you.<br>
                <em>Now listen again.</em></p>

                <p><strong>Question 11 – You will hear two friends talking about a play they've just seen.</strong><br>
                <strong>Man:</strong> That play was really great, wasn't it?<br>
                <strong>Woman:</strong> I thought the second half was a bit less interesting than the first. You could predict exactly what was going to happen.<br>
                <strong>Man:</strong> Really? I wasn't sure how it would end. The actors were excellent though, weren't they?<br>
                <strong>Woman:</strong> <span class="highlightable" data-q="11">Well actually I expected the performances to be a lot better.</span> I must say though the costumes were brilliant.<br>
                <strong>Man:</strong> I think you're a bit hard to please when you go to the theatre, so why don't you choose the next play we see?<br>
                <strong>Woman:</strong> OK, well, I hope you'll like what I choose!<br>
                <em>Now listen again.</em></p>

                <p><strong>Question 12 – You will hear two friends talking about a film and its soundtrack.</strong><br>
                <strong>Man:</strong> What are you listening to on your phone?<br>
                <strong>Woman:</strong> The soundtrack to that film, <em>Smash</em>. Have you seen it?<br>
                <strong>Man:</strong> Not yet.<br>
                <strong>Woman:</strong> I've got it – we could watch it together. It'd be a nice thing to do after a hard week of work.<br>
                <strong>Man:</strong> Cool. I'm free on Friday.<br>
                <strong>Woman:</strong> I mean, the film's aimed at kids, but I think you'll like it. <span class="highlightable" data-q="12">The music's definitely popular with a much wider range of people.</span> Some of it's good old-fashioned jazz and soul, but it's got a sound that makes you want to get up and move. It's definitely as good as the film.<br>
                <em>Now listen again.</em></p>

                <p><strong>Question 13 – You will hear two friends talking about the news.</strong><br>
                <strong>Man:</strong> Why are you always looking at your laptop?<br>
                <strong>Woman:</strong> <span class="highlightable" data-q="13">I'm checking what's happening in the world. I make sure I do it every morning before anything else.</span><br>
                <strong>Man:</strong> So do I. I need to for my job. But I much prefer reading a real newspaper.<br>
                <strong>Woman:</strong> But online I can focus on what I'm really interested in, rather than all the stuff about celebrities and sport stars. I just don't care.<br>
                <strong>Man:</strong> There's a lot of that, but I must admit I always enjoy reading about their lives.<br>
                <strong>Woman:</strong> Do you? Well, there's actually more about that sort of thing online.<br>
                <em>Now listen again.<br>
                That is the end of Part Two.</em></p>
            `,

            questions: [
                { num: 8, text: "Why do they decide to buy the gift online?", options: ["It's heavy to carry home from the shop.", "It's not available in the shop.", "It's difficult to get to the shop."] },
                { num: 9, text: "The man thinks that the woman should", options: ["go somewhere new for her holiday.", "spend more time away.", "take a different type of transport."] },
                { num: 10, text: "The man cannot attend today's session because", options: ["his doctor has advised him to rest.", "he has not recovered from a cold yet.", "he has just had an operation."] },
                { num: 11, text: "What does the woman say about the play?", options: ["It improved after the interval.", "The costumes were strange.", "The acting was disappointing."] },
                { num: 12, text: "What does the woman say about the soundtrack?", options: ["It's enjoyable for all ages.", "It's relaxing to listen to.", "It's better than the film."] },
                { num: 13, text: "They agree that ______.", options: ["reading the news is an essential part of the day.", "it's best to read the news online.", "there's too much news about famous people."] }
            ]
        };

        // Initialize the listening test when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(pet1Test4Part2Data);
            console.log('PET 1 Test 4 Part 2 loaded with core listening engine');
        });
    </script>
