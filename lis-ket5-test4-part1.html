    <script>
        const ketTest4Part1Data = {
            title: "KET 5 · Test 4 · Listening Part 1",
            type: "multiple-choice",
            part: 1,
            book: 5,
            test: 4,

            answerKey: { q1: 'B', q2: 'B', q3: 'A', q4: 'C', q5: 'B' },
            displayAnswers: { q1: 'B', q2: 'B', q3: 'A', q4: 'C', q5: 'B' },

            detailedExplanations: {
                q1: `<strong>Đáp án: B – Áo khoác (coat)</strong><br>
                      Người cha nói: <em>"This looks like a good shop. We could get that maths book you need for school here."</em><br>
                      Cô gái trả lời: <em>"I'm sure it'll be cheaper on the internet, Dad."</em> – nên họ không mua sách.<br>
                      Người cha hỏi: <em>"So have we got everything then?"</em><br>
                      Cô gái nói: <em>"We've already bought some school shoes so I just need a coat. Let's get that here."</em><br>
                      Họ đã mua giày rồi, sách sẽ mua trên mạng, còn thứ họ muốn mua ở đây là áo khoác → đáp án B.<br><br>
                      <strong>✗ A (Giày) sai:</strong> Họ đã mua giày rồi ("We've already bought some school shoes").<br>
                      <strong>✗ C (Sách toán) sai:</strong> Họ quyết định mua trên internet vì rẻ hơn.<br>
                      <strong>✓ B là đáp án chính xác.</strong>`,

                q2: `<strong>Đáp án: B – Bể bơi (swimming pool)</strong><br>
                      Cậu bé nói: <em>"I usually play football in the park on Saturday mornings, but my friends were doing other things this week so I decided to go to the pool instead."</em><br>
                      Sáng nay cậu bé đến bể bơi thay vì đá bóng ở công viên.<br><br>
                      <strong>✗ A (Rạp chiếu phim) sai:</strong> Cậu bé sẽ gặp bạn bè ở rạp chiều phim sau bữa trưa, không phải buổi sáng.<br>
                      <strong>✗ C (Công viên) sai:</strong> Cậu bé thường chơi ở công viên nhưng sáng nay đã không đến đó.<br>
                      <strong>✓ B là đáp án chính xác.</strong>`,

                q3: `<strong>Đáp án: A – Cô gái tóc đen dài, không đeo kính</strong><br>
                      Cậu bé hỏi: <em>"Oh, is she the girl with glasses and long blonde hair?"</em><br>
                      Cô gái đáp: <em>"You got the length right but it's actually quite dark. I've never seen her wearing glasses."</em><br>
                      Vậy Amelia có tóc dài tối màu (đen) và không đeo kính → đáp án A.<br><br>
                      <strong>✗ B (Tóc đen ngắn, đeo kính) sai:</strong> Cô gái nói Amelia không bao giờ đeo kính.<br>
                      <strong>✗ C (Tóc vàng dài, đeo kính) sai:</strong> Tóc là tối màu, không phải vàng; và không đeo kính.<br>
                      <strong>✓ A là đáp án chính xác.</strong>`,

                      Mẹ trả lời: <em>"That's really kind of you, but I've already done it."</em><br>
                      Mẹ đề nghị: <em>"How about putting all the knives and forks and things on the table?"</em><br>
                      Cậu bé đồng ý: <em>"OK, no problem."</em> → Cậu bé sẽ bày bàn ăn → đáp án C.<br><br>
                      <strong>✗ A (Thái rau) sai:</strong> Mẹ đã làm việc đó rồi ("I've already done it").<br>
                      <strong>✗ B (Đi siêu thị) sai:</strong> Mẹ sẽ đi siêu thị, không phải cậu bé.<br>
                      <strong>✓ C là đáp án chính xác.</strong>`,

                q5: `<strong>Đáp án: B – Núi (mountains)</strong><br>
                      Cô gái nói: <em>"We often go to this little village by the sea where there's a nice beach, but we all wanted a change, so we went up into the mountains instead."</em><br>

                      <strong>✗ A (Thành phố) sai:</strong> Cô gái nói thích thời gian "away from the city" (xa thành phố).<br>
                      <strong>✗ C (Làng ven biển) sai:</strong> Đó là nơi họ thường đi, nhưng hôm qua họ muốn thay đổi.<br>
                      <strong>✓ B là đáp án chính xác.</strong>`
            },

            transcript: `
            <p><strong>Test Four</strong></p>
            <p>There are five parts to the test. You will hear each piece twice. We will now stop for a moment. Please ask any questions now because you must NOT speak during the test.</p>

            <p><strong>PART 1</strong></p>
            <p><em>Now look at the instructions for Part One. For each question, choose the correct answer.</em></p>
            <p>Look at question one.</p>

            <p><strong>Question 1</strong><br>
            One. What do they want to buy in the department store?<br>
            <strong>Man:</strong> This looks like a good shop. We could get that maths book you need for school here.<br>
            <strong>Girl:</strong> I'm sure it'll be cheaper on the internet, Dad.<br>
            <strong>Man:</strong> Yes, you're right. So have we got everything then?<br>
            <strong>Girl:</strong> <span class="highlightable" data-q="1">We've already bought some school shoes so I just need a coat. Let's get that here.</span><br>
            <strong>Man:</strong> OK.<br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 2</strong><br>
            Two. Where did the boy go this morning?<br>
            <strong>Girl:</strong> Hi, where have you been? You look tired.<br>
            <strong>Boy:</strong> I usually play football in the park on Saturday mornings, but my friends were doing other things this week <span class="highlightable" data-q="2">so I decided to go to the pool instead.</span><br>
            <strong>Girl:</strong> Are you going home now?<br>
            <strong>Boy:</strong> Yes, for lunch. Then I'm meeting a group of friends at the cinema later on. Why don't you come too?<br>
            <strong>Girl:</strong> Thanks!<br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 3</strong><br>
            Three. Who is the girl going to meet?<br>
            <strong>Boy:</strong> Are you going out?<br>
            <strong>Girl:</strong> Yes, I'm meeting my friend Amelia – she's just started at our school.<br>
            <strong>Boy:</strong> Oh, is she the girl with glasses and long blonde hair?<br>
            <strong>Girl:</strong> <span class="highlightable" data-q="3">You got the length right but it's actually quite dark. I've never seen her wearing glasses.</span><br>
            <strong>Boy:</strong> Oh yes, I know who she is now. Well, have a good time.<br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 4</strong><br>
            Four. How will the boy help his mum?<br>
            <strong>Boy:</strong> Is dinner nearly ready, Mum?<br>
            <strong>Mum:</strong> No, and I need to go to the supermarket because we haven't got any milk.<br>
            <strong>Boy:</strong> Oh no. Well why don't I cut some vegetables while you go there?<br>
            <strong>Mum:</strong> That's really kind of you, but I've already done it. <span class="highlightable" data-q="4">How about putting all the knives and forks and things on the table?</span><br>
            <strong>Boy:</strong> OK, no problem.<br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 5</strong><br>
            Five. Where did the girl spend the day with her family?<br>
            <strong>Boy:</strong> Did you have a good day yesterday?<br>
            <strong>Girl:</strong> Yes, I went out with my family. It was great to spend some time away from the city!<br>
            <strong>Boy:</strong> Sounds nice.<br>
            <strong>Girl:</strong> It was. We often go to this little village by the sea where there's a nice beach, but <span class="highlightable" data-q="5">we all wanted a change, so we went up into the mountains instead.</span><br>
            <em>Now listen again. [repeat]</em></p>

            <p><em>That is the end of Part One.</em></p>
            `,
