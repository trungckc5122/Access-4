<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KET 6 - Test 1 - Listening Part 1</title>
    <link rel="stylesheet" href="listening-pet-common.css" id="styleLink">
    <style>
        .question-item img {
            max-width: 760px !important;
            width: 100%;
            display: block;
        }

        .question-item .options {
            display: grid !important;
            grid-template-columns: 1fr 1fr 1fr;
            max-width: 760px;
            margin-top: 15px;
            gap: 15px;
        }

        .question-item .option {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            margin-bottom: 0 !important;
            padding: 10px 0 !important;
        }

        .question-item .option label {
            margin-left: 8px !important;
            flex: 0 1 auto !important;
            width: auto !important;
        }
    </style>
</head>

<body>
    <div class="test-wrapper" id="testWrapper">
        <!-- Header -->
        <div class="ielts-header">
            <div class="brand">
                <div class="ielts-logo">KET</div>
                <div class="candidate"></div>
                <div class="audio-controls">
                    <audio id="listeningAudio" controls>
                        <source src="audio/KET 6 - Test 1 Part 1.mp3" type="audio/mpeg">
                    </audio>
                    <select class="speed-select" id="speedSelect">
                        <option value="0.7">0.7x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1x</option>
                        <option value="1.1">1.1x</option>
                        <option value="1.25">1.25x</option>
                    </select>
                    <span class="volume-icon">🔊</span>
                </div>
            </div>
        </div>

        <!-- Question navigator -->
        <div class="question-nav">
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">
            <!-- Transcript panel -->
            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 1–5</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 1 &nbsp; Questions 1–5</h3>
                        <p><em>For each question, choose the correct answer.</em></p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>
            <div class="explanation-header">
                <span id="explanationTitle">Giải thích</span>
                <span class="close-btn" id="closeExplanation">✕ Đóng</span>
            </div>
            <div class="explanation-content" id="explanationText"></div>
        </div>
    </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest1Part1Data = {
            title: "KET 6 · Test 1 · Listening Part 1",
            type: "multiple-choice",
            part: 1,
            book: 6,
            test: 1,

            answerKey: { q1: 'B', q2: 'A', q3: 'C', q4: 'C', q5: 'A' },
            displayAnswers: { q1: 'B', q2: 'A', q3: 'C', q4: 'C', q5: 'A' },

            detailedExplanations: {
                q1: `<strong>Đáp án: B – Cinema (Japanese cartoon)</strong><br>
                      Cô gái nói: <em>"I'm meeting my classmate Susan. <span class='keyword-highlight'>We're going to see that new Japanese cartoon.</span>"</em><br>
                      <strong>✗ A (Café) sai:</strong> Đó là nơi mẹ muốn đến, không phải cô gái.<br>
                      <strong>✗ C (Skateboard shop) sai:</strong> Đó là nơi cậu bé và mẹ đến để mua ván trượt.<br>
                      <strong>✓ B (Cinema) là đúng – Cô gái đi xem phim hoạt hình Nhật Bản cùng bạn Susan.</strong>`,

                q2: `<strong>Đáp án: A – 2 ngăn kéo bên trái + 3 kệ bên phải</strong><br>
                      Cậu bé nói: <em>"<span class='keyword-highlight'>Mine's got two drawers on the left and three shelves on the right.</span>"</em><br>
                      <strong>✗ B sai:</strong> Mẫu bàn có 4 ngăn kéo là cái mẹ xem online ban đầu, không phải cái đã mua.<br>
                      <strong>✗ C sai:</strong> Không khớp với mô tả.<br>
                      <strong>✓ A là đúng – Bàn có 2 ngăn kéo bên trái và 3 kệ bên phải.</strong>`,

                q3: `<strong>Đáp án: C – Đi bộ (walking)</strong><br>
                      Boy 1 đề nghị: <em>"Or we could walk. It's not far."</em> và Boy 2 đồng ý: <em>"<span class='keyword-highlight'>Good idea.</span>"</em><br>
                      <strong>✗ A (Bus) sai:</strong> Boy 2 đề nghị đi xe buýt nhưng sau đó đồng ý đi bộ.<br>
                      <strong>✗ B (Bike) sai:</strong> Boy 1 đề nghị đi xe đạp nhưng Boy 2 có vấn đề với bánh sau.<br>
                      <strong>✓ C (Walking) là đúng – Cả hai đồng ý đi bộ vì không xa.</strong>`,

                q4: `<strong>Đáp án: C – Tóc ngắn tối màu và đeo kính</strong><br>
                      Laura nói: <em>"it's the other woman, <span class='keyword-highlight'>with short dark hair and glasses.</span>"</em><br>
                      <strong>✗ A sai:</strong> Người tóc dài tối màu trông giống dì Suzanna, không phải giáo viên.<br>
                      <strong>✗ B sai:</strong> Dì Suzanna có tóc vàng, không phải giáo viên.<br>
                      <strong>✓ C là đúng – Giáo viên tiếng Anh mới của Laura có tóc ngắn tối màu và đeo kính.</strong>`,

                q5: `<strong>Đáp án: A – Bóng chuyền (volleyball)</strong><br>
                      Harry nói: <em>"We all like volleyball, and that's good exercise, too, <span class='keyword-highlight'>so I'll think about that.</span>"</em><br>
                      <strong>✗ B (Badminton) sai:</strong> Harry thích cầu lông nhưng bạn bè không thích.<br>
                      <strong>✗ C (Running) sai:</strong> Harry không muốn chạy ngoài trời nếu trời mưa.<br>
                      <strong>✓ A (Volleyball) là đúng – Harry cân nhắc chơi bóng chuyền nếu trời mưa.</strong>`
            },

            transcript: `
            <p><strong>Listening – Test One</strong></p>
            <p>There are five parts to the test. You will hear each piece twice.</p>
            <p><em>We will now stop for a moment. Please ask any questions now because you must NOT speak during the test.</em></p>

            <p><strong>PART 1</strong></p>
            <p><em>Now look at the instructions for Part One. For each question, choose the correct answer. Look at question one.</em></p>

            <p><strong>Question 1</strong><br>
            <em>One. Where's the girl going this afternoon?</em><br>
            <strong>Boy:</strong> Are you coming shopping with me and Mom this afternoon?<br>
            <strong>Girl:</strong> To buy your new skateboard? I'd love to, but I'm meeting my classmate Susan. <span class="highlightable" data-q="1">We're going to see that new Japanese cartoon.</span><br>
            <strong>Boy:</strong> OK, no problem, Mom can help me choose a skateboard.<br>
            <strong>Girl:</strong> And Mom wants to go to the new café in Bridge Street.<br>
            <strong>Boy:</strong> Great! They sell fantastic cakes!<br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 2</strong><br>
            <em>Two. Which is the boy's new desk?</em><br>
            <strong>Boy:</strong> Mum's bought me a desk for my bedroom, Aunt Barbara.<br>
            <strong>Aunt:</strong> Yes. She was looking at one online with four drawers. Did she get that one?<br>
            <strong>Boy:</strong> <span class="highlightable" data-q="2">Mine's got two drawers on the left and three shelves on the right.</span><br>
            <strong>Aunt:</strong> That's good – you've got lots of books and things. Can I go upstairs and look at it?<br>
            <strong>Boy:</strong> Sure!<br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 3</strong><br>
            <em>Three. How will they get to their tennis class?</em><br>
            <strong>Boy 1:</strong> Are we going to go to our tennis class by bike today? The weather's good.<br>
            <strong>Boy 2:</strong> Yes, it's sunny but not too hot. But I've got a problem with my back wheel, so I'd prefer to go by bus.<br>
            <strong>Boy 1:</strong> Or we could walk. It's not far.<br>
            <strong>Boy 2:</strong> <span class="highlightable" data-q="3">Good idea.</span> My dad says he'll fix my bike next weekend.<br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 4</strong><br>
            <em>Four. Which woman is Laura's new English teacher?</em><br>
            <strong>Laura:</strong> Mum, you see the woman outside the bookshop? That's my new English teacher.<br>
            <strong>Mum:</strong> The woman with long dark hair? She looks like your Aunt Suzanna.<br>
            <strong>Laura:</strong> But Aunt Suzanna's got blonde hair! Anyway, it's the other woman, <span class="highlightable" data-q="4">with short dark hair and glasses.</span><br>
            <strong>Mum:</strong> Oh, she looks really friendly!<br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 5</strong><br>
            <em>Five. What might Harry do if it rains on Saturday?</em><br>
            <strong>Katie:</strong> Hi, Harry, are you going to go running on Saturday to practise for the school race?<br>
            <strong>Harry:</strong> Possibly, but it might rain. If it does, I don't want to be outside.<br>
            <strong>Katie:</strong> What about playing badminton in the sports hall?<br>
            <strong>Harry:</strong> I like badminton, but my friends don't. <span class="highlightable" data-q="5">We all like volleyball, and that's good exercise, too, so I'll think about that.</span><br>
            <em>Now listen again. [repeat]</em></p>

            <p><em>That is the end of Part One.</em></p>
            `,

            questions: [
                { num: 1, text: "Where's the girl going this afternoon?<br><img src='img-ket/ket 6-test 1-1.png' alt='Question 1' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 2, text: "Which is the boy's new desk?<br><img src='img-ket/ket 6-test 1-2.png' alt='Question 2' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 3, text: "How will they get to their tennis class?<br><img src='img-ket/ket 6-test 1-3.png' alt='Question 3' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 4, text: "Which woman is Laura's new English teacher?<br><img src='img-ket/ket 6-test 1-4.png' alt='Question 4' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 5, text: "What might Harry do if it rains on Saturday?<br><img src='img-ket/ket 6-test 1-5.png' alt='Question 5' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest1Part1Data);
            console.log('KET 6 Test 1 Listening Part 1 loaded');
        });
    </script>
