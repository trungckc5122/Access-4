<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>PET 1 - Test 3 - Reading Part 6</title>
    <link rel="stylesheet" href="reading-pet-common.css" id="styleLink">
</head>
<body>
<div class="test-wrapper" id="testWrapper">
    <div class="ielts-header">
        <div class="brand"><div class="ielts-logo">PET</div><div class="candidate"></div></div>
    </div>

    <div class="question-nav">
        
        <div class="nav-buttons" id="navButtons"></div>
        <span id="answeredCount" style="font-size:13px; color:#555; margin-left:10px;">0/6 answered</span>
    </div>

    <!-- Main area -->
    <div class="main-area split-layout" id="mainArea"></div>

    <div class="bottom-bar">
        <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
        <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
        <button class="btn btn-danger" id="resetBtn">Reset</button>
        <div class="progress" id="progressDisplay">Đã làm: 0/6</div>
    </div>

    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>
</div>

<script src="core-reading.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const testData = {
            type: 'split-layout',
            part: 6,
            answerKey: { q27: ["so"], q28: ["every", "each"], q29: ["if", "when", "whenever"], q30: ["why"], q31: ["about"], q32: ["There"] },
            displayAnswers: { q27: "so", q28: "every / each", q29: "if / when / whenever", q30: "why", q31: "about", q32: "There" },
            detailedExplanations: {
                27: `<div><strong>Đáp án: so</strong><br>
                     <strong>Cấu trúc:</strong> <em>so + adjective + that</em> (quá ... đến mức ...).<br>
                     Câu: <em>"I was <u>so</u> nervous that I couldn't even ask anyone for help."</em><br>
                     Dịch: Tôi đã quá lo lắng đến mức không thể nhờ ai giúp đỡ.<br><br>
                     <strong>✗ very sai:</strong> "very nervous that" không phải cấu trúc chuẩn — "very" không dùng với "that" theo sau.<br>
                     <strong>✗ too sai:</strong> "too nervous to ask" đúng, nhưng câu này dùng "that" nên phải là "so".<br>
                     <strong>✓ so là đáp án đúng.</strong></div>`,
                28: `<div><strong>Đáp án: every / each</strong><br>
                     <strong>Lượng từ:</strong> <em>every</em> hoặc <em>each</em> đi với danh từ đếm được số ít (student) để chỉ từng cá nhân trong nhóm.<br>
                     Câu: <em>"Remember that <u>every</u> student at the college has been new at one time..."</em><br>
                     Dịch: Hãy nhớ rằng mỗi sinh viên tại trường đều từng là người mới.<br><br>
                     <strong>✗ all sai:</strong> "all student" sai ngữ pháp — "all" cần danh từ số nhiều: "all students".<br>
                     <strong>✗ any sai:</strong> "any student" mang nghĩa không xác định, không phù hợp ngữ cảnh.<br>
                     <strong>✓ every / each là đáp án đúng.</strong></div>`,
                29: `<div><strong>Đáp án: if / when / whenever</strong><br>
                     <strong>Liên từ điều kiện / thời gian:</strong> <em>if</em> (nếu), <em>when</em> (khi), <em>whenever</em> (bất cứ khi nào) đều phù hợp.<br>
                     Câu: <em>"So <u>if</u> you're not sure where to go, just ask – we're all happy to help!"</em><br>
                     Dịch: Vì vậy, nếu bạn không chắc nên đi đâu, hãy hỏi — chúng tôi đều sẵn sàng giúp đỡ!<br><br>
                     <strong>✗ although sai:</strong> "although" (mặc dù) biểu thị sự tương phản, không phù hợp nghĩa.<br>
                     <strong>✗ because sai:</strong> "because" (vì) không đúng cấu trúc ở đây.<br>
                     <strong>✓ if / when / whenever đều được chấp nhận.</strong></div>`,
                30: `<div><strong>Đáp án: why</strong><br>
                     <strong>Cấu trúc gợi ý:</strong> <em>Why not + bare infinitive</em> (Tại sao không...?) — dùng để đưa ra lời gợi ý thân thiện.<br>
                     Câu: <em>"To make some friends, <u>why</u> not spend break times with some of your new classmates in the café?"</em><br>
                     Dịch: Để kết bạn, tại sao không dành thời gian nghỉ với các bạn cùng lớp trong quán cà phê?<br><br>
                     <strong>✗ what sai:</strong> "what not spend" không đúng ngữ pháp.<br>
                     <strong>✗ how sai:</strong> "how not spend" không phải cấu trúc gợi ý trong tiếng Anh.<br>
                     <strong>✓ why là đáp án đúng.</strong></div>`,
                31: `<div><strong>Đáp án: about</strong><br>
                     <strong>Cấu trúc gợi ý:</strong> <em>How about + V-ing</em> (Thế còn... thì sao?) — cấu trúc gợi ý phổ biến.<br>
                     Câu: <em>"Or how <u>about</u> joining one of the many clubs we have at the college?"</em><br>
                     Dịch: Hoặc thế còn việc tham gia một trong nhiều câu lạc bộ tại trường thì sao?<br><br>
                     <strong>✗ of sai:</strong> "how of joining" không đúng ngữ pháp.<br>
                     <strong>✗ for sai:</strong> "how for joining" không đúng ngữ pháp.<br>
                     <strong>✓ about là đáp án đúng.</strong></div>`,
                32: `<div><strong>Đáp án: There</strong><br>
                     <strong>Cấu trúc tồn tại:</strong> <em>There are + danh từ số nhiều</em> dùng để chỉ sự tồn tại của nhiều thứ.<br>
                     Câu: <em>"<u>There</u> are lots to choose from."</em><br>
                     Dịch: Có rất nhiều lựa chọn dành cho bạn.<br><br>
                     <strong>✗ It sai:</strong> "It are lots" sai ngữ pháp hoàn toàn.<br>
                     <strong>✗ They sai:</strong> "They are lots to choose from" không đúng — "they" cần có danh từ cụ thể trước đó.<br>
                     <strong>✓ There là đáp án đúng.</strong></div>`
            },
            template: `
                <div class="reading-card" id="passageCard">
                    <div class="review-title">Starting at college</div>
                    <p>Hi, my name's Emma. Welcome to the college! I've been studying here for a year now.
                        Starting at college isn't easy, but I'm sure you'll soon feel at home. When I first started
                        studying here last year, I was
                        <span class="input-wrapper">
                            <input type="text" id="q27" class="gap-input" data-q="27" autocomplete="off">
                            <span class="eye-icon" data-question="27">👁️</span>
                        </span>
                        nervous that I couldn't even ask anyone for help. I got lost five times on my first day!
                    </p>
                    <p>Remember that
                        <span class="input-wrapper">
                            <input type="text" id="q28" class="gap-input" data-q="28" autocomplete="off">
                            <span class="eye-icon" data-question="28">👁️</span>
                        </span>
                        student at the college has been new at one time, and understands how you feel. So
                        <span class="input-wrapper">
                            <input type="text" id="q29" class="gap-input" data-q="29" autocomplete="off">
                            <span class="eye-icon" data-question="29">👁️</span>
                        </span>
                        you're not sure where to go, just ask – we're all happy to help!
                    </p>
                    <p>You probably don't know many people here. To make some friends,
                        <span class="input-wrapper">
                            <input type="text" id="q30" class="gap-input" data-q="30" autocomplete="off">
                            <span class="eye-icon" data-question="30">👁️</span>
                        </span>
                        not spend break times with some of your new classmates in the café? Or how
                        <span class="input-wrapper">
                            <input type="text" id="q31" class="gap-input" data-q="31" autocomplete="off">
                            <span class="eye-icon" data-question="31">👁️</span>
                        </span>
                        joining one of the many clubs we have at the college?
                        <span class="input-wrapper">
                            <input type="text" id="q32" class="gap-input" data-q="32" autocomplete="off">
                            <span class="eye-icon" data-question="32">👁️</span>
                        </span>
                        are lots to choose from.
                    </p>
                    <p>Good luck on your new course!</p>
                </div>
            `,
            questions: [
                { num: 27 }, { num: 28 }, { num: 29 }, { num: 30 }, { num: 31 }, { num: 32 }
            ]
        };

        window.readingCore = new ReadingCore();
        window.readingCore.initializeTest(testData);
    });
</script>
</body>
</html>
