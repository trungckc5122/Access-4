<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KET 4 - Test 1 - Listening Part 1</title>
    <link rel="stylesheet" href="listening-pet-common.css" id="styleLink">
    <style>
        .question-item img {
            max-width: 760px !important;
            width: 100%;
            display: block;
        }

        .question-item .options {
            display: grid !important;
            grid-template-columns: 1fr 1fr 1fr;
            max-width: 760px;
            margin-top: 15px;
            gap: 15px;
        }

        .question-item .option {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            margin-bottom: 0 !important;
            padding: 10px 0 !important;
        }

        .question-item .option label {
            margin-left: 8px !important;
            flex: 0 1 auto !important;
            width: auto !important;
        }
    </style>
</head>

<body>
    <div class="test-wrapper" id="testWrapper">
        <!-- Header -->
        <div class="ielts-header">
            <div class="brand">
                <div class="ielts-logo">KET</div>
                <div class="candidate"></div>
                <div class="audio-controls">
                    <audio id="listeningAudio" controls>
                        <source src="audio/KET 4 - Test 1 Part 1.mp3" type="audio/mpeg">
                    </audio>
                    <select class="speed-select" id="speedSelect">
                        <option value="0.7">0.7x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1x</option>
                        <option value="1.1">1.1x</option>
                        <option value="1.25">1.25x</option>
                    </select>
                    <span class="volume-icon">🔊</span>
                </div>
            </div>
        </div>

        <!-- Question navigator -->
        <div class="question-nav">
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">
            <!-- Transcript panel -->
            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 1–5</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 1 &nbsp; Questions 1–5</h3>
                        <p><em>For each question, choose the correct answer.</em></p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>
            <div class="explanation-header">
                <span id="explanationTitle">Giải thích</span>
                <span class="close-btn" id="closeExplanation">✕ Đóng</span>
            </div>
            <div class="explanation-content" id="explanationText"></div>
        </div>
    </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest1Part1Data = {
            title: "KET 4 · Test 1 · Listening Part 1",
            type: "multiple-choice",
            part: 1,
            book: 4,
            test: 1,

            answerKey: { q1: 'C', q2: 'C', q3: 'C', q4: 'A', q5: 'C' },
            displayAnswers: { q1: 'C', q2: 'C', q3: 'C', q4: 'A', q5: 'C' },

            detailedExplanations: {
                q1: `<strong>Đáp án: C – Bus</strong><br>
                      Stan nói: <em>"There is a train station, but there are no trains after 10 o'clock. And the taxis were all busy, <span class='keyword-highlight'>so we got a bus</span>."</em><br>
                      <strong>✗ A (Train) sai:</strong> Không có tàu sau 10 giờ.<br>
                      <strong>✗ B (Taxi) sai:</strong> Tất cả taxi đều bận.<br>
                      <strong>✓ C (Bus) là đúng – Họ đã bắt xe buýt.</strong>`,

                q2: `<strong>Đáp án: C – Swimming costume</strong><br>
                      Cô gái nói: <em>"When I got to the pool, I looked for <span class='keyword-highlight'>my swimming costume</span> in my bag, but I only had my towel!"</em><br>
                      <strong>✗ A (Money) sai:</strong> Cô có đủ tiền, không cần thêm.<br>
                      <strong>✗ B (Towel) sai:</strong> Cô có khăn, không quên.<br>
                      <strong>✓ C (Swimming costume) là đúng – Cô quên áo tắm.</strong>`,

                q3: `<strong>Đáp án: C – Make sandwiches</strong><br>
                      Cậu bé nói: <em>"Dad has to pick up the train tickets, and <span class='keyword-highlight'>as soon as I get in after lessons I have to help make sandwiches</span> for the journey."</em><br>
                      <strong>✗ A (Pack clothes) sai:</strong> Cậu sẽ làm sau ("later tonight").<br>
                      <strong>✗ B (Collect train tickets) sai:</strong> Bố sẽ làm việc đó.<br>
                      <strong>✓ C (Make sandwiches) là đúng – Việc đầu tiên sau khi về nhà.</strong>`,

                q4: `<strong>Đáp án: A – In her dad's car</strong><br>
                      Cô gái nói: <em>"It was actually <span class='keyword-highlight'>in the back of my dad's car</span>. I saw it when he gave me a lift to school this morning."</em><br>
                      <strong>✗ B (In her school desk) sai:</strong> Cô có tìm ở đó nhưng không thấy.<br>
                      <strong>✗ C (In her bag) sai:</strong> Điện thoại không ở trong túi.<br>
                      <strong>✓ A (In her dad's car) là đúng – Tìm thấy ở ghế sau xe bố.</strong>`,

                q5: `<strong>Đáp án: C – Castle</strong><br>
                      Người phụ nữ đề nghị: <em>"Maybe we could <span class='keyword-highlight'>go to the castle before we go there</span> (to the museum)?"</em><br>
                      Và người đàn ông đồng ý: <em>"Alright..."</em><br>
                      Họ sẽ đi castle trước, sau đó museum, rồi theatre.<br>
                      <strong>✗ A (Museum) sai:</strong> Đi sau castle.<br>
                      <strong>✗ B (Theatre) sai:</strong> Đi sau cùng.<br>
                      <strong>✓ C (Castle) là đúng – Địa điểm đầu tiên.</strong>`
            },

            transcript: `
            <p><strong>PART 1</strong></p>
            <p><em>For each question, choose the correct answer.</em></p>

            <p><strong>Question 1</strong><br>
            <strong>Girl:</strong> How was the concert, Stan? You look tired!<br>
            <strong>Boy:</strong> I am. It was great, but Dad and I got home really late.<br>
            <strong>Girl:</strong> Isn't there a train station near the concert hall?<br>
            <strong>Boy:</strong> There is, but there are no trains after 10 o'clock. And the taxis were all busy, <span class="highlightable" data-q="1">so we got a bus.</span> It took so long! Next time I'll wait for a taxi!</p>

            <p><strong>Question 2</strong><br>
            <strong>Man:</strong> Why are you back home so soon? You should be on your way to the swimming pool!<br>
            <strong>Girl:</strong> I know, Dad. But I forgot something.<br>
            <strong>Man:</strong> Oh, do you need more money for the bus?<br>
            <strong>Girl:</strong> Thanks, but I've got enough. When I got to the pool, I looked for <span class="highlightable" data-q="2">my swimming costume</span> in my bag, but I only had my towel!</p>

            <p><strong>Question 3</strong><br>
            <strong>Boy:</strong> We're going to stay with my cousins tomorrow.<br>
            <strong>Girl:</strong> Are you all ready to go?<br>
            <strong>Boy:</strong> Almost. Dad has to pick up the train tickets, and <span class="highlightable" data-q="3">as soon as I get in after lessons I have to help make sandwiches for the journey.</span><br>
            <strong>Girl:</strong> Have you packed?<br>
            <strong>Boy:</strong> I've almost finished. I won't need many clothes and I can do it later tonight.</p>

            <p><strong>Question 4</strong><br>
            <strong>Girl:</strong> I couldn't find my phone for four days. I looked everywhere. I never take my phone to school, but I even looked in my classroom desk!<br>
            <strong>Boy:</strong> Bad luck!<br>
            <strong>Girl:</strong> It was actually <span class="highlightable" data-q="4">in the back of my dad's car.</span> I saw it when he gave me a lift to school this morning.<br>
            <strong>Boy:</strong> Maybe it fell out of your bag!<br>
            <strong>Girl:</strong> Yeah, maybe.</p>

            <p><strong>Question 5</strong><br>
            <strong>Man:</strong> So, how about going to the museum before it gets too busy?<br>
            <strong>Woman:</strong> Maybe we could <span class="highlightable" data-q="5">go to the castle before we go there?</span> It's too sunny to be inside a museum right now.<br>
            <strong>Man:</strong> Alright, but we've got to use our theatre tickets by today.<br>
            <strong>Woman:</strong> Let's do that after we finish visiting the museum.<br>
            <strong>Man:</strong> Sure.</p>

            <p><em>That is the end of Part One.</em></p>
            `,

            questions: [
                { num: 1, text: "How did Stan and his dad get home from the concert?<br><img src='img-ket/ket 4-test 1-1.png' alt='Question 1' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 2, text: "What's the girl forgotten?<br><img src='img-ket/ket 4-test 1-2.png' alt='Question 2' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 3, text: "What will the boy do first after he gets home from school?<br><img src='img-ket/ket 4-test 1-3.png' alt='Question 3' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 4, text: "Where did the girl find her phone?<br><img src='img-ket/ket 4-test 1-4.png' alt='Question 4' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 5, text: "Where are the two friends going to go first today?<br><img src='img-ket/ket 4-test 1-5.png' alt='Question 5' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest1Part1Data);
            console.log('KET 4 Test 1 Listening Part 1 loaded');
        });
    </script>
</body>

</html>
