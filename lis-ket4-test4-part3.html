<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KET 4 - Test 4 - Listening Part 3</title>
    <link rel="stylesheet" href="listening-pet-common.css" id="styleLink">
</head>

<body>
    <div class="test-wrapper" id="testWrapper">
        <!-- Header -->
        <div class="ielts-header">
            <div class="brand">
                <div class="ielts-logo">KET</div>
                <div class="candidate"></div>
                <div class="audio-controls">
                    <audio id="listeningAudio" controls>
                        <source src="audio/KET 4 - Test 4 Part 3.mp3" type="audio/mpeg">
                    </audio>
                    <select class="speed-select" id="speedSelect">
                        <option value="0.7">0.7x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1x</option>
                        <option value="1.1">1.1x</option>
                        <option value="1.25">1.25x</option>
                    </select>
                    <span class="volume-icon">🔊</span>
                </div>
            </div>
        </div>

        <!-- Question navigator -->
        <div class="question-nav">
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">
            <!-- Transcript panel -->
            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 11–15</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 3 &nbsp; Questions 11–15</h3>
                        <p><em>For each question, choose the correct answer.</em></p>
                        <p style="margin-bottom:8px;">You will hear Maria talking to her friend Alex about visiting a
                            science museum.</p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>
            <div class="explanation-header">
                <span id="explanationTitle">Giải thích</span>
                <span class="close-btn" id="closeExplanation">✕ Đóng</span>
            </div>
            <div class="explanation-content" id="explanationText"></div>
        </div>
    </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest4Part3Data = {
            title: "KET 4 · Test 4 · Listening Part 3",
            type: "multiple-choice",
            part: 3,
            book: 4,
            test: 4,

            answerKey: { q11: 'B', q12: 'C', q13: 'A', q14: 'B', q15: 'C' },
            displayAnswers: { q11: 'B', q12: 'C', q13: 'A', q14: 'B', q15: 'C' },

            detailedExplanations: {
                q11: `<strong>Đáp án: B – on Monday</strong><br>
                      Alex nói: <em>"Hi, Maria, I haven't seen you since Tom's party on Sunday."</em><br>
                      Maria đáp: <em>"Hi, Alex, it's only Tuesday today! <span class='keyword-highlight'>I went on a school trip to the Science Museum yesterday.</span>"</em><br>
                      Hôm nay là thứ Ba, hôm qua là thứ Hai → Maria đi bảo tàng vào thứ Hai.<br><br>
                      <strong>✗ A (on Sunday) sai:</strong> Alex nói không gặp Maria từ bữa tiệc của Tom hôm Chủ nhật, nhưng Maria không đi bảo tàng ngày đó.<br>
                      <strong>✗ C (on Tuesday) sai:</strong> Hôm nay là thứ Ba, Maria đi bảo tàng hôm qua (thứ Hai), không phải hôm nay.<br>
                      <strong>✓ B (on Monday) là đáp án chính xác.</strong>`,

                q12: `<strong>Đáp án: C – family</strong><br>
                      Maria hỏi: <em>"I didn't know it was open on Monday! <span class='keyword-highlight'>I've already been there a few times with my aunt and uncle</span>, it's not far from my house."</em><br>
                      Alex thường đi bảo tàng với dì và chú của mình (family).<br><br>
                      <strong>✗ A (class) sai:</strong> Alex nói muốn đi với lớp ("I'd really like to go with my class"), nhưng đó không phải cách anh thường đi.<br>
                      <strong>✗ B (friends) sai:</strong> Alex cũng muốn đi với nhóm bạn ("or a group of friends"), nhưng không phải thường xuyên.<br>
                      <strong>✓ C (family) là đáp án chính xác.</strong>`,

                q13: `<strong>Đáp án: A – by bike</strong><br>
                      Alex nói: <em>"How did you get there? It's a bit far to walk from school, isn't it?"</em><br>
                      Maria đáp: <em>"We went by coach."</em><br>
                      Alex nói: <em>"Lucky you! <span class='keyword-highlight'>We usually cycle there</span> – it's good exercise."</em><br>
                      Alex thường đạp xe đến bảo tàng.<br><br>
                      <strong>✗ B (by bus) sai:</strong> Không đề cập đến xe buýt.<br>
                      <strong>✗ C (on foot) sai:</strong> Alex nói đi bộ từ trường đến bảo tàng khá xa ("a bit far to walk"), không phải cách anh thường đi.<br>
                      <strong>✓ A (by bike) là đáp án chính xác.</strong>`,

                q14: `<strong>Đáp án: B – watching a video</strong><br>
                      Alex hỏi: <em>"What did you like best at the museum?"</em><br>
                      Maria đáp: <em>"The museum guide showed us a model of the moon, but <span class='keyword-highlight'>it wasn't as good as the film that we saw about space travel.</span>"</em><br>
                      Maria thích xem phim về du hành vũ trụ hơn là mô hình mặt trăng.<br><br>
                      <strong>✗ A (talking to the guide) sai:</strong> Hướng dẫn viên giới thiệu mô hình, nhưng Maria thấy không tốt bằng phim.<br>
                      <strong>✗ C (making a model) sai:</strong> Không có hoạt động làm mô hình.<br>
                      <strong>✓ B (watching a video) là đáp án chính xác.</strong>`,

                q15: `<strong>Đáp án: C – a drink</strong><br>
                      Alex hỏi: <em>"Did you go to the café? They do great chocolate cake!"</em><br>
                      Maria đáp: <em>"I know, I thought their cakes and ice creams looked great, but we had to hurry, so <span class='keyword-highlight'>I just had a glass of juice.</span>"</em><br>
                      Maria chỉ uống nước ép (a drink).<br><br>
                      <strong>✗ A (a cake) sai:</strong> Maria thấy bánh ngon nhưng không ăn ("cakes and ice creams looked great, but...").<br>
                      <strong>✗ B (an ice cream) sai:</strong> Maria không ăn kem.<br>
                      <strong>✓ C (a drink) là đáp án chính xác.</strong>`
            },

            transcript: `
            <p><strong>PART 3</strong></p>
            <p><em>For each question, choose the correct answer.</em></p>
            <p>You will hear Maria talking to her friend Alex about visiting a science museum.</p>

            <p><strong>Alex:</strong> Hi, Maria, I haven't seen you since Tom's party on Sunday.<br>
            <strong>Maria:</strong> Hi, Alex, <span class="highlightable" data-q="11">it's only Tuesday today! I went on a school trip to the Science Museum yesterday.</span><br>
            <strong>Alex:</strong> I didn't know it was open on Monday! <span class="highlightable" data-q="12">I've already been there a few times with my aunt and uncle</span>, it's not far from my house. But I'd really like to go with my class or a group of friends.<br>
            <strong>Maria:</strong> Oh… right.<br>
            <strong>Alex:</strong> How did you get there? It's a bit far to walk from school, isn't it?<br>
            <strong>Maria:</strong> We went by coach.<br>
            <strong>Alex:</strong> Lucky you! <span class="highlightable" data-q="13">We usually cycle there</span> – it's good exercise. <span class="highlightable" data-q="14">What did you like best at the museum?</span><br>
            <strong>Maria:</strong> The museum guide showed us a model of the moon, but <span class="highlightable" data-q="14">it wasn't as good as the film that we saw about space travel.</span><br>
            <strong>Alex:</strong> <span class="highlightable" data-q="15">Did you go to the café? They do great chocolate cake!</span><br>
            <strong>Maria:</strong> I know, I thought their cakes and ice creams looked great, but we had to hurry, so <span class="highlightable" data-q="15">I just had a glass of juice.</span> I'd really like to go there again.</p>

            <p><em>That is the end of Part Three.</em></p>
            `,

            questions: [
                { num: 11, text: "Maria went to the museum", options: ["on Sunday.", "on Monday.", "on Tuesday."] },
                { num: 12, text: "Alex usually goes to the museum with his", options: ["class.", "friends.", "family."] },
                { num: 13, text: "Alex usually travels to the museum", options: ["by bike.", "by bus.", "on foot."] },
                { num: 14, text: "What did Maria prefer at the museum?", options: ["talking to the guide", "watching a video", "making a model"] },
                { num: 15, text: "In the café, Maria had", options: ["a cake.", "an ice cream.", "a drink."] }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest4Part3Data);
            console.log('KET 4 Test 4 Listening Part 3 loaded');
        });
    </script>
</body>

</html>
