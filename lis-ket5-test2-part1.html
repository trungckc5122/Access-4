<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KET 5 - Test 2 - Listening Part 1</title>
    <link rel="stylesheet" href="listening-pet-common.css" id="styleLink">
    <style>
        .question-item img {
            max-width: 760px !important;
            width: 100%;
            display: block;
        }

        .question-item .options {
            display: grid !important;
            grid-template-columns: 1fr 1fr 1fr;
            max-width: 760px;
            margin-top: 15px;
            gap: 15px;
        }

        .question-item .option {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            margin-bottom: 0 !important;
            padding: 10px 0 !important;
        }

        .question-item .option label {
            margin-left: 8px !important;
            flex: 0 1 auto !important;
            width: auto !important;
        }
    </style>
</head>

<body>
    <div class="test-wrapper" id="testWrapper">
        <!-- Header -->
        <div class="ielts-header">
            <div class="brand">
                <div class="ielts-logo">KET</div>
                <div class="candidate"></div>
                <div class="audio-controls">
                    <audio id="listeningAudio" controls>
                        <source src="audio/KET 5 - Test 2 Part 1.mp3" type="audio/mpeg">
                    </audio>
                    <select class="speed-select" id="speedSelect">
                        <option value="0.7">0.7x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1x</option>
                        <option value="1.1">1.1x</option>
                        <option value="1.25">1.25x</option>
                    </select>
                    <span class="volume-icon">🔊</span>
                </div>
            </div>
        </div>

        <!-- Question navigator -->
        <div class="question-nav">
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">
            <!-- Transcript panel -->
            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 1–5</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 1 &nbsp; Questions 1–5</h3>
                        <p><em>For each question, choose the correct answer.</em></p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>
            <div class="explanation-header">
                <span id="explanationTitle">Giải thích</span>
                <span class="close-btn" id="closeExplanation">✕ Đóng</span>
            </div>
            <div class="explanation-content" id="explanationText"></div>
        </div>
    </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest2Part1Data = {
            title: "KET 5 · Test 2 · Listening Part 1",
            type: "multiple-choice",
            part: 1,
            book: 5,
            test: 2,

            answerKey: { q1: 'B', q2: 'A', q3: 'C', q4: 'A', q5: 'A' },
            displayAnswers: { q1: 'B', q2: 'A', q3: 'C', q4: 'A', q5: 'A' },

            detailedExplanations: {
                q1: `<strong>Đáp án: B – Sa mạc (desert)</strong><br>
                      Cô gái nói: <em>"first I wanted to do something about oceans, but then I decided to do it on some of the largest deserts in the world."</em><br>
                      Đề tài dự án địa lý của cô gái là các sa mạc lớn nhất thế giới.<br><br>
                      <strong>✗ A (đại dương) sai:</strong> Cô gái đã nghĩ đến đại dương nhưng sau đó đổi ý.<br>
                      <strong>✗ C (rừng) sai:</strong> Đó là đề tài của cậu bé, không phải cô gái.<br>
                      <strong>✓ B là đáp án chính xác – sa mạc.</strong>`,

                q2: `<strong>Đáp án: A – Thư viện (library)</strong><br>
                      Janine nói: <em>"first I have to pick up a book from the library. I need it before the next lesson."</em><br>
                      Nathan đồng ý: <em>"Then let's go get it, so we can have lunch together."</em> → Họ đi thư viện trước.<br><br>
                      <strong>✗ B (căng-tin) sai:</strong> Căng-tin là nơi họ định đến nhưng sau khi ghé thư viện.<br>
                      <strong>✗ C (phòng hoá học) sai:</strong> Đó là lớp học tiếp theo sau bữa trưa.<br>
                      <strong>✓ A là đáp án chính xác – thư viện.</strong>`,

                q3: `<strong>Đáp án: C – Ở lại nói chuyện với giáo viên (talking to a teacher)</strong><br>
                      Cô bé nói: <em>"I had to stay after class to talk to Mrs Patterson about part of the history homework that I didn't really understand."</em><br><br>
                      <strong>✗ A (gặp bạn bè) sai:</strong> Gọi điện cho bạn là việc cô sẽ làm sau khi về nhà.<br>
                      <strong>✗ B (luyện bóng rổ) sai:</strong> Bố hỏi điều đó nhưng Jessica nói luyện tập là ngày mai.<br>
                      <strong>✓ C là đáp án chính xác – ở lại nói chuyện với cô giáo về bài lịch sử.</strong>`,

                q4: `<strong>Đáp án: A – Tạp chí (magazine)</strong><br>
                      Cậu bé nói: <em>"Grandpa gave me a magazine with an article with some interesting facts, but that's all."</em> → Đó là nguồn thông tin duy nhất cậu đã tìm được.<br><br>
                      <strong>✗ B (máy tính / internet) sai:</strong> Cậu đang tìm kiếm trên internet nhưng chưa tìm được gì hữu ích.<br>
                      <strong>✗ C (sách) sai:</strong> Mẹ gợi ý sách nhưng cậu chưa kiểm tra.<br>
                      <strong>✓ A là đáp án chính xác – tạp chí do ông nội đưa.</strong>`,

                q5: `<strong>Đáp án: A – Chụp ảnh (taking photos)</strong><br>
                      Cô gái nói: <em>"she wants her friends to do different things for her party. I've got to take photos of everyone for her blog."</em><br><br>
                      <strong>✗ B (làm bánh) sai:</strong> Cô gái nói "I think so" khi được hỏi về bánh, nhưng đó không phải việc cô ấy làm.<br>
                      <strong>✗ C (chơi guitar) sai:</strong> Đó là việc của người khác ("someone else is going to play the guitar").<br>
                      <strong>✓ A là đáp án chính xác – chụp ảnh cho blog của Jessie.</strong>`
            },

            transcript: `
            <p><strong>PART 1</strong></p>
            <p><em>For each question, choose the correct answer.</em></p>

            <p><strong>Question 1</strong><br>
            <strong>Girl:</strong> Isn't your geography project about forests?<br>
            <strong>Boy:</strong> It's only about one forest in South America. What's yours about?<br>
            <strong>Girl:</strong> Well, <span class="highlightable" data-q="1">first I wanted to do something about oceans, but then I decided to do it on some of the largest deserts in the world.</span><br>
            <strong>Boy:</strong> Cool. I think it's amazing that plants and animals can live in places that have very little water.</p>

            <p><strong>Question 2</strong><br>
            <strong>Nathan:</strong> Hey Janine. Are you on your way to the cafeteria? They're serving that really good pasta dish today!<br>
            <strong>Janine:</strong> Oh, hey Nathan. Yeah, but <span class="highlightable" data-q="2">first I have to pick up a book from the library. I need it before the next lesson.</span><br>
            <strong>Nathan:</strong> You mean for our chemistry class that's after lunch? <span class="highlightable" data-q="2">Then let's go get it, so we can have lunch together.</span><br>
            <strong>Janine:</strong> Sure.</p>

            <p><strong>Question 3</strong><br>
            <strong>Man:</strong> Jessica, why are you home so late? Isn't basketball practice tomorrow after school?<br>
            <strong>Girl:</strong> That's right, Dad. <span class="highlightable" data-q="3">I had to stay after class to talk to Mrs Patterson about part of the history homework that I didn't really understand.</span><br>
            <strong>Man:</strong> Oh, that's alright then.<br>
            <strong>Girl:</strong> Great. So now I need to call my classmates to give them the information.</p>

            <p><strong>Question 4</strong><br>
            <strong>Woman:</strong> Jonathan, what are you doing on the internet?<br>
            <strong>Boy:</strong> I'm doing my homework, Mum. I'm looking for some information about elephants, but I haven't found anything I can use yet. <span class="highlightable" data-q="4">Grandpa gave me a magazine with an article with some interesting facts, but that's all.</span><br>
            <strong>Woman:</strong> Well, we've got lots of books about animals. Have you checked any of those?<br>
            <strong>Boy:</strong> I'll do that next.</p>

            <p><strong>Question 5</strong><br>
            <strong>Man:</strong> You're going to Jessie's birthday party soon, aren't you?<br>
            <strong>Girl:</strong> Yeah, she doesn't want anyone to give her gifts this year, Dad. Instead, she wants her friends to do different things for her party. <span class="highlightable" data-q="5">I've got to take photos of everyone for her blog.</span><br>
            <strong>Man:</strong> Will someone bake her a cake?<br>
            <strong>Girl:</strong> Yes, I think so. And someone else is going to play the guitar.</p>

            <p><em>That is the end of Part One.</em></p>
            `,

            questions: [
                { num: 1, text: "What's the subject of the girl's geography project?<br><img src='img-ket/ket 5-test 2-1.png' alt='Question 1' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 2, text: "Where do the two friends decide to go first?<br><img src='img-ket/ket 5-test 2-2.png' alt='Question 2' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 3, text: "Why has the girl come home late?<br><img src='img-ket/ket 5-test 2-3.png' alt='Question 3' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 4, text: "Where has the boy already found some useful information about elephants?<br><img src='img-ket/ket 5-test 2-4.png' alt='Question 4' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 5, text: "What will the girl do for her friend's birthday party?<br><img src='img-ket/ket 5-test 2-5.png' alt='Question 5' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest2Part1Data);
            console.log('KET 5 Test 2 Listening Part 1 loaded');
        });
    </script>
</body>

</html>
