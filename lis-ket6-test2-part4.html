<body>

        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">
            <!-- Transcript panel -->
            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 16–20</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 4 &nbsp; Questions 16–20</h3>
                        <p><em>For each question, choose the correct answer.</em></p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest2Part4Data = {
            title: "KET 6 · Test 2 · Listening Part 4",
            type: "multiple-choice",
            part: 4,
            book: 6,
            test: 2,

            answerKey: { q16: 'B', q17: 'A', q18: 'C', q19: 'C', q20: 'B' },
            displayAnswers: { q16: 'B', q17: 'A', q18: 'C', q19: 'C', q20: 'B' },

            detailedExplanations: {
                q16: `<strong>Đáp án: B – a member of her family</strong><br>
                      Teresa nói: <em>"<span class='keyword-highlight'>My aunt's picking me up today because we're going into the centre to buy some birthday presents.</span>"</em><br>
                      Người đón Teresa là dì (aunt) – thành viên gia đình.<br><br>
                      <strong>✗ A (a classmate) sai:</strong> Steve đề nghị cô đưa em trai cậu đi (bạn cùng lớp Teresa), nhưng đó không phải người Teresa đang chờ.<br>
                      <strong>✗ C (a teacher) sai:</strong> Mr Harrison là huấn luyện viên thể thao, không phải người đến đón Teresa.<br>
                      <strong>✓ B (a member of her family) là đáp án chính xác – dì của Teresa.</strong>`,

                q17: `<strong>Đáp án: A – to ask about something</strong><br>
                      Cậu bé nói: <em>"<span class='keyword-highlight'>If it's OK with you, I'd like to go to Frank's house after school because we want to work on our science project together.</span>"</em><br>
                      Cậu gọi để xin phép mẹ – tức là hỏi về một điều gì đó.<br><br>
                      <strong>✗ B (to give her some news) sai:</strong> Đây không phải tin tức mà là một yêu cầu cần được chấp thuận.<br>
                      <strong>✗ C (to say sorry for something) sai:</strong> Cậu bé không xin lỗi điều gì, chỉ báo trước về bữa tối ở nhà Frank.<br>
                      <strong>✓ A (to ask about something) là đáp án chính xác – xin phép đến nhà bạn.</strong>`,

                q18: `<strong>Đáp án: C – They'll look at a poster</strong><br>
                      Cậu bé hỏi: <em>"Isn't there a big notice about it on the wall in the library?"</em><br>
                      Cô gái xác nhận và cậu đề xuất: <em>"<span class='keyword-highlight'>You're right, let's go and read it.</span>"</em><br>
                      Họ quyết định đến thư viện xem tờ thông báo (notice = poster) dán trên tường.<br><br>
                      <strong>✗ A (They'll ask another friend) sai:</strong> Sophia đã đến quán café nhưng họ không đề cập đến việc hỏi cô ấy về địa chỉ.<br>
                      <strong>✗ B (They'll check on the internet) sai:</strong> Cô gái đã thử online nhưng wifi không hoạt động ("wi-fi wasn't working").<br>
                      <strong>✓ C (They'll look at a poster) là đáp án chính xác – xem thông báo trên tường thư viện.</strong>`,

                q19: `<strong>Đáp án: C – They know the guide</strong><br>
                      Bố nói: <em>"<span class='keyword-highlight'>Uncle Pablo works for the tour company and he's telling tourists about the history of the town when they're on the boat today!</span>"</em><br>
                      Cả hai muốn đi vì chú Pablo – người hướng dẫn viên mà họ quen biết – đang dẫn tour hôm nay.<br><br>
                      <strong>✗ A (It's cheap today) sai:</strong> Bố nói "It isn't cheaper" khi đặt vé online, chỉ là thuận tiện hơn.<br>
                      <strong>✗ B (The weather's good) sai:</strong> Cô bé nói "I don't mind that the weather's a bit cloudy" – thời tiết không phải lý do quyết định.<br>
                      <strong>✓ C (They know the guide) là đáp án chính xác – chú Pablo là hướng dẫn viên hôm đó.</strong>`,

                q20: `<strong>Đáp án: B – help the school secretary</strong><br>
                      Giáo viên nói: <em>"<span class='keyword-highlight'>Mrs Spencer, who works in the office, needs a pupil to take some boxes to the computer room.</span>"</em><br>
                      Mrs Spencer làm việc ở văn phòng = thư ký trường (school secretary). Hugo phải giúp bà ấy trước.<br><br>
                      <strong>✗ A (help another teacher) sai:</strong> Hugo đề nghị mang sách đến thư viện cho giáo viên, nhưng thầy từ chối.<br>
                      <strong>✗ C (help another student) sai:</strong> Không có đề cập đến việc giúp học sinh khác.<br>
                      <strong>✓ B (help the school secretary) là đáp án chính xác – mang hộp đến phòng máy tính cho Mrs Spencer.</strong>`
            },

            transcript: `
            <p><strong>PART 4</strong></p>
            <p><em>For each question, choose the correct answer.</em></p>

            <p><strong>Question 16</strong><br>
            You will hear a girl, Teresa, talking to her friend. Who's Teresa waiting for?<br>
            <strong>Steve:</strong> Hi Teresa, why are you waiting outside the school gates?<br>
            <strong>Teresa:</strong> <span class="highlightable" data-q="16">My aunt's picking me up today because we're going into the centre to buy some birthday presents.</span><br>
            <strong>Steve:</strong> Do you think she'd take my brother? She knows him. He's in your class. He's talking to Mr Harrison, the new sports coach, over there.<br>
            <strong>Teresa:</strong> Let's ask her. That's her car.</p>

            <p><strong>Question 17</strong><br>
            You will hear a boy phoning his mother. Why is he phoning her?<br>
            <strong>Boy:</strong> Mum, I'm still at school at the moment. <span class="highlightable" data-q="17">If it's OK with you, I'd like to go to Frank's house after school because we want to work on our science project together.</span> All right? And Frank's mum's said I can have dinner with them too. I hope you haven't already cooked something for me.</p>

            <p><strong>Question 18</strong><br>
            You will hear two friends talking about a new café. How will they find out where the new café is?<br>
            <strong>Boy:</strong> Let's go to that new café after school. Do you know where it is?<br>
            <strong>Girl:</strong> I tried to go online earlier to find out, but the wi-fi wasn't working. Isn't there a big notice about it on the wall in the library?<br>
            <strong>Boy:</strong> <span class="highlightable" data-q="18">You're right, let's go and read it.</span> Has anyone in our class been to the café yet?<br>
            <strong>Girl:</strong> Sophia has.</p>

            <p><strong>Question 19</strong><br>
            You hear a girl and her dad talking about a boat tour. Why do they decide to go on the boat tour today?<br>
            <strong>Dad:</strong> How about going on a boat tour today?<br>
            <strong>Girl:</strong> Yes! I don't mind that the weather's a bit cloudy.<br>
            <strong>Dad:</strong> <span class="highlightable" data-q="19">Uncle Pablo works for the tour company and he's telling tourists about the history of the town when they're on the boat today!</span><br>
            <strong>Girl:</strong> I'd love to hear him!<br>
            <strong>Dad:</strong> Me too. I'll book our tickets online. It isn't cheaper, but it's more convenient.</p>

            <p><strong>Question 20</strong><br>
            You will hear a boy, Hugo, talking to his teacher. What must Hugo do first?<br>
            <strong>Male:</strong> Hugo, are you free after my lesson?<br>
            <strong>Hugo:</strong> Yes, would you like me to take these books to the library for you?<br>
            <strong>Man:</strong> Thank you, but actually, <span class="highlightable" data-q="20">Mrs Spencer, who works in the office, needs a pupil to take some boxes to the computer room.</span><br>
            <strong>Hugo:</strong> OK, fine.<br>
            <strong>Man:</strong> Thank you. I've got to show Year 6 how to upload their projects.</p>

            <p><em>That is the end of Part Four.</em></p>
            `,

            questions: [
                {
                    num: 16,
                    text: "You will hear a girl, Teresa, talking to her friend. Who's Teresa waiting for?",
                    options: ["a classmate", "a member of her family", "a teacher"]
                },
                {
                    num: 17,
                    text: "You will hear a boy phoning his mother. Why is he phoning her?",
                    options: ["to ask about something", "to give her some news", "to say sorry for something"]
                },
                {
                    num: 18,
                    text: "You will hear two friends talking about a new café. How will they find out where the new café is?",
                    options: ["They'll ask another friend.", "They'll check on the internet.", "They'll look at a poster."]
                },
                {
                    num: 19,
                    text: "You hear a girl and her dad talking about a boat tour. Why do they decide to go on the boat tour today?",
                    options: ["It's cheap today.", "The weather's good.", "They know the guide."]
                },
                {
                    num: 20,
                    text: "You will hear a boy, Hugo, talking to his teacher. What must Hugo do first?",
                    options: ["help another teacher", "help the school secretary", "help another student"]
                }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest2Part4Data);
            console.log('KET 6 Test 2 Listening Part 4 loaded');
        });
    </script>
