<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KET 5 - Test 1 - Listening Part 1</title>
    <link rel="stylesheet" href="listening-pet-common.css" id="styleLink">
    <style>
        .question-item img {
            max-width: 760px !important;
            width: 100%;
            display: block;
        }

        .question-item .options {
            display: grid !important;
            grid-template-columns: 1fr 1fr 1fr;
            max-width: 760px;
            margin-top: 15px;
            gap: 15px;
        }

        .question-item .option {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            margin-bottom: 0 !important;
            padding: 10px 0 !important;
        }

        .question-item .option label {
            margin-left: 8px !important;
            flex: 0 1 auto !important;
            width: auto !important;
        }
    </style>
</head>

<body>
    <div class="test-wrapper" id="testWrapper">
        <!-- Header -->
        <div class="ielts-header">
            <div class="brand">
                <div class="ielts-logo">KET</div>
                <div class="candidate"></div>
                <div class="audio-controls">
                    <audio id="listeningAudio" controls>
                        <source src="audio/KET 5 - Test 1 Part 1.mp3" type="audio/mpeg">
                    </audio>
                    <select class="speed-select" id="speedSelect">
                        <option value="0.7">0.7x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1x</option>
                        <option value="1.1">1.1x</option>
                        <option value="1.25">1.25x</option>
                    </select>
                    <span class="volume-icon">🔊</span>
                </div>
            </div>
        </div>

        <!-- Question navigator -->
        <div class="question-nav">
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">
            <!-- Transcript panel -->
            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 1–5</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 1 &nbsp; Questions 1–5</h3>
                        <p><em>For each question, choose the correct answer.</em></p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>
            <div class="explanation-header">
                <span id="explanationTitle">Giải thích</span>
                <span class="close-btn" id="closeExplanation">✕ Đóng</span>
            </div>
            <div class="explanation-content" id="explanationText"></div>
        </div>
    </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest1Part1Data = {
            title: "KET 5 · Test 1 · Listening Part 1",
            type: "multiple-choice",
            part: 1,
            book: 5,
            test: 1,

            answerKey: { q1: 'C', q2: 'C', q3: 'B', q4: 'B', q5: 'C' },
            displayAnswers: { q1: 'C', q2: 'C', q3: 'B', q4: 'B', q5: 'C' },

            detailedExplanations: {
                q1: `<strong>Đáp án: C – 23rd</strong><br>
                      Cậu bé nói: <em>"I wanted to have it this Saturday – the 16th – but my dad's away for work. So I chose <span class='keyword-highlight'>next Saturday instead – that's the 23rd.</span>"</em><br>
                      <strong>✗ A (16th) sai:</strong> Ngày cậu muốn nhưng bố bận.<br>
                      <strong>✗ B (20th) sai:</strong> Đó là ngày sinh nhật thật, không phải ngày tiệc.<br>
                      <strong>✓ C (23rd) là đúng – Bữa tiệc tổ chức vào thứ Bảy ngày 23.</strong>`,

                q2: `<strong>Đáp án: C – 3:30</strong><br>
                      Cô gái nói: <em>"we aren't playing till <span class='keyword-highlight'>half past three</span> today – our teacher can't get there till quarter past."</em><br>
                      <strong>✗ A (2:30) sai:</strong> Đó là giờ hiện tại khi bố nhắc.<br>
                      <strong>✗ B (3:15) sai:</strong> Đó là giờ giáo viên có mặt, không phải giờ bắt đầu.<br>
                      <strong>✓ C (3:30) là đúng – Trận đấu bắt đầu lúc 3 giờ rưỡi.</strong>`,

                q3: `<strong>Đáp án: B – Skateboard T-shirt</strong><br>
                      Cậu bé nói: <em>"I mean the other one, with <span class='keyword-highlight'>the skateboard on it.</span>"</em><br>
                      <strong>✗ A (Moon) sai:</strong> Chiếc đó ở bên cạnh, cậu không chọn.<br>
                      <strong>✗ C (Lion) sai:</strong> Mẹ nhầm tưởng là lion nhưng cậu sửa lại.<br>
                      <strong>✓ B (Skateboard) là đúng – Cậu muốn chiếc có hình ván trượt.</strong>`,

                q4: `<strong>Đáp án: B – £6.50</strong><br>
                      Cậu bé hỏi: <em>"I'll give you the money tomorrow – <span class='keyword-highlight'>six pounds fifty</span>, right?"</em> và cô gái xác nhận: <em>"That's right."</em><br>
                      <strong>✗ A (£2.25) sai:</strong> Đó là khoản tiền thêm nếu mua tại chỗ so với giá online.<br>
                      <strong>✗ C (£8.75) sai:</strong> Đó là giá bán tại ngày biểu diễn.<br>
                      <strong>✓ B (£6.50) là đúng – Giá mỗi vé đặt online.</strong>`,

                q5: `<strong>Đáp án: C – Grandfather (old man with stick)</strong><br>
                      Cậu bé nói: <em>"It was his <span class='keyword-highlight'>grandfather</span>"</em> khi được hỏi ai đón Ben.<br>
                      Người mẹ hỏi có phải bố Ben không nhưng cậu bé đính chính.<br>
                      <strong>✗ A (Young man) sai:</strong> Không phải người đến đón.<br>
                      <strong>✗ B (Dad) sai:</strong> Mẹ đoán vậy nhưng sai.<br>
                      <strong>✓ C (Grandfather) là đúng – Ông của Ben đến đón.</strong>`
            },

            transcript: `
            <p><strong>Listening – Test One</strong></p>
            <p>There are five parts to the test. You will hear each piece twice.</p>
            <p><em>We will now stop for a moment. Please ask any questions now because you must NOT speak during the test.</em></p>

            <p><strong>PART 1</strong></p>
            <p><em>Now look at the instructions for Part One. For each question, choose the correct answer. Look at question one.</em></p>

            <p><strong>Question 1</strong><br>
            <em>One. When is the party?</em><br>
            <strong>Boy:</strong> Are you coming to my birthday party?<br>
            <strong>Girl:</strong> Yeah, when is it?<br>
            <strong>Boy:</strong> I wanted to have it this Saturday – the 16th – but my dad's away for work. So I chose <span class="highlightable" data-q="1">next Saturday instead – that's the 23rd.</span> My birthday's actually on the 20th but I don't mind.<br>
            <strong>Girl:</strong> Great! Can't wait.<br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 2</strong><br>
            <em>Two. What time does the football match begin?</em><br>
            <strong>Dad:</strong> Aren't you playing football this afternoon?<br>
            <strong>Girl:</strong> Yeah, Dad, I'm going to get my things in a minute.<br>
            <strong>Dad:</strong> But it's already half past two.<br>
            <strong>Girl:</strong> I know, but <span class="highlightable" data-q="2">we aren't playing till half past three today</span> – our teacher can't get there till quarter past.<br>
            <strong>Dad:</strong> Oh, OK. We can leave home a bit later then.<br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 3</strong><br>
            <em>Three. Which T-shirt would the boy like?</em><br>
            <strong>Boy:</strong> I love the picture on that T-shirt, Mum.<br>
            <strong>Mum:</strong> Oh, is that a lion on the front?<br>
            <strong>Boy:</strong> I mean the other one, <span class="highlightable" data-q="3">with the skateboard on it.</span> It's over there, next to the one with the moon on it, look!<br>
            <strong>Mum:</strong> Yeah, I really like that. Shall we get it?<br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 4</strong><br>
            <em>Four. How much has the girl paid for each ticket?</em><br>
            <strong>Girl:</strong> I've got the tickets for the school concert!<br>
            <strong>Boy:</strong> Great – I'll give you the money tomorrow – <span class="highlightable" data-q="4">six pounds fifty</span>, right?<br>
            <strong>Girl:</strong> That's right. It's good that my dad booked them online because you have to pay more on the day of the concert – they're eight seventy-five then.<br>
            <strong>Boy:</strong> Two pounds twenty-five extra! That's a lot!<br>
            <strong>Girl:</strong> Yeah, it is.<br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 5</strong><br>
            <em>Five. Who did they have dinner with yesterday evening?</em><br>
            <strong>Woman:</strong> It was great last night. I love it when someone else joins us for dinner.<br>
            <strong>Boy:</strong> Yeah – it was nice to spend time with my classmate Ben!<br>
            <strong>Woman:</strong> By the way, who was that who picked him up afterwards? Was it his dad?<br>
            <strong>Boy:</strong> Actually, it was <span class="highlightable" data-q="5">his grandfather.</span><br>
            <em>Now listen again. [repeat]</em></p>

            <p><em>That is the end of Part One.</em></p>
            `,

            questions: [
                { num: 1, text: "When is the party?<br><img src='img-ket/ket 5-test 1-1.png' alt='Question 1' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 2, text: "What time does the football match begin?<br><img src='img-ket/ket 5-test 1-2.png' alt='Question 2' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 3, text: "Which T-shirt would the boy like?<br><img src='img-ket/ket 5-test 1-3.png' alt='Question 3' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 4, text: "How much has the girl paid for each ticket?<br><img src='img-ket/ket 5-test 1-4.png' alt='Question 4' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 5, text: "Who did they have dinner with yesterday evening?<br><img src='img-ket/ket 5-test 1-5.png' alt='Question 5' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest1Part1Data);
            console.log('KET 5 Test 2 Listening Part 1 loaded');
        });
    </script>
</body>

</html>
