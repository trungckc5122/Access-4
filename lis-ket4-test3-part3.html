<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KET 4 - Test 3 - Listening Part 3</title>
    <link rel="stylesheet" href="listening-pet-common.css" id="styleLink">
</head>

<body>
    <div class="test-wrapper" id="testWrapper">
        <!-- Header -->
        <div class="ielts-header">
            <div class="brand">
                <div class="ielts-logo">KET</div>
                <div class="candidate"></div>
                <div class="audio-controls">
                    <audio id="listeningAudio" controls>
                        <source src="audio/KET 4 - Test 3 Part 3.mp3" type="audio/mpeg">
                    </audio>
                    <select class="speed-select" id="speedSelect">
                        <option value="0.7">0.7x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1x</option>
                        <option value="1.1">1.1x</option>
                        <option value="1.25">1.25x</option>
                    </select>
                    <span class="volume-icon">🔊</span>
                </div>
            </div>
        </div>

        <!-- Question navigator -->
        <div class="question-nav">
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">
            <!-- Transcript panel -->
            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 11–15</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 3 &nbsp; Questions 11–15</h3>
                        <p><em>For each question, choose the correct answer.</em></p>
                        <p style="margin-bottom:8px;">You will hear Teresa talking to her friend Daniel about a school
                            writing competition.</p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>
            <div class="explanation-header">
                <span id="explanationTitle">Giải thích</span>
                <span class="close-btn" id="closeExplanation">✕ Đóng</span>
            </div>
            <div class="explanation-content" id="explanationText"></div>
        </div>
    </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest3Part3Data = {
            title: "KET 4 · Test 3 · Listening Part 3",
            type: "multiple-choice",
            part: 3,
            book: 4,
            test: 3,

            answerKey: { q11: 'C', q12: 'A', q13: 'A', q14: 'B', q15: 'B' },
            displayAnswers: { q11: 'C', q12: 'A', q13: 'A', q14: 'B', q15: 'B' },

            detailedExplanations: {
                q11: `<strong>Đáp án: C – a person she knows</strong><br>
                      Daniel hỏi: <em>"What did you write about?"</em><br>
                      Teresa đáp: <em>"That film was great! I couldn't decide between writing about my grandma's life or writing about the island I went to on holiday. <span class='keyword-highlight'>I've chosen the first one</span> – there's so much to say!"</em><br>
                      "The first one" là viết về cuộc đời bà của cô (my grandma's life) – một người mà cô biết.<br><br>
                      <strong>✗ A (a place she visited) sai:</strong> Đây là lựa chọn thứ hai ("writing about the island I went to on holiday") nhưng Teresa không chọn.<br>
                      <strong>✗ B (a film she watched) sai:</strong> Daniel đã chọn viết về bộ phim ("That movie we saw last week"), không phải Teresa.<br>
                      <strong>✓ C (a person she knows) là đáp án chính xác.</strong>`,

                q12: `<strong>Đáp án: A – 500 or less</strong><br>
                      Teresa nói: <em>"It's from five hundred to a thousand, isn't it?"</em><br>
                      Daniel đáp: <em>"<span class='keyword-highlight'>It's five hundred at the most, actually.</span>"</em><br>
                      Số từ tối đa là 500.<br><br>
                      <strong>✗ B (between 500 and 1000) sai:</strong> Teresa nghĩ vậy nhưng Daniel sửa lại.<br>
                      <strong>✗ C (as many as they want) sai:</strong> Daniel nói rõ giới hạn 500 từ.<br>
                      <strong>✓ A (500 or less) là đáp án chính xác.</strong>`,

                q13: `<strong>Đáp án: A – worried</strong><br>
                      Teresa hỏi: <em>"And how did you feel after you finished?"</em><br>
                      Daniel đáp: <em>"I wasn't tired, just <span class='keyword-highlight'>worried</span> people might say it's really bad, because I don't think what I've written is very exciting!"</em><br>
                      Daniel cảm thấy lo lắng.<br><br>
                      <strong>✗ B (excited) sai:</strong> Daniel không nói là hào hứng.<br>
                      <strong>✗ C (tired) sai:</strong> Daniel nói rõ "I wasn't tired".<br>
                      <strong>✓ A (worried) là đáp án chính xác.</strong>`,

                q14: `<strong>Đáp án: B – a tablet</strong><br>
                      Daniel hỏi: <em>"If you win, <span class='keyword-highlight'>what will you use the tablet for?</span>"</em><br>
                      Câu hỏi xác nhận giải thưởng là máy tính bảng (tablet).<br><br>
                      <strong>✗ A (a laptop) sai:</strong> Teresa nói cô sẽ dùng tablet cho mọi thứ cô dùng laptop ("Everything I use a laptop for") nhưng giải thưởng không phải laptop.<br>
                      <strong>✗ C (some books) sai:</strong> Teresa nói sẽ đọc sách trên tablet ("I'll be able to read books on it"), nhưng không phải giải thưởng.<br>
                      <strong>✓ B (a tablet) là đáp án chính xác.</strong>`,

                q15: `<strong>Đáp án: B – writing stories</strong><br>
                      Daniel nói: <em>"You have a good chance of winning, <span class='keyword-highlight'>you're great at writing stories.</span>"</em><br>
                      Teresa đáp: <em>"Well, I'm better at that than just describing places. But I'm not sure my spelling's good enough."</em><br>
                      Teresa thừa nhận cô giỏi viết chuyện (writing stories).<br><br>
                      <strong>✗ A (spelling) sai:</strong> Teresa nói không chắc chắn về chính tả ("not sure my spelling's good enough").<br>
                      <strong>✗ C (describing places) sai:</strong> Teresa nói cô giỏi viết chuyện hơn là miêu tả địa điểm ("better at that than just describing places").<br>
                      <strong>✓ B (writing stories) là đáp án chính xác.</strong>`
            },

            transcript: `
            <p><strong>PART 3</strong></p>
            <p><em>For each question, choose the correct answer.</em></p>
            <p>You will hear Teresa talking to her friend Daniel about a school writing competition.</p>

            <p><strong>Teresa:</strong> Hi, Daniel, have you done your writing for the competition yet?<br>
            <strong>Daniel:</strong> Hi, Teresa, I finished it yesterday.<br>
            <strong>Teresa:</strong> Wow! What did you write about?<br>
            <strong>Daniel:</strong> That movie we saw last week. What about you?<br>
            <strong>Teresa:</strong> That film was great! <span class="highlightable" data-q="11">I couldn't decide between writing about my grandma's life or writing about the island I went to on holiday. I've chosen the first one</span> – there's so much to say!<br>
            <strong>Daniel:</strong> You can't write as many words as you want.<br>
            <strong>Teresa:</strong> It's from five hundred to a thousand, isn't it?<br>
            <strong>Daniel:</strong> <span class="highlightable" data-q="12">It's five hundred at the most, actually.</span><br>
            <strong>Teresa:</strong> And how did you feel after you finished?<br>
            <strong>Daniel:</strong> <span class="highlightable" data-q="13">I wasn't tired, just worried people might say it's really bad</span>, because I don't think what I've written is very exciting!<br>
            <strong>Teresa:</strong> It'll be fine.<br>
            <strong>Daniel:</strong> <span class="highlightable" data-q="14">If you win, what will you use the tablet for?</span><br>
            <strong>Teresa:</strong> Everything I use a laptop for, and I'll be able to read books on it.<br>
            <strong>Daniel:</strong> You have a good chance of winning, <span class="highlightable" data-q="15">you're great at writing stories.</span><br>
            <strong>Teresa:</strong> Well, I'm better at that than just describing places. But I'm not sure my spelling's good enough.</p>

            <p><em>That is the end of Part Three.</em></p>
            `,

            questions: [
                { num: 11, text: "What has Teresa decided to write about?", options: ["a place she visited", "a film she watched", "a person she knows"] },
                { num: 12, text: "How many words do students have to write for the competition?", options: ["500 or less", "between 500 and 1000", "as many as they want"] },
                { num: 13, text: "How did Daniel feel after he finished his writing?", options: ["worried", "excited", "tired"] },
                { num: 14, text: "What's the prize for winning the competition?", options: ["a laptop", "a tablet", "some books"] },
                { num: 15, text: "Teresa thinks she is good at", options: ["spelling.", "writing stories.", "describing places."] }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest3Part3Data);
            console.log('KET 4 Test 3 Listening Part 3 loaded');
        });
    </script>
</body>

</html>
