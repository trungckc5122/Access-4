<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KET 4 - Test 3 - Listening Part 1</title>
    <link rel="stylesheet" href="listening-pet-common.css" id="styleLink">
    <style>
        .question-item img {
            max-width: 760px !important;
            width: 100%;
            display: block;
        }

        .question-item .options {
            display: grid !important;
            grid-template-columns: 1fr 1fr 1fr;
            max-width: 760px;
            margin-top: 15px;
            gap: 15px;
        }

        .question-item .option {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            margin-bottom: 0 !important;
            padding: 10px 0 !important;
        }

        .question-item .option label {
            margin-left: 8px !important;
            flex: 0 1 auto !important;
            width: auto !important;
        }
    </style>
</head>

<body>
    <div class="test-wrapper" id="testWrapper">
        <!-- Header -->
        <div class="ielts-header">
            <div class="brand">
                <div class="ielts-logo">KET</div>
                <div class="candidate"></div>
                <div class="audio-controls">
                    <audio id="listeningAudio" controls>
                        <source src="audio/KET 4 - Test 3 Part 1.mp3" type="audio/mpeg">
                    </audio>
                    <select class="speed-select" id="speedSelect">
                        <option value="0.7">0.7x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1x</option>
                        <option value="1.1">1.1x</option>
                        <option value="1.25">1.25x</option>
                    </select>
                    <span class="volume-icon">🔊</span>
                </div>
            </div>
        </div>

        <!-- Question navigator -->
        <div class="question-nav">
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">
            <!-- Transcript panel -->
            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 1–5</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 1 &nbsp; Questions 1–5</h3>
                        <p><em>For each question, choose the correct answer.</em></p>
                        <p style="margin-bottom:8px;">Look at the pictures and choose the correct answer for each
                            question.</p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>
            <div class="explanation-header">
                <span id="explanationTitle">Giải thích</span>
                <span class="close-btn" id="closeExplanation">✕ Đóng</span>
            </div>
            <div class="explanation-content" id="explanationText"></div>
        </div>
    </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest3Part1Data = {
            title: "KET 4 · Test 3 · Listening Part 1",
            type: "multiple-choice",
            part: 1,
            book: 4,
            test: 3,

            answerKey: { q1: 'A', q2: 'A', q3: 'B', q4: 'A', q5: 'C' },
            displayAnswers: { q1: 'A', q2: 'A', q3: 'B', q4: 'A', q5: 'C' },

            detailedExplanations: {
                q1: `<strong>Đáp án: A – Shoes (giày)</strong><br>
                      Mẹ hỏi: <em>"Sanjay, you go back to school next week. Are there any clothes I need to buy you?"</em><br>
                      Sanjay đáp: <em>"Err… I think I’ve probably got enough trousers, Mum, but <span class='keyword-highlight'>my shoes are too small</span>."</em><br>
                      Anh ấy cần mua giày mới.<br><br>
                      <strong>✗ B (Coat) sai:</strong> Sanjay nói áo khoác ổn ("my coat? Yeah, it's really comfortable!").<br>
                      <strong>✗ C (Trousers) sai:</strong> Anh ấy nói đã có đủ quần ("I've probably got enough trousers").<br>
                      <strong>✓ A (Shoes) là đáp án chính xác.</strong>`,

                q2: `<strong>Đáp án: A – Sheep (con cừu)</strong><br>
                      Andrea đang làm mô hình một con vật. Cậu bé nói: <em>"It looks more like a camel than a sheep."</em><br>
                      Andrea đáp: <em>"Great. <span class='keyword-highlight'>That'll make it clearer what kind of animal it is.</span>"</em> và cậu bé gợi ý cho thêm len trắng để rõ hơn.<br>
                      Vậy cô ấy đang cố gắng làm một con cừu.<br><br>
                      <strong>✗ B (Horse) sai:</strong> Cô ấy đã làm một con ngựa đẹp lần trước ("I made a great horse last time"), không phải lần này.<br>
                      <strong>✗ C (Camel) sai:</strong> Mô hình trông giống lạc đà ("looks more like a camel"), nhưng cô ấy đang cố làm cừu.<br>
                      <strong>✓ A (Sheep) là đáp án chính xác.</strong>`,

                q3: `<strong>Đáp án: B – Windy (có gió)</strong><br>
                      Cô gái hỏi: <em>"Did you go to the beach at the weekend?"</em><br>
                      Cậu bé đáp: <em>"Yeah – the weather was perfect for sailing."</em><br>
                      Cô gái nói: <em>"I know! <span class='keyword-highlight'>It was really windy!</span>"</em><br>
                      Cậu bé nói thêm: <em>"At least it didn't rain like the TV weather man said, and it was quite warm."</em><br>
                      Thời tiết cuối tuần là có gió mạnh.<br><br>
                      <strong>✗ A (Sunny) sai:</strong> Cô gái nói "It's a shame the sun didn't come out" → trời không có nắng.<br>
                      <strong>✗ C (Rainy) sai:</strong> Cậu bé nói trời không mưa ("it didn't rain").<br>
                      <strong>✓ B (Windy) là đáp án chính xác.</strong>`,

                q4: `<strong>Đáp án: A – Omelette (trứng ốp la)</strong><br>
                      Cậu bé hỏi: <em>"Can I have some of those sausages in the fridge?"</em><br>
                      Mẹ đáp: <em>"We're having those for dinner, I'm afraid. <span class='keyword-highlight'>I could make you an omelette?</span> There're lots of eggs."</em><br>
                      Cậu bé đồng ý: <em>"OK, I'd prefer that to sandwiches."</em><br>
                      Vậy cậu sẽ ăn trứng ốp la.<br><br>
                      <strong>✗ B (Sausages) sai:</strong> Xúc xích để dành cho bữa tối ("We're having those for dinner").<br>
                      <strong>✗ C (Sandwiches) sai:</strong> Cậu nói "I'd prefer that to sandwiches" → không chọn bánh mì kẹp.<br>
                      <strong>✓ A (Omelette) là đáp án chính xác.</strong>`,

                q5: `<strong>Đáp án: C – Geography (địa lý)</strong><br>
                      Cô gái nói: <em>"It's great <span class='keyword-highlight'>we don't have to do geography again next year.</span>"</em><br>
                      Đó là môn học họ sẽ không học vào năm tới.<br><br>
                      <strong>✗ A (Maths) sai:</strong> Cô gái nói "Maths is so hard. But I know we have to study it every year till we leave school." → vẫn học toán.<br>
                      <strong>✗ B (Biology) sai:</strong> Cô gái hào hứng: "Biology! I've always wanted to study that!" → họ sẽ học sinh học.<br>
                      <strong>✓ C (Geography) là đáp án chính xác.</strong>`
            },

            transcript: `
            <p><strong>PART 1</strong></p>
            <p><em>For each question, choose the correct answer.</em></p>

            <p><strong>Question 1</strong><br>
            <strong>Woman:</strong> Sanjay, you go back to school next week. Are there any clothes I need to buy you?<br>
            <strong>Boy:</strong> Err… I think I've probably got enough trousers, Mum, but <span class="highlightable" data-q="1">my shoes are too small.</span><br>
            <strong>Woman:</strong> Why didn't you tell me that before? And is your coat OK?<br>
            <strong>Boy:</strong> Yeah, it's really comfortable!</p>

            <p><strong>Question 2</strong><br>
            <strong>Boy:</strong> That's an interesting model, Andrea.<br>
            <strong>Girl:</strong> It's hard to get it right. I made a great horse last time, but this is more difficult. <span class="highlightable" data-q="2">The neck's too long – it looks more like a camel than a sheep.</span><br>
            <strong>Boy:</strong> Why don't you put some white wool on it?<br>
            <strong>Girl:</strong> Great. <span class="highlightable" data-q="2">That'll make it clearer what kind of animal it is.</span></p>

            <p><strong>Question 3</strong><br>
            <strong>Girl:</strong> Did you go to the beach at the weekend?<br>
            <strong>Boy:</strong> Yeah – the weather was perfect for sailing.<br>
            <strong>Girl:</strong> I know! <span class="highlightable" data-q="3">It was really windy!</span> It's a shame the sun didn't come out because I wanted to go swimming.<br>
            <strong>Boy:</strong> At least it didn't rain like the TV weather man said, and it was quite warm.</p>

            <p><strong>Question 4</strong><br>
            <strong>Woman:</strong> What would you like for lunch?<br>
            <strong>Boy:</strong> Can I have some of those sausages in the fridge?<br>
            <strong>Woman:</strong> We're having those for dinner, I'm afraid. <span class="highlightable" data-q="4">I could make you an omelette?</span> There're lots of eggs.<br>
            <strong>Boy:</strong> OK, I'd prefer that to sandwiches. I have those nearly every day.</p>

            <p><strong>Question 5</strong><br>
            <strong>Girl:</strong> What's your favourite subject?<br>
            <strong>Boy:</strong> I don't know. Maths probably.<br>
            <strong>Girl:</strong> Maths is so hard. But I know we have to study it every year till we leave school. <span class="highlightable" data-q="5">It's great we don't have to do geography again next year.</span><br>
            <strong>Boy:</strong> Oh, but geography was really interesting! I hope biology is good next year.<br>
            <strong>Girl:</strong> Biology! I've always wanted to study that!</p>

            <p><em>That is the end of Part One.</em></p>
            `,

            questions: [
                { num: 1, text: "What does the boy's mother need to buy for him?<br><img src='img-ket/ket 4-test 3-1.png' alt='Question 1' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 2, text: "What's the girl trying to make?<br><img src='img-ket/ket 4-test 3-2.png' alt='Question 2' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 3, text: "What was the weather like at the weekend?<br><img src='img-ket/ket 4-test 3-3.png' alt='Question 3' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 4, text: "What will the boy have for lunch?<br><img src='img-ket/ket 4-test 3-4.png' alt='Question 4' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 5, text: "Which subject won't they study next year?<br><img src='img-ket/ket 4-test 3-5.png' alt='Question 5' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest3Part1Data);
            console.log('KET 4 Test 3 Listening Part 1 loaded');
        });
    </script>
