                      <strong>✗ A (visit a new country) sai:</strong> Cô gái đến Tây Ban Nha (Spain), là nơi đã từng đến ("again"). Cậu bé mới đi New York.<br>

                      <strong>✓ C (learn a new sport) là đáp án chính xác – học cưỡi ngựa.</strong>`,

            <strong>Girl:</strong> I'd love to go there! And I probably will 'cos my aunt's going to move there next year. We're going to Spain again. <span class="highlightable" data-q="16">Dad's promised I can have riding lessons. That'll be fantastic! I've always dreamt of doing that.</span> It's a pity Grandpa's not coming with us this summer.</p>

            <p><strong>Question 18</strong><br>
            You will hear two friends talking in a café. What is the problem with their food?<br>
            <strong>Boy:</strong> Are you enjoying this pizza?<br>
            <strong>Girl:</strong> Actually, I think it's disgusting.<br>
            <strong>Boy:</strong> I don't like it either. It's really dry. <span class="highlightable" data-q="18">I think they forgot when it was time to take it out of the oven.</span> I'm sorry now that I didn't choose the salad instead.<br>
            <strong>Girl:</strong> Me too. But at least it wasn't expensive.<br>
            <strong>Boy:</strong> That's true.</p>

            <p><strong>Question 20</strong><br>
            You will hear a brother and sister talking about a picnic. What do they still need to do?<br>

            <strong>Girl:</strong> Sure! But <span class="highlightable" data-q="20">where's the net? Oh, and the ball?</span><br>
            <strong>Boy:</strong> <span class="highlightable" data-q="20">I think they're in the garage.</span></p>

            <p><em>That is the end of Part Four.</em></p>
