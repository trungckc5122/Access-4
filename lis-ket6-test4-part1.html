            transcript: `
            <p><strong>Listening – Test Four</strong></p>
            <p>There are five parts to the test. You will hear each piece twice. We will now stop for a moment. Please ask any questions now because you must NOT speak during the test.</p>

            <p><strong>PART 1</strong></p>
            <p><em>Now look at the instructions for Part One. For each question, choose the correct answer.</em></p>

            <p><strong>Question 1</strong><br>
            <em>One. How much did the boy's football shirt cost?</em><br>
            <strong>Emily:</strong> Did you spend all your birthday money on your new football shirt?<br>
            <strong>Phil:</strong> Grandma gave me thirty-five pounds but <span class="highlightable" data-q="1">it was only twenty pounds fifty in the sports shop in the city centre.</span><br>

            <strong>Phil:</strong> But football shirts are always more expensive than other shirts.<br>
            <strong>Emily:</strong> Oh.<br>
            <em>Now listen again. [repeat]</em></p>

            <em>Two. What did Sophie enjoy doing most at the weekend?</em><br>

            <strong>Alex:</strong> Oh.<br>
            <strong>Sophie:</strong> Then, I went swimming with my little brother. That was OK, but <span class="highlightable" data-q="2">my dad taught me how to fish, and that was really cool!</span><br>
            <strong>Alex:</strong> Really? I think fishing's boring!<br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 3</strong><br>
            <em>Three. Where did Paul stay on holiday this year?</em><br>
            <strong>Izzy:</strong> Hi, Paul. Did you have a good holiday?<br>
            <strong>Paul:</strong> Yeah, great. We went on holiday with my cousins again this year. Remember, last year we stayed on a boat?<br>
            <strong>Izzy:</strong> Yes, did you do that this year, too?<br>
            <strong>Paul:</strong> Mum wanted to stay in a hotel with a big swimming pool, but everyone else wanted to go camping. <span class="highlightable" data-q="3">So we did that.</span><br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 4</strong><br>
            <em>Four. Which subject will they study first today?</em><br>
            <strong>Sam:</strong> Hi, Anna. Have you seen the new timetable for today?<br>
            <strong>Anna:</strong> No, aren't we having maths first? That's what we usually do on Tuesdays as soon as we get to school.<br>
            <strong>Sam:</strong> Maths is the third lesson, after geography.<br>
            <strong>Anna:</strong> So chemistry before that.<br>
            <strong>Sam:</strong> <span class="highlightable" data-q="4">Exactly!</span> Anyway, I've finished my geography project – finally!<br>
            <em>Now listen again. [repeat]</em></p>

            <em>Five. Why was Tina late for school today?</em><br>
            <strong>Colby:</strong> Tina, why were you late for school today?<br>
            <strong>Tina:</strong> Well, I got up at seven. My phone always wakes me up then, but <span class="highlightable" data-q="5">when the bus came, it didn't stop because it was full!</span><br>
            <strong>Colby:</strong> So what did you do?<br>
            <strong>Tina:</strong> I went home and asked Mum to give me a lift. The traffic wasn't bad, but I was still fifteen minutes late!<br>
            <em>Now listen again. [repeat]</em></p>

            <p><em>That is the end of Part One.</em></p>
            `,
