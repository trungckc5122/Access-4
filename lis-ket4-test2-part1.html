<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KET 4 - Test 2 - Listening Part 1</title>
    <link rel="stylesheet" href="listening-pet-common.css" id="styleLink">
    <style>
        .question-item img {
            max-width: 760px !important;
            width: 100%;
            display: block;
        }

        .question-item .options {
            display: grid !important;
            grid-template-columns: 1fr 1fr 1fr;
            max-width: 760px;
            margin-top: 15px;
            gap: 15px;
        }

        .question-item .option {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            margin-bottom: 0 !important;
            padding: 10px 0 !important;
        }

        .question-item .option label {
            margin-left: 8px !important;
            flex: 0 1 auto !important;
            width: auto !important;
        }
    </style>
</head>

<body>
    <div class="test-wrapper" id="testWrapper">
        <!-- Header -->
        <div class="ielts-header">
            <div class="brand">
                <div class="ielts-logo">KET</div>
                <div class="candidate"></div>
                <div class="audio-controls">
                    <audio id="listeningAudio" controls>
                        <source src="audio/KET 4 - Test 2 Part 1.mp3" type="audio/mpeg">
                    </audio>
                    <select class="speed-select" id="speedSelect">
                        <option value="0.7">0.7x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1x</option>
                        <option value="1.1">1.1x</option>
                        <option value="1.25">1.25x</option>
                    </select>
                    <span class="volume-icon">🔊</span>
                </div>
            </div>
        </div>

        <!-- Question navigator -->
        <div class="question-nav">
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">
            <!-- Transcript panel -->
            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 1–5</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 1 &nbsp; Questions 1–5</h3>
                        <p><em>For each question, choose the correct answer.</em></p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>
            <div class="explanation-header">
                <span id="explanationTitle">Giải thích</span>
                <span class="close-btn" id="closeExplanation">✕ Đóng</span>
            </div>
            <div class="explanation-content" id="explanationText"></div>
        </div>
    </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest2Part1Data = {
            title: "KET 4 · Test 2 · Listening Part 1",
            type: "multiple-choice",
            part: 1,
            book: 4,
            test: 2,

            answerKey: { q1: 'B', q2: 'B', q3: 'C', q4: 'A', q5: 'C' },
            displayAnswers: { q1: 'B', q2: 'B', q3: 'C', q4: 'A', q5: 'C' },

            detailedExplanations: {
                q1: `<strong>Đáp án: B – Ảnh có trăng sáng và cây trong tuyết</strong><br>
                      Cậu bé nói: <em>"the moon was very bright. Aren’t the trees beautiful with snow on them?"</em> và <em>"Lots of rabbits. But they ran away before I could take their photo."</em><br>
                      Anh ấy đã chụp ảnh phong cảnh đêm có trăng sáng, cây phủ tuyết, và thỏ (dù không chụp được).<br><br>
                      <strong>✗ A (ảnh có trăng và thỏ nhưng không có tuyết) sai:</strong> Cậu bé nhắc đến tuyết rõ ràng.<br>
                      <strong>✗ C (ảnh có tuyết và thỏ nhưng không có trăng) sai:</strong> Cậu bé nói "moon was very bright".<br>
                      <strong>✓ B là đáp án chính xác – có cả trăng, tuyết và thỏ.</strong>`,

                q2: `<strong>Đáp án: B – Khách sạn</strong><br>
                      Cô gái nói: <em>"She’s a receptionist in a big new hotel now."</em> và xác nhận: <em>"the one next to the museum where my dad works"</em>.<br><br>
                      <strong>✗ A (ga xe lửa) sai:</strong> Đó là công việc cũ của mẹ cô.<br>
                      <strong>✗ C (bảo tàng) sai:</strong> Bố cậu bé làm việc ở bảo tàng, không phải mẹ cô gái.<br>
                      <strong>✓ B là đáp án chính xác – khách sạn mới cạnh bảo tàng.</strong>`,

                q3: `<strong>Đáp án: C – Xem phim về cuộc sống trong lâu đài</strong><br>
                      Helena nói: <em>"We watched a film about life in a castle."</em> trong giờ học lịch sử.<br><br>
                      <strong>✗ A (viết một câu chuyện về vị vua) sai:</strong> Đó là bài tập tiếng Anh.<br>
                      <strong>✗ B (vẽ một bức tranh về lâu đài) sai:</strong> Đó là giờ mỹ thuật (art).<br>
                      <strong>✓ C là đáp án chính xác – xem phim về cuộc sống trong lâu đài.</strong>`,

                q4: `<strong>Đáp án: A – Trượt tuyết (snowboarding)</strong><br>
                      Cô gái nói: <em>"This is my first time."</em> về việc có một cái ván. Cậu bé nói: <em>"Well, at least it’s softer when you fall on snow."</em> → Đó là snowboard.<br>
                      Cô ấy đã biết trượt ván (skateboarding) và chưa từng lướt sóng (surfing).<br><br>
                      <strong>✗ B (lướt sóng) sai:</strong> Cô ấy chưa từng lướt sóng ("I'd like to" nhưng chưa được).<br>
                      <strong>✗ C (trượt patin) sai:</strong> Không đề cập.<br>
                      <strong>✓ A là đáp án chính xác – snowboarding.</strong>`,

                q5: `<strong>Đáp án: C – Dưa (melon)</strong><br>
                      Mẹ nói: <em>"Sorry, but you had the last piece for breakfast."</em> → Peter đã ăn miếng dưa cuối cùng vào bữa sáng.<br><br>
                      <strong>✗ A (nho) sai:</strong> Mẹ hỏi có muốn mang nho đi không, nhưng đó là cho hộp cơm trưa.<br>
                      <strong>✗ B (lê) sai:</strong> Mẹ đề nghị lê thay thế, nhưng Peter chọn dưa.<br>
                      <strong>✓ C là đáp án chính xác – Peter đã ăn dưa vào bữa sáng.</strong>`
            },

            transcript: `
            <p><strong>PART 1</strong></p>
            <p><em>For each question, choose the correct answer.</em></p>

            <p><strong>Question 1</strong><br>
            <strong>Boy:</strong> Do you like this photo, Mum? I took it when I went for a walk with Grandpa last night.<br>
            <strong>Woman:</strong> It's amazing. It doesn't look like it was taken at night!<br>
            <strong>Boy:</strong> Yes, <span class="highlightable" data-q="1">the moon was very bright. Aren't the trees beautiful with snow on them?</span><br>
            <strong>Woman:</strong> They certainly are. Did you see any animals?<br>
            <strong>Boy:</strong> <span class="highlightable" data-q="1">Lots of rabbits. But they ran away before I could take their photo.</span></p>

            <p><strong>Question 2</strong><br>
            <strong>Boy:</strong> Your mum works at the railway station, doesn't she, Katy?<br>
            <strong>Girl:</strong> She's changed her job. <span class="highlightable" data-q="2">She's a receptionist in a big new hotel now.</span><br>
            <strong>Boy:</strong> Do you mean <span class="highlightable" data-q="2">the one next to the museum where my dad works?</span><br>
            <strong>Girl:</strong> That's right. I'm going to see her there after school. Do you want to come?<br>
            <strong>Boy:</strong> Yes, please.</p>

            <p><strong>Question 3</strong><br>
            <strong>Man:</strong> Did you have a good day at school, Helena?<br>
            <strong>Girl:</strong> Yes, Dad. We had to write a story about an old king in our English lesson. That was fun.<br>
            <strong>Man:</strong> That sounds more like history!<br>
            <strong>Girl:</strong> Yes, we had that today, too. <span class="highlightable" data-q="3">We watched a film about life in a castle.</span> After that, in art, I chose to do a picture of the castle. Here it is. Look.<br>
            <strong>Man:</strong> Great!</p>

            <p><strong>Question 4</strong><br>
            <strong>Boy:</strong> I like your board, Daisy. Are you good at it?<br>
            <strong>Girl:</strong> I don't know. <span class="highlightable" data-q="4">This is my first time.</span> I'm OK at skateboarding, so I hope it won't be too different.<br>
            <strong>Boy:</strong> Well, <span class="highlightable" data-q="4">at least it's softer when you fall on snow.</span> Have you ever been surfing?<br>
            <strong>Girl:</strong> I'd like to. My brother's got a surfboard, but he won't let me use it.</p>

            <p><strong>Question 5</strong><br>
            <strong>Woman:</strong> I'm just getting your lunch box ready for you to take to school, Peter. I've given you a cheese sandwich. Would you like to take some grapes as well?<br>
            <strong>Boy:</strong> Can't I have a piece of melon?<br>
            <strong>Woman:</strong> Sorry, but <span class="highlightable" data-q="5">you had the last piece for breakfast.</span> You can have a pear if you prefer.<br>
            <strong>Boy:</strong> OK, thanks, Mum.</p>

            <p><em>That is the end of Part One.</em></p>
            `,

            questions: [
                { num: 1, text: "Which photo is the boy showing his mother?<br><img src='img-ket/ket 4-test 2-1.png' alt='Question 1' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 2, text: "Where does the girl’s mother work?<br><img src='img-ket/ket 4-test 2-2.png' alt='Question 2' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 3, text: "What did Helena’s class do in their history lesson?<br><img src='img-ket/ket 4-test 2-3.png' alt='Question 3' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 4, text: "Which new sport is the girl going to do today?<br><img src='img-ket/ket 4-test 2-4.png' alt='Question 4' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 5, text: "What did the boy eat for breakfast?<br><img src='img-ket/ket 4-test 2-5.png' alt='Question 5' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest2Part1Data);
            console.log('KET 4 Test 2 Listening Part 1 loaded');
        });
    </script>
</body>

</html>
