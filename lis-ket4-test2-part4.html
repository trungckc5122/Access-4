<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KET 4 - Test 2 - Listening Part 4</title>
    <link rel="stylesheet" href="listening-pet-common.css" id="styleLink">
</head>

<body>
    <div class="test-wrapper" id="testWrapper">
        <!-- Header -->
        <div class="ielts-header">
            <div class="brand">
                <div class="ielts-logo">KET</div>
                <div class="candidate"></div>
                <div class="audio-controls">
                    <audio id="listeningAudio" controls>
                        <source src="audio/KET 4 - Test 2 Part 4.mp3" type="audio/mpeg">
                    </audio>
                    <select class="speed-select" id="speedSelect">
                        <option value="0.7">0.7x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1x</option>
                        <option value="1.1">1.1x</option>
                        <option value="1.25">1.25x</option>
                    </select>
                    <span class="volume-icon">🔊</span>
                </div>
            </div>
        </div>

        <!-- Question navigator -->
        <div class="question-nav">
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">
            <!-- Transcript panel -->
            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 16–20</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 4 &nbsp; Questions 16–20</h3>
                        <p><em>For each question, choose the correct answer.</em></p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>
            <div class="explanation-header">
                <span id="explanationTitle">Giải thích</span>
                <span class="close-btn" id="closeExplanation">✕ Đóng</span>
            </div>
            <div class="explanation-content" id="explanationText"></div>
        </div>
    </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest2Part4Data = {
            title: "KET 4 · Test 2 · Listening Part 4",
            type: "multiple-choice",
            part: 4,
            book: 4,
            test: 2,

            answerKey: { q16: 'B', q17: 'A', q18: 'A', q19: 'A', q20: 'B' },
            displayAnswers: { q16: 'B', q17: 'A', q18: 'A', q19: 'A', q20: 'B' },

            detailedExplanations: {
                q16: `<strong>Đáp án: B – She feels ill</strong><br>
                      Cậu bé mời cô gái đi bơi: <em>"Are you coming swimming after school? I've got enough money for both of us if you haven't got any."</em><br>
                      Cô gái đáp: <em>"I've got plenty, thanks, but <span class='keyword-highlight'>I don't want to make this headache worse.</span>"</em><br>
                      Cô ấy cũng nói thêm: <em>"I'm getting a cold, so I really don't want to go."</em><br><br>
                      <strong>✗ A (She's too busy) sai:</strong> Cô ấy không nói về việc bận rộn.<br>
                      <strong>✗ C (She's got no money) sai:</strong> Cô ấy nói rõ "I've got plenty" (có nhiều tiền).<br>
                      <strong>✓ B (She feels ill) là đáp án chính xác – Cô bị đau đầu và đang bị cảm.</strong>`,

                q17: `<strong>Đáp án: A – to a farm</strong><br>
                      Cô gái nói: <em>"Yes, <span class='keyword-highlight'>it's going to be nice seeing the animals outside in the fresh air</span> – not like the last trip we went on."</em><br>
                      Cậu bé đáp: <em>"I agree! I like dinosaurs, but looking at all those bones got quite boring after a while."</em><br>
                      Cô gái nói tiếp: <em>"And maybe we'll be able to play football in one of the fields."</em><br>
                      Họ sẽ đến trang trại để xem động vật ngoài trời.<br><br>
                      <strong>✗ B (to a museum) sai:</strong> Đó là chuyến đi trước (nhìn xương khủng long).<br>
                      <strong>✗ C (to a stadium) sai:</strong> Không đề cập đến sân vận động.<br>
                      <strong>✓ A (to a farm) là đáp án chính xác.</strong>`,

                q18: `<strong>Đáp án: A – changes to their timetable</strong><br>
                      Giáo viên nói: <em>"... from next week you'll have a different teacher for geography for a while. <span class='keyword-highlight'>You'll now have geography on Thursdays at 10.30 instead of 9.30</span>, in the same room as on your timetable, D11."</em><br>
                      Ông ấy đang thông báo về sự thay đổi thời gian học môn địa lý.<br><br>
                      <strong>✗ B (a new teacher at the school) sai:</strong> Thầy Kennedy đã dạy từ năm ngoái ("you know him from last year"), không phải giáo viên mới.<br>
                      <strong>✗ C (a problem with a classroom) sai:</strong> Phòng học vẫn giữ nguyên (D11).<br>
                      <strong>✓ A (changes to their timetable) là đáp án chính xác.</strong>`,

                q19: `<strong>Đáp án: A – tired</strong><br>
                      Cô gái hỏi: <em>"How are you, Oscar?"</em><br>
                      Cậu bé đáp: <em>"I'm training for a race – <span class='keyword-highlight'>getting up at 5 a.m. every day</span> and running round the track twenty-five times."</em><br>
                      Cậu ấy nói thêm: <em>"It's just <span class='keyword-highlight'>I'd really love to get some sleep</span> instead of coming to school."</em><br>
                      Cậu ấy cảm thấy mệt mỏi vì thiếu ngủ.<br><br>
                      <strong>✗ B (bored) sai:</strong> Cậu ấy thích chạy bộ ("I like running").<br>
                      <strong>✗ C (worried) sai:</strong> Cậu ấy nói huấn luyện viên lo lắng ("Coach worries too much"), không phải cậu.<br>
                      <strong>✓ A (tired) là đáp án chính xác.</strong>`,

                q20: `<strong>Đáp án: B – It was too expensive</strong><br>
                      Cô gái hỏi: <em>"Hi Alex, did you get the red T-shirt?"</em><br>
                      Cậu bé đáp: <em>"No, they only had very big ones left, and I wanted a small one. <span class='keyword-highlight'>I found a really nice blue and white striped one, but I couldn't afford it.</span>"</em><br>
                      Cậu không mua được vì không đủ tiền (too expensive).<br><br>
                      <strong>✗ A (It was the wrong size) sai:</strong> Đó là lý do không mua áo đỏ, không phải áo xanh trắng.<br>
                      <strong>✗ C (It was the wrong colour) sai:</strong> Cậu thích áo xanh trắng ("really nice").<br>
                      <strong>✓ B (It was too expensive) là đáp án chính xác.</strong>`
            },

            transcript: `
            <p><strong>PART 4</strong></p>
            <p><em>For each question, choose the correct answer.</em></p>

            <p><strong>Question 16</strong><br>
            You will hear two friends talking about going swimming together. Why doesn't the girl want to go swimming?<br>
            <strong>Boy:</strong> Are you coming swimming after school? I've got enough money for both of us if you haven't got any.<br>
            <strong>Girl:</strong> <span class="highlightable" data-q="16">I've got plenty, thanks, but I don't want to make this headache worse.</span><br>
            <strong>Boy:</strong> Oh, come on! Is it because we've got some homework? You can do it afterwards.<br>
            <strong>Girl:</strong> <span class="highlightable" data-q="16">I can, but I'm getting a cold, so I really don't want to go.</span></p>

            <p><strong>Question 17</strong><br>
            You will hear two friends talking about a school trip. Where are they going to go on the school trip?<br>
            <strong>Boy:</strong> Are you looking forward to the trip?<br>
            <strong>Girl:</strong> Yes, <span class="highlightable" data-q="17">it's going to be nice seeing the animals outside in the fresh air</span> – not like the last trip we went on.<br>
            <strong>Boy:</strong> I agree! I like dinosaurs, but looking at all those bones got quite boring after a while.<br>
            <strong>Girl:</strong> It did. And maybe we'll be able to play football in one of the fields.</p>

            <p><strong>Question 18</strong><br>
            You will hear a teacher talking to his class. What's he talking to them about?<br>
            <strong>Man:</strong> As you know, Mrs Barratt is having a baby soon, so from next week you'll have a different teacher for geography for a while. Mr Kennedy will be taking you instead – you know him from last year. <span class="highlightable" data-q="18">You'll now have geography on Thursdays at 10.30 instead of 9.30</span>, in the same room as on your timetable, D11.</p>

            <p><strong>Question 19</strong><br>
            You will hear a boy, Oscar, talking about running. How does Oscar feel now?<br>
            <strong>Girl:</strong> How are you, Oscar?<br>
            <strong>Boy:</strong> I'm training for a race – <span class="highlightable" data-q="19">getting up at 5 a.m. every day</span> and running round the track twenty-five times.<br>
            <strong>Girl:</strong> That isn't interesting.<br>
            <strong>Boy:</strong> I like running. It's just <span class="highlightable" data-q="19">I'd really love to get some sleep</span> instead of coming to school. Coach says it's an important race and I must practise more. He worries too much.</p>

            <p><strong>Question 20</strong><br>
            You will hear a boy, Alex, talking to a friend about a new T-shirt. Why didn't Alex buy the blue and white T-shirt?<br>
            <strong>Girl:</strong> Hi Alex, did you get the red T-shirt?<br>
            <strong>Boy:</strong> No, they only had very big ones left, and I wanted a small one. <span class="highlightable" data-q="20">I found a really nice blue and white striped one, but I couldn't afford it.</span> Hope I get it as my birthday present.<br>
            <strong>Girl:</strong> Oh yeah!<br>
            <strong>Boy:</strong> Then I found a nice green one that fits me.<br>
            <strong>Girl:</strong> Great!</p>

            <p><em>That is the end of Part Four.</em></p>
            `,

            questions: [
                { num: 16, text: "You will hear two friends talking about going swimming together. Why doesn't the girl want to go swimming?", options: ["She's too busy.", "She feels ill.", "She's got no money."] },
                { num: 17, text: "You will hear two friends talking about a school trip. Where are they going to go on the school trip?", options: ["to a farm", "to a museum", "to a stadium"] },
                { num: 18, text: "You will hear a teacher talking to his class. What's he talking to them about?", options: ["changes to their timetable", "a new teacher at the school", "a problem with a classroom"] },
                { num: 19, text: "You will hear a boy, Oscar, talking about running. How does Oscar feel now?", options: ["tired", "bored", "worried"] },
                { num: 20, text: "You will hear a boy, Alex, talking to a friend about a new T-shirt. Why didn't Alex buy the blue and white T-shirt?", options: ["It was the wrong size.", "It was too expensive.", "It was the wrong colour."] }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest2Part4Data);
            console.log('KET 4 Test 2 Listening Part 4 loaded');
        });
    </script>
</body>

</html>
