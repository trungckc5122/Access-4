<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KET 4 - Test 3 - Listening Part 4</title>
    <link rel="stylesheet" href="listening-pet-common.css" id="styleLink">
</head>

<body>
    <div class="test-wrapper" id="testWrapper">
        <!-- Header -->
        <div class="ielts-header">
            <div class="brand">
                <div class="ielts-logo">KET</div>
                <div class="candidate"></div>
                <div class="audio-controls">
                    <audio id="listeningAudio" controls>
                        <source src="audio/KET 4 - Test 3 Part 4.mp3" type="audio/mpeg">
                    </audio>
                    <select class="speed-select" id="speedSelect">
                        <option value="0.7">0.7x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1x</option>
                        <option value="1.1">1.1x</option>
                        <option value="1.25">1.25x</option>
                    </select>
                    <span class="volume-icon">🔊</span>
                </div>
            </div>
        </div>

        <!-- Question navigator -->
        <div class="question-nav">
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">
            <!-- Transcript panel -->
            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 16–20</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 4 &nbsp; Questions 16–20</h3>
                        <p><em>For each question, choose the correct answer.</em></p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>
            <div class="explanation-header">
                <span id="explanationTitle">Giải thích</span>
                <span class="close-btn" id="closeExplanation">✕ Đóng</span>
            </div>
            <div class="explanation-content" id="explanationText"></div>
        </div>
    </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest3Part4Data = {
            title: "KET 4 · Test 3 · Listening Part 4",
            type: "multiple-choice",
            part: 4,
            book: 4,
            test: 3,

            answerKey: { q16: 'C', q17: 'A', q18: 'B', q19: 'C', q20: 'A' },
            displayAnswers: { q16: 'C', q17: 'A', q18: 'B', q19: 'C', q20: 'A' },

            detailedExplanations: {
                q16: `<strong>Đáp án: C – his cousin</strong><br>
                      Cậu bé nói: <em>"I'm meeting Danny this weekend. You met him once, when my uncle had that big party. ... he's my uncle's son!"</em><br>
                      Cô gái đáp: <em>"Oh, why didn't you just say he's your cousin?!"</em><br>
                      Danny chính là anh em họ (cousin) của cậu bé.<br><br>
                      <strong>✗ A (his brother) sai:</strong> Cô gái nhớ đã đi cùng với anh trai của cậu bé ("we went with your brother") nhưng không phải người cậu định gặp.<br>
                      <strong>✗ B (his uncle) sai:</strong> Chú của cậu bé là người tổ chức bữa tiệc ("when my uncle had that big party"), không phải người cậu định gặp.<br>
                      <strong>✓ C (his cousin) là đáp án chính xác.</strong>`,

                q17: `<strong>Đáp án: A – how warm the weather is</strong><br>
                      Cô gái nói: <em>"<span class='keyword-highlight'>Isn't it amazing? It's November, and it's still about twenty degrees.</span> I mean, you could just wear a T-shirt today!"</em><br>
                      Cô ấy ngạc nhiên vì thời tiết tháng 11 mà vẫn ấm áp.<br><br>
                      <strong>✗ B (what the boy is wearing) sai:</strong> Cô gái nói có thể mặc áo phông, nhưng không nói về việc cậu bé đang mặc gì.<br>
                      <strong>✗ C (how kind her teachers were) sai:</strong> Cô gái nói giáo viên cho phép cởi áo khoác ("teachers let us take our jackets off"), nhưng đó không phải điều cô ngạc nhiên.<br>
                      <strong>✓ A (how warm the weather is) là đáp án chính xác.</strong>`,

                q18: `<strong>Đáp án: B – explain something to her</strong><br>
                      Cô gái nói trong tin nhắn: <em>"... <span class='keyword-highlight'>I wasn't really sure what she meant. But I bet you understood! You always do! Could you tell me what we have to do?</span>"</em><br>
                      Cô ấy muốn Adam giải thích bài tập về nhà mà cô không hiểu.<br><br>
                      <strong>✗ A (lend her something) sai:</strong> Cô gái nói rõ "I don't need to borrow anything, so don't worry!" – không cần mượn đồ.<br>
                      <strong>✗ C (give someone a message) sai:</strong> Không có yêu cầu nhắn tin cho ai khác.<br>
                      <strong>✓ B (explain something to her) là đáp án chính xác.</strong>`,

                q19: `<strong>Đáp án: C – cycling</strong><br>
                      Giáo viên nói: <em>"... <span class='keyword-highlight'>Please stay on the cycle path. Be careful of the people who are walking. ... Ride past them slowly and carefully please.</span>"</em><br>
                      Họ đang đi xe đạp vì được yêu cầu ở trên đường dành cho xe đạp và cẩn thận với người đi bộ.<br><br>
                      <strong>✗ A (walking) sai:</strong> Người đi bộ là người khác ("people who are walking"), không phải nhóm học sinh.<br>
                      <strong>✗ B (fishing) sai:</strong> Có người đang câu cá dọc sông ("people fishing"), không phải hoạt động của nhóm.<br>
                      <strong>✓ C (cycling) là đáp án chính xác.</strong>`,

                q20: `<strong>Đáp án: A – The music was too loud</strong><br>
                      Cô gái nói về bộ phim: <em>"Yes, but <span class='keyword-highlight'>in the scene in the castle, you could hear the music more easily than the actors' conversations! It really needed to be quieter.</span>"</em><br>
                      Cô ấy thấy nhạc quá to so với lời thoại của diễn viên.<br><br>
                      <strong>✗ B (The story was difficult to understand) sai:</strong> Cô gái nói "I knew what was happening" và đoán được kết thúc ("Did you guess the end of the story? I did!").<br>
                      <strong>✗ C (The actors didn't speak clearly enough) sai:</strong> Vấn đề là nhạc quá to chứ không phải diễn viên nói không rõ.<br>
                      <strong>✓ A (The music was too loud) là đáp án chính xác.</strong>`
            },

            transcript: `
            <p><strong>PART 4</strong></p>
            <p><em>For each question, choose the correct answer.</em></p>

            <p><strong>Question 16</strong><br>
            You will hear a boy talking to a girl about his plans for the weekend. Who is the boy meeting?<br>
            <strong>Boy:</strong> I'm meeting Danny this weekend. You met him once, when my uncle had that big party. Remember?<br>
            <strong>Girl:</strong> Well, I remember the party, we went with your brother! But I can't remember meeting anyone called Danny.<br>
            <strong>Boy:</strong> I'm sure you did, <span class="highlightable" data-q="16">he's my uncle's son!</span><br>
            <strong>Girl:</strong> Oh, <span class="highlightable" data-q="16">why didn't you just say he's your cousin?!</span> I remember him now, we talked about football!</p>

            <p><strong>Question 17</strong><br>
            You will hear a girl talking to a boy. What's the girl surprised about?<br>
            <strong>Girl:</strong> <span class="highlightable" data-q="17">Isn't it amazing? It's November, and it's still about twenty degrees.</span> I mean, you could just wear a T-shirt today!<br>
            <strong>Boy:</strong> Yes, it's incredible. I'm normally in a coat at this time of year.<br>
            <strong>Girl:</strong> It's nice that the teachers let us take our jackets off in class – they usually do.<br>
            <strong>Boy:</strong> Yes, I didn't wear mine at all today.</p>

            <p><strong>Question 18</strong><br>
            You will hear a girl leaving a message for her friend Adam. What does she want Adam to do?<br>
            <strong>Girl:</strong> Hi, Adam! I wanted to ask you a favour – I don't need to borrow anything, so don't worry! In maths today, when the teacher was giving us our homework, <span class="highlightable" data-q="18">I wasn't really sure what she meant. But I bet you understood! You always do! Could you tell me what we have to do?</span> Please! OK, I hope you get this message.</p>

            <p><strong>Question 19</strong><br>
            You will hear a teacher speaking to a group of pupils on a trip to a river. What activity are they going to do?<br>
            <strong>Man:</strong> Right everyone, a few words before we set off. There will be lots of people along the river, including people fishing. So please don't make too much noise. <span class="highlightable" data-q="19">Please stay on the cycle path. Be careful of the people who are walking. ... Ride past them slowly and carefully please.</span></p>

            <p><strong>Question 20</strong><br>
            You will hear two friends talking about a film they've just watched together. What did the girl think about the film?<br>
            <strong>Boy:</strong> What a great film!<br>
            <strong>Girl:</strong> Yes, but <span class="highlightable" data-q="20">in the scene in the castle, you could hear the music more easily than the actors' conversations! It really needed to be quieter.</span><br>
            <strong>Boy:</strong> I suppose they should turn the volume down a bit.<br>
            <strong>Girl:</strong> Anyway, I knew what was happening. Did you guess the end of the story? I did!</p>

            <p><em>That is the end of Part Four.</em></p>
            `,

            questions: [
                { num: 16, text: "You will hear a boy talking to a girl about his plans for the weekend. Who is the boy meeting?", options: ["his brother", "his uncle", "his cousin"] },
                { num: 17, text: "You will hear a girl talking to a boy. What's the girl surprised about?", options: ["how warm the weather is", "what the boy is wearing", "how kind her teachers were"] },
                { num: 18, text: "You will hear a girl leaving a message for her friend Adam. What does she want Adam to do?", options: ["lend her something", "explain something to her", "give someone a message"] },
                { num: 19, text: "You will hear a teacher speaking to a group of pupils on a trip to a river. What activity are they going to do?", options: ["walking", "fishing", "cycling"] },
                { num: 20, text: "You will hear two friends talking about a film they've just watched together. What did the girl think about the film?", options: ["The music was too loud.", "The story was difficult to understand.", "The actors didn't speak clearly enough."] }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest3Part4Data);
            console.log('KET 4 Test 3 Listening Part 4 loaded');
        });
    </script>
