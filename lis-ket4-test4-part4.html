<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KET 4 - Test 4 - Listening Part 4</title>
    <link rel="stylesheet" href="listening-pet-common.css" id="styleLink">
</head>

<body>
    <div class="test-wrapper" id="testWrapper">
        <!-- Header -->
        <div class="ielts-header">
            <div class="brand">
                <div class="ielts-logo">KET</div>
                <div class="candidate"></div>
                <div class="audio-controls">
                    <audio id="listeningAudio" controls>
                        <source src="audio/KET 4 - Test 4 Part 4.mp3" type="audio/mpeg">
                    </audio>
                    <select class="speed-select" id="speedSelect">
                        <option value="0.7">0.7x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1x</option>
                        <option value="1.1">1.1x</option>
                        <option value="1.25">1.25x</option>
                    </select>
                    <span class="volume-icon">🔊</span>
                </div>
            </div>
        </div>

        <!-- Question navigator -->
        <div class="question-nav">
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">
            <!-- Transcript panel -->
            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 16–20</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 4 &nbsp; Questions 16–20</h3>
                        <p><em>For each question, choose the correct answer.</em></p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>
            <div class="explanation-header">
                <span id="explanationTitle">Giải thích</span>
                <span class="close-btn" id="closeExplanation">✕ Đóng</span>
            </div>
            <div class="explanation-content" id="explanationText"></div>
        </div>
    </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest4Part4Data = {
            title: "KET 4 · Test 4 · Listening Part 4",
            type: "multiple-choice",
            part: 4,
            book: 4,
            test: 4,

            answerKey: { q16: 'C', q17: 'C', q18: 'A', q19: 'C', q20: 'B' },
            displayAnswers: { q16: 'C', q17: 'C', q18: 'A', q19: 'C', q20: 'B' },

            detailedExplanations: {
                q16: `<strong>Đáp án: C – They've got more time to study</strong><br>
                      Thầy giáo nói: <em>"I realise most of you are busy practising for sports day, so you don't have much spare time at the moment, and I want to support you as much as I can. So, we'll have a maths test this term as usual, but <span class='keyword-highlight'>I'll give you longer to prepare for it.</span>"</em><br>
                      Thầy cho học sinh có thêm thời gian chuẩn bị cho bài kiểm tra toán.<br><br>
                      <strong>✗ A (They've got less work to do) sai:</strong> Thầy không nói về việc giảm bài tập.<br>
                      <strong>✗ B (They should do more exercise) sai:</strong> Học sinh đã bận tập luyện cho ngày thể thao ("busy practising for sports day"), thầy không yêu cầu thêm.<br>
                      <strong>✓ C (They've got more time to study) là đáp án chính xác.</strong>`,

                q17: `<strong>Đáp án: C – deciding what they're going to eat</strong><br>
                      Emily hỏi: <em>"Mom, what's for supper?"</em><br>
                      Mẹ đáp: <em>"Good question! I just got back from the mall. I'd rather not go to the store. Let's see what we have in the cupboard. Erm … there're eggs and flour, oil, six tomatoes. <span class='keyword-highlight'>I'll make pasta with tomato sauce.</span>"</em><br>
                      Mẹ đang quyết định bữa tối dựa trên những gì có trong tủ.<br><br>
                      <strong>✗ A (making a shopping list) sai:</strong> Mẹ không lập danh sách mua sắm – cô ấy nói "I'd rather not go to the store".<br>
                      <strong>✗ B (explaining how to cook a dish) sai:</strong> Mẹ không giải thích cách nấu món ăn.<br>
                      <strong>✓ C (deciding what they're going to eat) là đáp án chính xác.</strong>`,

                q18: `<strong>Đáp án: A – She's a guide</strong><br>
                      Dan nói về mẹ mình: <em>"Yeah… she started working in the gift shop a couple of months ago, but <span class='keyword-highlight'>now she shows people round the museum.</span>"</em><br>
                      Mẹ Dan dẫn khách tham quan bảo tàng → làm hướng dẫn viên (guide).<br>
                      Cô gái cũng nói: <em>"She was standing by the reception, where visitors buy tickets."</em> nhưng Dan giải thích: <em>"Probably waiting for her next tour group."</em><br><br>
                      <strong>✗ B (She's a receptionist) sai:</strong> Mẹ Dan đứng gần quầy tiếp tân nhưng đang chờ đoàn khách tham quan, không phải làm lễ tân.<br>
                      <strong>✗ C (She's a shop assistant) sai:</strong> Cô ấy từng làm ở cửa hàng quà tặng ("started working in the gift shop") nhưng đã chuyển công việc.<br>
                      <strong>✓ A (She's a guide) là đáp án chính xác.</strong>`,

                q19: `<strong>Đáp án: C – buy some stamps</strong><br>
                      Con gái hỏi: <em>"Have you got any stamps so I can send her a card?"</em><br>
                      Mẹ đáp: <em>"No, but that's a great idea. <span class='keyword-highlight'>Let's get some now.</span>"</em><br>
                      Họ sẽ đi mua tem ngay bây giờ.<br><br>
                      <strong>✗ A (visit the hospital) sai:</strong> Bà đã được xuất viện ("well enough to go home"), không cần đến bệnh viện.<br>
                      <strong>✗ B (go to the train station) sai:</strong> Mẹ sẽ đặt vé tàu trực tuyến tối nay ("book the train tickets online tonight"), không phải đi đến ga.<br>
                      <strong>✓ C (buy some stamps) là đáp án chính xác.</strong>`,

                q20: `<strong>Đáp án: B – do a sport</strong><br>
                      Cô gái nói: <em>"I've never been in a little boat like that before! I'm glad <span class='keyword-highlight'>we could practise together before we took part in the race.</span>"</em><br>
                      Cậu bé nói: <em>"It was strange being on the water amongst so many big buildings."</em><br>
                      Họ đã ở trên thuyền nhỏ và luyện tập để tham gia một cuộc đua → đó là môn thể thao (rowing/đua thuyền).<br><br>
                      <strong>✗ A (visit the countryside) sai:</strong> Họ ở trên nước giữa các tòa nhà lớn ("on the water amongst so many big buildings"), không phải vùng nông thôn.<br>
                      <strong>✗ C (have a meal) sai:</strong> Họ quên mang đồ ăn dã ngoại ("It's a shame we forgot our picnic"), không phải đã ăn.<br>
                      <strong>✓ B (do a sport) là đáp án chính xác.</strong>`
            },

            transcript: `
            <p><strong>PART 4</strong></p>
            <p><em>For each question, choose the correct answer.</em></p>

            <p><strong>Question 16</strong><br>
            You will hear a teacher talking to his students. What does he tell them?<br>
            <strong>Man:</strong> I realise most of you are busy practising for sports day, so you don't have much spare time at the moment, and I want to support you as much as I can. So, we'll have a maths test this term as usual, but <span class="highlightable" data-q="16">I'll give you longer to prepare for it.</span> The new details are on the board.</p>

            <p><strong>Question 17</strong><br>
            You will hear a girl, Emily, talking to her mum in the kitchen. What's Emily's mum doing?<br>
            <strong>Girl:</strong> Mom, what's for supper?<br>
            <strong>Woman:</strong> Good question! I just got back from the mall. I'd rather not go to the store. Let's see what we have in the cupboard. Erm … there're eggs and flour, oil, six tomatoes. <span class="highlightable" data-q="17">I'll make pasta with tomato sauce.</span><br>
            <strong>Girl:</strong> Awesome. I'll help you.</p>

            <p><strong>Question 18</strong><br>
            You will hear a girl talking to her friend Dan. What job does Dan's mum do?<br>
            <strong>Girl:</strong> Dan, I saw your mum at the museum yesterday, wearing a staff uniform. I didn't realise she works there.<br>
            <strong>Boy:</strong> Yeah… she started working in the gift shop a couple of months ago, but <span class="highlightable" data-q="18">now she shows people round the museum.</span><br>
            <strong>Girl:</strong> She was standing by the reception, where visitors buy tickets.<br>
            <strong>Boy:</strong> Probably waiting for her next tour group. She loves working there.</p>

            <p><strong>Question 19</strong><br>
            You will hear a mother and daughter talking together. What will they do today?<br>
            <strong>Girl:</strong> How's Grandma – is she getting better?<br>
            <strong>Woman:</strong> She's just phoned, actually. The nurses said she's well enough to go home.<br>
            <strong>Girl:</strong> Great. Have you got any stamps so I can send her a card?<br>
            <strong>Woman:</strong> No, but that's a great idea. <span class="highlightable" data-q="19">Let's get some now.</span> When you write, tell her we'll visit soon. I'll book the train tickets online tonight.</p>

            <p><strong>Question 20</strong><br>
            You will hear two friends talking about something they did together at the weekend. What did they do together?<br>
            <strong>Boy:</strong> Did you have a good time?<br>
            <strong>Girl:</strong> I did. <span class="highlightable" data-q="20">I've never been in a little boat like that before! I'm glad we could practise together before we took part in the race.</span><br>
            <strong>Boy:</strong> It was strange being on the water amongst so many big buildings. I'm used to doing it on a lake in the mountains.<br>
            <strong>Girl:</strong> It's a shame we forgot our picnic!</p>

            <p><em>That is the end of Part Four.</em></p>
            `,

            questions: [
                { num: 16, text: "You will hear a teacher talking to his students. What does he tell them?", options: ["They've got less work to do.", "They should do more exercise.", "They've got more time to study."] },
                { num: 17, text: "You will hear a girl, Emily, talking to her mum in the kitchen. What's Emily's mum doing?", options: ["making a shopping list", "explaining how to cook a dish", "deciding what they're going to eat"] },
                { num: 18, text: "You will hear a girl talking to her friend Dan. What job does Dan's mum do?", options: ["She's a guide.", "She's a receptionist.", "She's a shop assistant."] },
                { num: 19, text: "You will hear a mother and daughter talking together. What will they do today?", options: ["visit the hospital", "go to the train station", "buy some stamps"] },
                { num: 20, text: "You will hear two friends talking about something they did together at the weekend. What did they do together?", options: ["visit the countryside", "do a sport", "have a meal"] }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest4Part4Data);
            console.log('KET 4 Test 4 Listening Part 4 loaded');
        });
    </script>
</body>

</html>
