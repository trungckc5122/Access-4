<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KET 6 - Test 2 - Listening Part 3</title>
    <link rel="stylesheet" href="listening-pet-common.css" id="styleLink">
</head>

<body>
    <div class="test-wrapper" id="testWrapper">
        <!-- Header -->
        <div class="ielts-header">
            <div class="brand">
                <div class="ielts-logo">KET</div>
                <div class="candidate"></div>
                <div class="audio-controls">
                    <audio id="listeningAudio" controls>
                        <source src="audio/KET 6 - Test 2 Part 3.mp3" type="audio/mpeg">
                    </audio>
                    <select class="speed-select" id="speedSelect">
                        <option value="0.7">0.7x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1x</option>
                        <option value="1.1">1.1x</option>
                        <option value="1.25">1.25x</option>
                    </select>
                    <span class="volume-icon">🔊</span>
                </div>
            </div>
        </div>

        <!-- Question navigator -->
        <div class="question-nav">
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">
            <!-- Transcript panel -->
            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 11–15</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 3 &nbsp; Questions 11–15</h3>
                        <p><em>For each question, choose the correct answer.</em></p>
                        <p style="margin-bottom:8px;">You will hear Jasmine talking to her aunt about a camping trip.</p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>
            <div class="explanation-header">
                <span id="explanationTitle">Giải thích</span>
                <span class="close-btn" id="closeExplanation">✕ Đóng</span>
            </div>
            <div class="explanation-content" id="explanationText"></div>
        </div>
    </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest2Part3Data = {
            title: "KET 6 · Test 2 · Listening Part 3",
            type: "multiple-choice",
            part: 3,
            book: 6,
            test: 2,

            answerKey: { q11: 'C', q12: 'B', q13: 'B', q14: 'A', q15: 'B' },
            displayAnswers: { q11: 'C', q12: 'B', q13: 'B', q14: 'A', q15: 'B' },

            detailedExplanations: {
                q11: `<strong>Đáp án: C – in the lake</strong><br>
                      Lizzie nói: <em>"It was too windy to swim in the sea, but <span class='keyword-highlight'>the lake was great anyway.</span>"</em><br>
                      Biển quá nhiều gió nên họ bơi ở hồ. Sông chỉ được đề cập như ý định cho lần sau.<br><br>
                      <strong>✗ A (in the sea) sai:</strong> Biển quá nhiều gió, không bơi được.<br>
                      <strong>✗ B (in the river) sai:</strong> Sông là kế hoạch cho lần cắm trại tiếp theo.<br>
                      <strong>✓ C (in the lake) là đáp án chính xác.</strong>`,

                q12: `<strong>Đáp án: B – afraid</strong><br>
                      Jasmine nói: <em>"<span class='keyword-highlight'>I was worried about it on the first night,</span> but I soon found out how exciting it is!"</em><br>
                      Ban đầu Jasmine lo lắng (worried = afraid) về việc ngủ trong lều, nhưng sau đó thấy thú vị.<br><br>
                      <strong>✗ A (excited) sai:</strong> Cô thấy hứng thú sau đó, không phải từ đầu.<br>
                      <strong>✗ C (unhappy) sai:</strong> Anh trai của Jasmine mới là người không vui vì không được đi.<br>
                      <strong>✓ B (afraid) là đáp án chính xác.</strong>`,

                q13: `<strong>Đáp án: B – steak</strong><br>
                      Lizzie nói: <em>"It was difficult to cook the omelette, but <span class='keyword-highlight'>I loved grilling the steak on a barbecue.</span>"</em><br>
                      Món Lizzie thích nấu là steak nướng trên barbecue.<br><br>
                      <strong>✗ A (omelette) sai:</strong> Làm trứng omelette khó, Lizzie không thích nấu món đó.<br>
                      <strong>✗ C (pasta) sai:</strong> Jasmine thích ăn pasta, không phải Lizzie thích nấu nó.<br>
                      <strong>✓ B (steak) là đáp án chính xác.</strong>`,

                q14: `<strong>Đáp án: A – needed a shop</strong><br>
                      Lizzie nói: <em>"The campsite was quite big, but <span class='keyword-highlight'>it's a pity they didn't have anywhere to buy food and things.</span>"</em><br>
                      Khu cắm trại thiếu nơi mua thức ăn và đồ dùng.<br><br>
                      <strong>✗ B (had good showers) sai:</strong> Lizzie nói phòng tắm "a bit dirty, but OK" – không phải tốt.<br>
                      <strong>✗ C (was too small) sai:</strong> Lizzie nói khu cắm trại "quite big", không phải nhỏ.<br>
                      <strong>✓ A (needed a shop) là đáp án chính xác.</strong>`,

                q15: `<strong>Đáp án: B – fishing</strong><br>
                      Jasmine nói: <em>"running in the forest was OK, but hard. But <span class='keyword-highlight'>fishing was amazing, even more fun than cycling!</span>"</em><br>
                      Jasmine thích câu cá nhất, còn thú vị hơn cả đạp xe.<br><br>
                      <strong>✗ A (cycling) sai:</strong> Đạp xe vui nhưng không bằng câu cá.<br>
                      <strong>✗ C (running) sai:</strong> Chạy trong rừng chỉ là "OK, but hard".<br>
                      <strong>✓ B (fishing) là đáp án chính xác.</strong>`
            },

            transcript: `
            <p><strong>PART 3</strong></p>
            <p><em>For each question, choose the correct answer.</em></p>
            <p>You will hear Jasmine talking to her aunt about a camping trip.</p>

            <p><strong>Jasmine:</strong> Thank you for taking me camping with you last weekend, Aunt Lizzie.<br>
            <strong>Lizzie:</strong> It was great, wasn't it, Jasmine? Especially when we went swimming. It was too windy to swim in the sea, but <span class="highlightable" data-q="11">the lake was great anyway.</span> Perhaps next time we can try the river.<br>
            <strong>Jasmine:</strong> Sleeping in a tent was new for me. <span class="highlightable" data-q="12">I was worried about it on the first night,</span> but I soon found out how exciting it is! My brother was very unhappy that he couldn't come with us.</p>

            <p><strong>Lizzie:</strong> Cooking was fun. Well, sometimes. It was difficult to cook the omelette, but <span class="highlightable" data-q="13">I loved grilling the steak on a barbecue.</span> Did you like the pasta I made?<br>
            <strong>Jasmine:</strong> Yes, I was really hungry that day.</p>

            <p><strong>Lizzie:</strong> <span class="highlightable" data-q="14">The campsite was quite big, but it's a pity they didn't have anywhere to buy food and things.</span> And the showers were a bit dirty, but OK. Which activity did you like best?<br>
            <strong>Jasmine:</strong> Well, running in the forest was OK, but hard. But <span class="highlightable" data-q="15">fishing was amazing, even more fun than cycling!</span><br>
            <strong>Lizzie:</strong> I'm glad you had a good time.</p>

            <p><em>That is the end of Part Three.</em></p>
            `,

            questions: [
                {
                    num: 11,
                    text: "Where did Jasmine and her aunt go swimming?",
                    options: ["in the sea", "in the river", "in the lake"]
                },
                {
                    num: 12,
                    text: "How did Jasmine feel about sleeping in a tent to start with?",
                    options: ["excited", "afraid", "unhappy"]
                },
                {
                    num: 13,
                    text: "What did Jasmine's aunt like cooking?",
                    options: ["omelette", "steak", "pasta"]
                },
                {
                    num: 14,
                    text: "Jasmine's aunt thought the campsite",
                    options: ["needed a shop.", "had good showers.", "was too small."]
                },
                {
                    num: 15,
                    text: "Which activity did Jasmine like best?",
                    options: ["cycling", "fishing", "running"]
                }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest2Part3Data);
            console.log('KET 6 Test 2 Listening Part 3 loaded');
        });
    </script>
</body>
