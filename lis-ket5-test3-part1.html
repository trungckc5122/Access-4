<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KET 5 - Test 3 - Listening Part 1</title>
    <link rel="stylesheet" href="listening-pet-common.css" id="styleLink">
    <style>
        .question-item img {
            max-width: 760px !important;
            width: 100%;
            display: block;
        }

        .question-item .options {
            display: grid !important;
            grid-template-columns: 1fr 1fr 1fr;
            max-width: 760px;
            margin-top: 15px;
            gap: 15px;
        }

        .question-item .option {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            margin-bottom: 0 !important;
            padding: 10px 0 !important;
        }

        .question-item .option label {
            margin-left: 8px !important;
            flex: 0 1 auto !important;
            width: auto !important;
        }
    </style>
</head>

<body>
    <div class="test-wrapper" id="testWrapper">
        <!-- Header -->
        <div class="ielts-header">
            <div class="brand">
                <div class="ielts-logo">KET</div>
                <div class="candidate"></div>
                <div class="audio-controls">
                    <audio id="listeningAudio" controls>
                        <source src="audio/KET 5 - Test 3 Part 1.mp3" type="audio/mpeg">
                    </audio>
                    <select class="speed-select" id="speedSelect">
                        <option value="0.7">0.7x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1x</option>
                        <option value="1.1">1.1x</option>
                        <option value="1.25">1.25x</option>
                    </select>
                    <span class="volume-icon">🔊</span>
                </div>
            </div>
        </div>

        <!-- Question navigator -->
        <div class="question-nav">
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">
            <!-- Transcript panel -->
            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 1–5</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 1 &nbsp; Questions 1–5</h3>
                        <p><em>For each question, choose the correct answer.</em></p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>
            <div class="explanation-header">
                <span id="explanationTitle">Giải thích</span>
                <span class="close-btn" id="closeExplanation">✕ Đóng</span>
            </div>
            <div class="explanation-content" id="explanationText"></div>
        </div>
    </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest3Part1Data = {
            title: "KET 5 · Test 3 · Listening Part 1",
            type: "multiple-choice",
            part: 1,
            book: 5,
            test: 3,

            answerKey: { q1: 'A', q2: 'A', q3: 'C', q4: 'C', q5: 'A' },
            displayAnswers: { q1: 'A', q2: 'A', q3: 'C', q4: 'C', q5: 'A' },

            detailedExplanations: {
                q1: `<strong>Đáp án: A – Xe máy (motorbike)</strong><br>
                      Cô gái nói: <em>"my brother gave me a lift on his motorbike."</em><br>
                      Cô ngủ dậy muộn, nhờ anh chở bằng xe máy đến trường.<br><br>
                      <strong>✗ B (ô tô) sai:</strong> Cô hỏi mẹ lái xe nhưng xe không nổ máy ("our car didn't start").<br>
                      <strong>✗ C (xe buýt) sai:</strong> Bố hỏi có phải xe buýt trễ không nhưng cô nói không phải vấn đề đó.<br>
                      <strong>✓ A (motorbike) là đáp án chính xác.</strong>`,

                q2: `<strong>Đáp án: A – 1:10 (mười phút sau một giờ)</strong><br>
                      Cậu bé đề nghị: <em>"how about just after – at ten past one?"</em><br>
                      Cô gái đồng ý: <em>"Perfect for me."</em><br>
                      Ten past one = 1:10.<br><br>
                      <strong>✗ B (2:00) sai:</strong> Không đề cập đến 2 giờ.<br>
                      <strong>✗ C (3:05) sai:</strong> Đó là giờ cậu phải bắt xe buýt ("I have to get the bus at five past three").<br>
                      <strong>✓ A (1:10) là đáp án chính xác.</strong>`,

                q3: `<strong>Đáp án: C – Pizza</strong><br>
                      Cậu bé nói: <em>"he made some lovely pizza."</em><br>
                      Cậu thích pizza nhất tối qua.<br><br>
                      <strong>✗ A (bánh mì) sai:</strong> Chú không làm bánh mì tối hôm đó ("we didn't have any last night").<br>
                      <strong>✗ B (tráng miệng) sai:</strong> Món tráng miệng do anh họ làm nhưng "a bit too sweet for me" – không phải món cậu thích nhất.<br>
                      <strong>✓ C (pizza) là đáp án chính xác.</strong>`,

                q4: `<strong>Đáp án: C – Xà phòng (soap)</strong><br>
                      Cô gái nói: <em>"I haven't got enough soap – I've just checked."</em><br>
                      Cô đến hiệu thuốc để mua lược nhưng quên mua xà phòng, nên phải quay lại mua.<br><br>
                      <strong>✗ A (bàn chải đánh răng) sai:</strong> Cô nói "I've already packed it" – đã chuẩn bị rồi.<br>
                      <strong>✗ B (lược) sai:</strong> Cô đã đến hiệu thuốc để mua lược ("I went to buy a comb"), không phải cần mua thêm lược.<br>
                      <strong>✓ C (soap) là đáp án chính xác.</strong>`,

                q5: `<strong>Đáp án: A – Trên xe buýt (on the bus)</strong><br>
                      Cô gái nói: <em>"I walked to the bus stop with my friends and then got on the bus with them."</em><br>
                      Hiện tại cô đang ở trên xe buýt.<br><br>
                      <strong>✗ B (trong ô tô) sai:</strong> Bố đang ở trong ô tô đến đón cô, không phải cô.<br>
                      <strong>✗ C (trên đường phố) sai:</strong> Cô đã đi bộ đến bến xe buýt và lên xe rồi.<br>
                      <strong>✓ A (on the bus) là đáp án chính xác.</strong>`
            },

            transcript: `
            <p><strong>PART 1</strong></p>
            <p><em>For each question, choose the correct answer.</em></p>

            <p><strong>Question 1</strong><br>
            <strong>Man:</strong> You were a bit late for class! Was the bus late?<br>
            <strong>Girl:</strong> I know that's the usual problem, but I woke up late.<br>
            <strong>Man:</strong> Oh no!<br>
            <strong>Girl:</strong> But <span class="highlightable" data-q="1">my brother gave me a lift on his motorbike.</span> I asked Mum to drive me, but our car didn't start so I went with my brother. It was quite scary but fun!<br>
            <strong>Man:</strong> Lucky you!</p>

            <p><strong>Question 2</strong><br>
            <strong>Boy:</strong> It's great that we can play tennis together tomorrow.<br>
            <strong>Girl:</strong> You said you're free to meet after the last class?<br>
            <strong>Boy:</strong> Yeah, <span class="highlightable" data-q="2">how about just after – at ten past one?</span> I have to get the bus at five past three but that gives us nearly two hours.<br>
            <strong>Girl:</strong> Perfect for me.<br>
            <strong>Boy:</strong> Great – see you tomorrow!</p>

            <p><strong>Question 3</strong><br>
            <strong>Girl:</strong> How was your meal at your cousins' place last night?<br>
            <strong>Boy:</strong> Well, my uncle's a great cook.<br>
            <strong>Girl:</strong> I remember, you told me that he makes amazing bread, doesn't he?<br>
            <strong>Boy:</strong> Unfortunately, we didn't have any last night, but <span class="highlightable" data-q="3">he made some lovely pizza.</span> One of my cousins made dessert but it was a bit too sweet for me.</p>

            <p><strong>Question 4</strong><br>
            <strong>Man:</strong> Are you ready for the camping trip tomorrow? You forgot your toothbrush last time.<br>
            <strong>Girl:</strong> I've already packed it, Dad. But <span class="highlightable" data-q="4">I haven't got enough soap – I've just checked.</span><br>
            <strong>Man:</strong> Didn't you get some when you went to the chemist's?<br>
            <strong>Girl:</strong> I went to buy a comb and forgot – don't worry, I'll go again.<br>
            <strong>Man:</strong> OK, that's alright then.</p>

            <p><strong>Question 5</strong><br>
            <strong>Man:</strong> Millie, where are you? I've come to pick you up from school and you're not here!<br>
            <strong>Girl:</strong> Dad! Are you in the car? I tried to phone you. School finished early. <span class="highlightable" data-q="5">I walked to the bus stop with my friends and then got on the bus with them.</span> It's OK. I know where to get off.<br>
            <strong>Man:</strong> Well next time, leave me a message!</p>

            <p><em>That is the end of Part One.</em></p>
            `,

            questions: [
                { num: 1, text: "How did the girl get to school this morning?<br><img src='img-ket/ket 5-test 3-1.png' alt='Question 1' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 2, text: "What time will the friends meet tomorrow?<br><img src='img-ket/ket 5-test 3-2.png' alt='Question 2' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 3, text: "What did the boy enjoy most at the meal last night?<br><img src='img-ket/ket 5-test 3-3.png' alt='Question 3' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 4, text: "What does the girl need to buy?<br><img src='img-ket/ket 5-test 3-4.png' alt='Question 4' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 5, text: "Where's the girl now?<br><img src='img-ket/ket 5-test 3-5.png' alt='Question 5' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest3Part1Data);
            console.log('KET 5 Test 3 Listening Part 1 loaded');
        });
    </script>
</body>

</html>
