<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KET 5 - Test 1 - Listening Part 3</title>
    <link rel="stylesheet" href="listening-pet-common.css" id="styleLink">
</head>

<body>
    <div class="test-wrapper" id="testWrapper">
        <!-- Header -->
        <div class="ielts-header">
            <div class="brand">
                <div class="ielts-logo">KET</div>
                <div class="candidate"></div>
                <div class="audio-controls">
                    <audio id="listeningAudio" controls>
                        <source src="audio/KET 5 - Test 1 Part 3.mp3" type="audio/mpeg">
                    </audio>
                    <select class="speed-select" id="speedSelect">
                        <option value="0.7">0.7x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1x</option>
                        <option value="1.1">1.1x</option>
                        <option value="1.25">1.25x</option>
                    </select>
                    <span class="volume-icon">🔊</span>
                </div>
            </div>
        </div>

        <!-- Question navigator -->
        <div class="question-nav">
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">
            <!-- Transcript panel -->
            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 11–15</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 3 &nbsp; Questions 11–15</h3>
                        <p><em>For each question, choose the correct answer.</em></p>
                        <p style="margin-bottom:8px;">You will hear two friends talking about their chess club.</p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>
            <div class="explanation-header">
                <span id="explanationTitle">Giải thích</span>
                <span class="close-btn" id="closeExplanation">✕ Đóng</span>
            </div>
            <div class="explanation-content" id="explanationText"></div>
        </div>
    </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest1Part3Data = {
            title: "KET 5 · Test 1 · Listening Part 3",
            type: "multiple-choice",
            part: 3,
            book: 5,
            test: 1,

            answerKey: { q11: 'A', q12: 'C', q13: 'B', q14: 'A', q15: 'B' },
            displayAnswers: { q11: 'A', q12: 'C', q13: 'B', q14: 'A', q15: 'B' },

            detailedExplanations: {
                q11: `<strong>Đáp án: A – A teacher gave him information about it.</strong><br>
                      Cô gái nói: <em>"I'm glad <span class='keyword-highlight'>our teacher told us about chess club.</span>"</em><br>
                      Cậu bé đáp: <em>"I already knew about it. My dad saw an ad in a magazine for it..."</em><br><br>
                      <strong>✗ B (magazine) sai:</strong> Bố cậu thấy quảng cáo, nhưng cậu đã biết từ trước – câu hỏi hỏi về cậu bé, không phải bố.<br>
                      <strong>✗ C (teacher) sai:</strong> Giáo viên nói với cô gái, không phải cậu bé.<br>
                      <strong>✓ A (His father told him) là đúng – Bố thấy quảng cáo và nói với cậu.</strong>`,

                q12: `<strong>Đáp án: C – being with club members</strong><br>
                      Cậu bé nói: <em>"Only if you win, and I never do. <span class='keyword-highlight'>Spending time with the other players is the best thing.</span>"</em><br>
                      Cô gái đồng ý: <em>"True."</em><br><br>
                      <strong>✗ A (competitions) sai:</strong> Cậu bé không thích vì không bao giờ thắng.<br>
                      <strong>✗ B (coach) sai:</strong> Cậu bé khen coach nhưng không nói là thứ thích nhất; cô gái không đề cập.<br>
                      <strong>✓ C (being with club members) là đúng – Cả hai đều đồng ý điều này là hay nhất.</strong>`,

                q13: `<strong>Đáp án: B – She had to visit someone.</strong><br>
                      Cô gái nói: <em>"<span class='keyword-highlight'>I went to see grandma in hospital.</span> She had a terrible headache but she's home now."</em><br><br>
                      <strong>✗ A (homework) sai:</strong> Cô đang được bà giúp làm bài tối nay, không phải lý do vắng mặt.<br>
                      <strong>✗ C (headache) sai:</strong> Đó là bà bị nhức đầu, không phải cô gái.<br>
                      <strong>✓ B (visit someone) là đúng – Cô đến thăm bà ở bệnh viện.</strong>`,

                q14: `<strong>Đáp án: A – sorry that he couldn't take photos</strong><br>
                      Cậu bé nói: <em>"I wanted to take some team photos, but unfortunately <span class='keyword-highlight'>I left my mobile at home.</span>"</em><br><br>
                      <strong>✗ B (angry) sai:</strong> Cậu thua nhưng nói "it was a good game", không tức giận.<br>
                      <strong>✗ C (tired/walked) sai:</strong> Cậu lỡ xe buýt và đi bộ về, nhưng không đề cập đến mệt.<br>
                      <strong>✓ A (sorry couldn't take photos) là đúng – Quên điện thoại nên không chụp được.</strong>`,

                q15: `<strong>Đáp án: B – have a snack</strong><br>
                      Cậu bé nói: <em>"I have football then, but <span class='keyword-highlight'>let's have a sandwich at the café in the shopping centre before that.</span>"</em><br>
                      Cô gái đồng ý: <em>"OK."</em><br><br>
                      <strong>✗ A (cinema) sai:</strong> Cô gái muốn đi cinema nhưng cậu bé bận bóng đá.<br>
                      <strong>✗ C (shopping) sai:</strong> Shopping centre chỉ là địa điểm có café, không phải mục đích.<br>
                      <strong>✓ B (have a snack) là đúng – Họ sẽ ăn sandwich ở café cùng nhau.</strong>`
            },

            transcript: `
            <p><strong>PART 3</strong></p>
            <p><em>Now look at Part Three. For each question, choose the correct answer. Look at questions 11–15 now. You have 20 seconds.</em></p>
            <p>You will hear two friends talking about their chess club.</p>

            <p><strong>Girl:</strong> I'm glad our teacher told us about chess club.<br>
            <strong>Boy:</strong> I already knew about it. <span class="highlightable" data-q="11">My dad saw an ad in a magazine for it and said I should join.</span><br>
            <strong>Girl:</strong> What do you like about the club?<br>
            <strong>Boy:</strong> Well, the coach is really good.<br>
            <strong>Girl:</strong> And being in competitions is fun.<br>
            <strong>Boy:</strong> Only if you win, and I never do. <span class="highlightable" data-q="12">Spending time with the other players is the best thing.</span><br>
            <strong>Girl:</strong> True.</p>

            <p><strong>Boy:</strong> Why didn't you come last week?<br>
            <strong>Girl:</strong> <span class="highlightable" data-q="13">I went to see grandma in hospital.</span> She had a terrible headache but she's home now. Tonight she's helping me with my history homework.<br>
            <strong>Boy:</strong> Great.</p>

            <p><strong>Girl:</strong> Did you have a good time last week?<br>
            <strong>Boy:</strong> I played with Alex. I lost but it was a good game. <span class="highlightable" data-q="14">I wanted to take some team photos, but unfortunately I left my mobile at home.</span> I missed the bus and walked home.<br>
            <strong>Girl:</strong> Oh!</p>

            <p><strong>Boy:</strong> Are you coming next week?<br>
            <strong>Girl:</strong> Yes, and I'm going to the cinema afterwards. Would you like to come?<br>
            <strong>Boy:</strong> I have football then, but <span class="highlightable" data-q="15">let's have a sandwich at the café in the shopping centre before that.</span><br>
            <strong>Girl:</strong> OK.</p>

            <p><em>Now listen again. [repeat]</em></p>
            <p><em>That is the end of Part Three.</em></p>
            `,

            questions: [
                { num: 11, text: "How did the boy find out about the chess club?", options: ["His father told him about it.", "He saw an advert in a magazine.", "A teacher gave him information about it."] },
                { num: 12, text: "What do they both like most about the club?", options: ["playing in club competitions", "learning from the club's coach", "being with club members"] },
                { num: 13, text: "Why didn't the girl go to the club last week?", options: ["She had too much homework.", "She had to visit someone.", "She had a headache."] },
                { num: 14, text: "How did the boy feel at the club last week?", options: ["sorry that he couldn't take photos", "angry because he lost a match", "tired because he walked there"] },
                { num: 15, text: "What do they decide to do together after the club next week?", options: ["go to the cinema", "have a snack", "go shopping"] }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest1Part3Data);
            console.log('KET 5 Test 1 Listening Part 3 loaded');
        });
    </script>
</body>

</html>
