<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KET 4 - Test 1 - Listening Part 4</title>
    <link rel="stylesheet" href="listening-pet-common.css" id="styleLink">
</head>

<body>
    <div class="test-wrapper" id="testWrapper">
        <!-- Header -->
        <div class="ielts-header">
            <div class="brand">
                <div class="ielts-logo">KET</div>
                <div class="candidate"></div>
                <div class="audio-controls">
                    <audio id="listeningAudio" controls>
                        <source src="audio/KET 4 - Test 1 Part 4.mp3" type="audio/mpeg">
                    </audio>
                    <select class="speed-select" id="speedSelect">
                        <option value="0.7">0.7x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1x</option>
                        <option value="1.1">1.1x</option>
                        <option value="1.25">1.25x</option>
                    </select>
                    <span class="volume-icon">🔊</span>
                </div>
            </div>
        </div>

        <!-- Question navigator -->
        <div class="question-nav">
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">
            <!-- Transcript panel -->
            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 16–20</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 4 &nbsp; Questions 16–20</h3>
                        <p><em>For each question, choose the correct answer.</em></p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>
            <div class="explanation-header">
                <span id="explanationTitle">Giải thích</span>
                <span class="close-btn" id="closeExplanation">✕ Đóng</span>
            </div>
            <div class="explanation-content" id="explanationText"></div>
        </div>
    </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest1Part4Data = {
            title: "KET 4 · Test 1 · Listening Part 4",
            type: "multiple-choice",
            part: 4,
            book: 4,
            test: 1,

            // Đáp án đúng theo ảnh: 16C, 17B, 18C, 19B, 20B
            answerKey: { q16: 'C', q17: 'B', q18: 'C', q19: 'B', q20: 'B' },
            displayAnswers: { q16: 'C', q17: 'B', q18: 'C', q19: 'B', q20: 'B' },

            detailedExplanations: {
                q16: `<strong>Đáp án: C – It will be very useful</strong><br>
                      Cô gái giải thích lý do chọn túi: <em>"<span class='keyword-highlight'>He hasn’t got anything to put his sports kit in.</span>"</em><br>
                      Trước đó cô nghĩ đến khăn tắm nhưng đắt, và áp phích bóng đá thì quá to.<br><br>
                      <strong>✗ A (It was the right price) sai:</strong> Cô không đề cập đến giá của túi, chỉ nói khăn tắm đắt.<br>
                      <strong>✗ B (It was the right size) sai:</strong> Túi không liên quan đến kích cỡ; áp phích mới có vấn đề về kích cỡ.<br>
                      <strong>✓ C (It will be very useful) là đúng – Túi dùng để đựng đồ thể thao, rất hữu ích.</strong>`,

                q17: `<strong>Đáp án: B – He thinks it's too expensive</strong><br>
                      Cậu bé nói về trò chơi: <em>"I really loved playing it ... But <span class='keyword-highlight'>that's too much.</span>"</em> và <em>"I'll have to save up for it."</em><br><br>
                      <strong>✗ A (He's played it before) sai:</strong> Cậu đã chơi ở nhà bạn, nhưng đó không phải lý do không mua.<br>
                      <strong>✗ C (He can borrow it from his friend) sai:</strong> Cậu không nói về việc mượn.<br>
                      <strong>✓ B (He thinks it's too expensive) là đúng – Giá £45 là quá cao đối với cậu.</strong>`,

                q18: `<strong>Đáp án: C – on a mountain</strong><br>
                      Cô gái nói: <em>"What a fantastic view! You can see all the way down the valley to the lake."</em><br>
                      Cậu bé nói: <em>"Look at the sheep we passed when we were near the farm! They look like white flowers <span class='keyword-highlight'>from up here</span>."</em><br>
                      Họ đang ở trên cao nhìn xuống.<br><br>
                      <strong>✗ A (at a farm) sai:</strong> Họ đã đi qua trang trại, không phải đang ở đó.<br>
                      <strong>✗ B (in a forest) sai:</strong> Họ đã ra khỏi rừng ("when we came out of the wood").<br>
                      <strong>✓ C (on a mountain) là đúng – Họ đang ở trên núi, nhìn xuống thung lũng.</strong>`,

                q19: `<strong>Đáp án: B – enter a competition</strong><br>
                      Bố nói: <em>"Then <span class='keyword-highlight'>I’ll put my name on the form</span>. I’d love to visit Canada."</em><br>
                      Quảng cáo nói: "one lucky reader and their family can win a trip to Canada" → đây là một cuộc thi.<br><br>
                      <strong>✗ A (book a holiday) sai:</strong> Bố không đặt kỳ nghỉ, mà tham gia để giành giải.<br>
                      <strong>✗ C (buy a magazine) sai:</strong> Bố nói "I hardly ever read magazines" – không mua.<br>
                      <strong>✓ B (enter a competition) là đúng – Điền tên vào form để tham gia cuộc thi.</strong>`,

                q20: `<strong>Đáp án: B – He stayed at home</strong><br>
                      Cậu bé kể: <em>"I was going to, but <span class='keyword-highlight'>Jack came to see me on Saturday</span>. He was absent from school last week, so he needed to borrow my notes. <span class='keyword-highlight'>It was too late to go out afterwards.</span>"</em><br>
                      Vì Jack đến thăm nên cậu không ra ngoài được, nghĩa là cậu đã ở nhà.<br><br>
                      <strong>✗ A (He went shopping) sai:</strong> Cậu định đi mua sách nhưng không đi được.<br>
                      <strong>✗ C (He visited a classmate) sai:</strong> Bạn đến thăm cậu, không phải cậu đi thăm bạn.<br>
                      <strong>✓ B (He stayed at home) là đúng – Cậu ở nhà với Jack.</strong>`
            },

            transcript: `
            <p><strong>PART 4</strong></p>
            <p><em>For each question, choose the correct answer.</em></p>

            <p><strong>Question 16</strong><br>
            You will hear a brother and sister talking about a present for their cousin, Ben. Why did the girl choose the bag?<br>
            <strong>Boy:</strong> Did you manage to get Ben's birthday present?<br>
            <strong>Girl:</strong> Yes, I wanted to get a towel he can use after swimming, but they were all very expensive. I thought about a football poster, but the ones in the shop were enormous and his room's small.<br>
            <strong>Boy:</strong> What did you get?<br>
            <strong>Girl:</strong> <span class="highlightable" data-q="16">A bag! He hasn't got anything to put his sports kit in.</span><br>
            <strong>Boy:</strong> Great choice!</p>

            <p><strong>Question 17</strong><br>
            You will hear a boy talking to a friend about a computer game. Why doesn't he buy it now?<br>
            <strong>Girl:</strong> How about this computer game? It's £45.<br>
            <strong>Boy:</strong> I really loved playing it at my friend's house. But <span class="highlightable" data-q="17">that's too much.</span><br>
            <strong>Girl:</strong> But it's worth it! I borrowed it from my cousin and didn't want to give it back!<br>
            <strong>Boy:</strong> I'd love to get it, and then we can play it for as long as we like. But <span class="highlightable" data-q="17">I'll have to save up for it.</span></p>

            <p><strong>Question 18</strong><br>
            You will hear two friends talking together. Where are they?<br>
            <strong>Girl:</strong> What a fantastic view! You can see all the way down the valley to the lake.<br>
            <strong>Boy:</strong> Look at the sheep we passed when we were near the farm! They look like white flowers <span class="highlightable" data-q="18">from up here.</span><br>
            <strong>Girl:</strong> You know, I wanted to stop when we came out of the wood, but I'm glad we kept going.<br>
            <strong>Boy:</strong> So am I.</p>

            <p><strong>Question 19</strong><br>
            You will hear a girl, Kate, talking to her father. What's Kate's father going to do?<br>
            <strong>Girl:</strong> Have you seen this advert, Dad?<br>
            <strong>Man:</strong> Which advert? … No, I haven't. I hardly ever read magazines.<br>
            <strong>Girl:</strong> It says one lucky reader and their family can win a trip to Canada to see where they film my favourite TV series. You have to be over eighteen to take part.<br>
            <strong>Man:</strong> Then <span class="highlightable" data-q="19">I'll put my name on the form.</span> I'd love to visit Canada.</p>

            <p><strong>Question 20</strong><br>
            You will hear two friends talking about last weekend. What did the boy do?<br>
            <strong>Girl:</strong> How was your weekend? Did you buy that book you need for school?<br>
            <strong>Boy:</strong> I was going to, but <span class="highlightable" data-q="20">Jack came to see me on Saturday.</span> He was absent from school last week, so he needed to borrow my notes. <span class="highlightable" data-q="20">It was too late to go out afterwards.</span><br>
            <strong>Girl:</strong> Never mind, I'm passing that shop later, so I can get it for you.<br>
            <strong>Boy:</strong> Thanks.</p>

            <p><em>That is the end of Part Four.</em></p>
            `,

            questions: [
                { num: 16, text: "You will hear a brother and sister talking about a present for their cousin, Ben. Why did the girl choose the bag?", options: ["It was the right price.", "It was the right size.", "It will be very useful."] },
                { num: 17, text: "You will hear a boy talking to a friend about a computer game. Why doesn’t he buy it now?", options: ["He’s played it before.", "He thinks it’s too expensive.", "He can borrow it from his friend."] },
                { num: 18, text: "You will hear two friends talking together. Where are they?", options: ["at a farm", "in a forest", "on a mountain"] },
                { num: 19, text: "You will hear a girl, Kate, talking to her father. What’s Kate’s father going to do?", options: ["book a holiday", "enter a competition", "buy a magazine"] },
                { num: 20, text: "You will hear two friends talking about last weekend. What did the boy do?", options: ["He went shopping.", "He stayed at home.", "He visited a classmate."] }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest1Part4Data);
            console.log('KET 4 Test 1 Listening Part 4 loaded');
        });
    </script>
</body>

</html>
