<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KET 6 - Test 2 - Listening Part 1</title>
    <link rel="stylesheet" href="listening-pet-common.css" id="styleLink">
    <style>
        .question-item img {
            max-width: 760px !important;
            width: 100%;
            display: block;
        }

        .question-item .options {
            display: grid !important;
            grid-template-columns: 1fr 1fr 1fr;
            max-width: 760px;
            margin-top: 15px;
            gap: 15px;
        }

        .question-item .option {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            margin-bottom: 0 !important;
            padding: 10px 0 !important;
        }

        .question-item .option label {
            margin-left: 8px !important;
            flex: 0 1 auto !important;
            width: auto !important;
        }
    </style>
</head>

<body>
    <div class="test-wrapper" id="testWrapper">
        <!-- Header -->
        <div class="ielts-header">
            <div class="brand">
                <div class="ielts-logo">KET</div>
                <div class="candidate"></div>
                <div class="audio-controls">
                    <audio id="listeningAudio" controls>
                        <source src="audio/KET 6 - Test 2 Part 1.mp3" type="audio/mpeg">
                    </audio>
                    <select class="speed-select" id="speedSelect">
                        <option value="0.7">0.7x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1x</option>
                        <option value="1.1">1.1x</option>
                        <option value="1.25">1.25x</option>
                    </select>
                    <span class="volume-icon">🔊</span>
                </div>
            </div>
        </div>

        <!-- Question navigator -->
        <div class="question-nav">
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">
            <!-- Transcript panel -->
            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 1–5</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 1 &nbsp; Questions 1–5</h3>
                        <p><em>For each question, choose the correct answer.</em></p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>
            <div class="explanation-header">
                <span id="explanationTitle">Giải thích</span>
                <span class="close-btn" id="closeExplanation">✕ Đóng</span>
            </div>
            <div class="explanation-content" id="explanationText"></div>
        </div>
    </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest2Part1Data = {
            title: "KET 6 · Test 2 · Listening Part 1",
            type: "multiple-choice",
            part: 1,
            book: 6,
            test: 2,

            answerKey: { q1: 'C', q2: 'C', q3: 'A', q4: 'A', q5: 'B' },
            displayAnswers: { q1: 'C', q2: 'C', q3: 'A', q4: 'A', q5: 'B' },

            detailedExplanations: {
                q1: `<strong>Đáp án: C – Pizza</strong><br>
                      Pete nói: <em>"There's some pizza left … We didn't eat it all last night."</em> và <em>"I'm fine with the same as last night."</em><br>
                      Mặc dù mẹ đề nghị pasta hoặc salad, Pete muốn ăn pizza còn lại từ tối hôm trước.<br><br>
                      <strong>✗ A (salad) sai:</strong> Mẹ đề nghị salad nhưng Pete không muốn.<br>
                      <strong>✗ B (pasta) sai:</strong> Mẹ đề nghị pasta nhưng Pete từ chối.<br>
                      <strong>✓ C là đáp án chính xác – pizza.</strong>`,

                q2: `<strong>Đáp án: C – Grandma, dad, mum, and two girls</strong><br>
                      Emily mô tả: <em>"There's the grandma, she's really friendly, and two children, about my age."</em> và <em>"Just girls. Their dad's a photographer and their mum's a teacher."</em><br>
                      Gia đình gồm: bà, bố, mẹ và hai cô con gái.<br><br>
                      <strong>✗ A sai:</strong> Bức tranh A có một người đàn ông lớn tuổi (ông), không phải bà.<br>
                      <strong>✗ B sai:</strong> Bức tranh B có trẻ em là con trai, không phải toàn con gái.<br>
                      <strong>✓ C là đáp án chính xác – bà, bố (nhiếp ảnh gia), mẹ (giáo viên) và hai cô gái.</strong>`,

                q3: `<strong>Đáp án: A – Di chuyển đồ nội thất (moving furniture)</strong><br>
                      Oscar nói: <em>"I'm helping my dad move the furniture in my bedroom. And then we're going to paint the walls."</em><br>
                      Khi Isabel gọi, Oscar đang dọn đồ đạc trong phòng ngủ.<br><br>
                      <strong>✗ B (ăn tối) sai:</strong> Isabel hỏi nhưng Oscar không xác nhận.<br>
                      <strong>✗ C (sơn tường) sai:</strong> Sơn tường là việc sẽ làm sau, không phải lúc đó.<br>
                      <strong>✓ A là đáp án chính xác – dọn đồ nội thất trong phòng ngủ.</strong>`,

                q4: `<strong>Đáp án: A – Đang trên đường về từ kỳ nghỉ (driving back from holiday)</strong><br>
                      Niesha nói: <em>"I missed the party because we were driving back from holiday."</em><br>
                      Cô không đến được vì đang trên đường về nhà từ kỳ nghỉ.<br><br>
                      <strong>✗ B (bị ốm) sai:</strong> Cô bị ốm khi bỏ lỡ ngày thể thao ở trường, không phải bữa tiệc.<br>
                      <strong>✗ C (ăn tối với dì) sai:</strong> Đó là điều cô làm trong kỳ nghỉ, không phải lý do bỏ tiệc.<br>
                      <strong>✓ A là đáp án chính xác – đang lái xe về từ kỳ nghỉ.</strong>`,

                q5: `<strong>Đáp án: B – Trên bàn (on the desk / under books)</strong><br>
                      Oliver nói: <em>"Ah, I was right. Look – I couldn't see it because of the books."</em><br>
                      Trước đó anh hỏi: <em>"did I put it on the desk afterwards?"</em> → Điện thoại ở trên bàn, bị sách che khuất.<br><br>
                      <strong>✗ A (ghế sofa) sai:</strong> Poppy gợi ý ghế sofa nhưng Oliver tìm thấy ở nơi khác.<br>
                      <strong>✗ C (bàn bếp) sai:</strong> Poppy đề cập bàn bếp nhưng Oliver đã dùng điện thoại sau đó rồi.<br>
                      <strong>✓ B là đáp án chính xác – trên bàn, bị sách che.</strong>`
            },

            transcript: `
            <p><strong>PART 1</strong></p>
            <p><em>For each question, choose the correct answer.</em></p>

            <p><strong>Question 1</strong><br>
            <strong>Mum:</strong> Pete, would you like some pasta for lunch today?<br>
            <strong>Pete:</strong> <span class="highlightable" data-q="1">There's some pizza left … We didn't eat it all last night.</span><br>
            <strong>Mum:</strong> Don't you want something different? I can make a salad if you don't want pasta.<br>
            <strong>Pete:</strong> <span class="highlightable" data-q="1">I'm fine with the same as last night.</span><br>
            <strong>Mum:</strong> OK then. Lunch won't be long.</p>

            <p><strong>Question 2</strong><br>
            <strong>Emily:</strong> A new family has moved into the flat next to us. I met them yesterday.<br>
            <strong>Sean:</strong> What are they like?<br>
            <strong>Emily:</strong> Great. <span class="highlightable" data-q="2">There's the grandma, she's really friendly, and two children, about my age, I think.</span><br>
            <strong>Sean:</strong> Like you and your brother?<br>
            <strong>Emily:</strong> <span class="highlightable" data-q="2">Just girls. Their dad's a photographer and their mum's a teacher.</span></p>

            <p><strong>Question 3</strong><br>
            <strong>Isabel:</strong> Hi, Oscar, it's Isabel.<br>
            <strong>Oscar:</strong> Oh, hi. How are you? Listen, I can't talk for long, sorry.<br>
            <strong>Isabel:</strong> No problem. Are you having your dinner?<br>
            <strong>Oscar:</strong> <span class="highlightable" data-q="3">I'm helping my dad move the furniture in my bedroom. And then we're going to paint the walls.</span><br>
            <strong>Isabel:</strong> Wow! Don't worry, I'll send you a text later. Have fun painting!</p>

            <p><strong>Question 4</strong><br>
            <strong>Boy:</strong> Hi, Niesha, why didn't you go to Jack's party on Saturday? Were you sick?<br>
            <strong>Niesha:</strong> I was when I missed the sports day at school, but <span class="highlightable" data-q="4">I missed the party because we were driving back from holiday.</span><br>
            <strong>Boy:</strong> Did you visit your aunt – the one who's a chef?<br>
            <strong>Niesha:</strong> Yes, we had amazing dinners every night!</p>

            <p><strong>Question 5</strong><br>
            <strong>Oliver:</strong> Have you seen my mobile anywhere?<br>
            <strong>Poppy:</strong> I think it was on the kitchen table earlier.<br>
            <strong>Oliver:</strong> I've used it since then … did I put it on the desk afterwards?<br>
            <strong>Poppy:</strong> You often leave it on the sofa when you're watching TV.<br>
            <strong>Oliver:</strong> <span class="highlightable" data-q="5">Ah, I was right. Look – I couldn't see it because of the books.</span></p>

            <p><em>That is the end of Part One.</em></p>
            `,

            questions: [
                { num: 1, text: "What are they going to have for lunch?<br><img src='img-ket/ket 6-test 2-1.png' alt='Question 1' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 2, text: "Which family are Emily's new neighbours?<br><img src='img-ket/ket 6-test 2-2.png' alt='Question 2' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 3, text: "What was Oscar doing when Isabel phoned him?<br><img src='img-ket/ket 6-test 2-3.png' alt='Question 3' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 4, text: "Why didn't Niesha go to the party?<br><img src='img-ket/ket 6-test 2-4.png' alt='Question 4' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 5, text: "Where's Oliver's phone now?<br><img src='img-ket/ket 6-test 2-5.png' alt='Question 5' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest2Part1Data);
            console.log('KET 6 Test 2 Listening Part 1 loaded');
        });
    </script>
</body>

</html>
