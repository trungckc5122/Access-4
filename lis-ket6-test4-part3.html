<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KET 6 - Test 4 - Listening Part 3</title>
    <link rel="stylesheet" href="listening-pet-common.css" id="styleLink">
</head>

<body>
    <div class="test-wrapper" id="testWrapper">
        <!-- Header -->
        <div class="ielts-header">
            <div class="brand">
                <div class="ielts-logo">KET</div>
                <div class="candidate"></div>
                <div class="audio-controls">
                    <audio id="listeningAudio" controls>
                        <source src="audio/KET 6 - Test 4 Part 3.mp3" type="audio/mpeg">
                    </audio>
                    <select class="speed-select" id="speedSelect">
                        <option value="0.7">0.7x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1x</option>
                        <option value="1.1">1.1x</option>
                        <option value="1.25">1.25x</option>
                    </select>
                    <span class="volume-icon">🔊</span>
                </div>
            </div>
        </div>

        <!-- Question navigator -->
        <div class="question-nav">
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">
            <!-- Transcript panel -->
            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 11–15</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 3 &nbsp; Questions 11–15</h3>
                        <p><em>For each question, choose the correct answer.</em></p>
                        <p style="margin-bottom:8px;">You will hear Tommy talking to his friend Olga about their class party.</p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>
            <div class="explanation-header">
                <span id="explanationTitle">Giải thích</span>
                <span class="close-btn" id="closeExplanation">✕ Đóng</span>
            </div>
            <div class="explanation-content" id="explanationText"></div>
        </div>
    </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest4Part3Data = {
            title: "KET 6 · Test 4 · Listening Part 3",
            type: "multiple-choice",
            part: 3,
            book: 6,
            test: 4,

            answerKey: { q11: 'B', q12: 'B', q13: 'C', q14: 'C', q15: 'A' },
            displayAnswers: { q11: 'B', q12: 'B', q13: 'C', q14: 'C', q15: 'A' },

            detailedExplanations: {
                q11: `<strong>Đáp án: B – 28th June</strong><br>
                      Olga nói: <em>"I'm glad it's at the end of June because I'm having my birthday party on the first of July."</em><br>
                      Tommy nói: <em>"<span class='keyword-highlight'>And the twenty-eighth's better than the twenty-fifth because it's a Friday!</span>"</em><br>
                      Ngày 28 tốt hơn 25 vì là thứ Sáu → party ngày 28 tháng 6.<br><br>
                      <strong>✗ A (25th June) sai:</strong> Tommy nói ngày 28 tốt hơn ngày 25.<br>
                      <strong>✗ C (1st July) sai:</strong> Đó là ngày sinh nhật của Olga, không phải ngày party lớp.<br>
                      <strong>✓ B (28th June) là đáp án chính xác.</strong>`,

                q12: `<strong>Đáp án: B – his blue shorts</strong><br>
                      Tommy nói: <em>"Either my black jeans or blue shorts."</em><br>
                      Olga gợi ý: <em>"<span class='keyword-highlight'>Wear your new black T-shirt with blue shorts.</span>"</em><br>
                      Tommy đồng ý: <em>"OK."</em><br>
                      Olga khuyên mặc quần shorts xanh, không phải jeans đen hay T-shirt xanh.<br><br>
                      <strong>✗ A (black jeans) sai:</strong> Tommy có đề cập nhưng Olga không chọn jeans.<br>
                      <strong>✗ C (green T-shirt) sai:</strong> Olga gợi ý áo T-shirt ĐEN ("new black T-shirt"), không phải xanh lá.<br>
                      <strong>✓ B (blue shorts) là đáp án chính xác.</strong>`,

                q13: `<strong>Đáp án: C – helping tidy up</strong><br>
                      Olga nói: <em>"<span class='keyword-highlight'>I've got to help make sure everything's clean and tidy after the party, and that might take a long time.</span>"</em><br>
                      Olga lo lắng vì phải dọn dẹp sau bữa tiệc.<br><br>
                      <strong>✗ A (singing) sai:</strong> Tommy nói Olga không phải hát trước mọi người ("You're not singing in front of everyone like in the school concert").<br>
                      <strong>✗ B (playing the guitar) sai:</strong> Tommy nhắc lại năm ngoái Olga chơi đàn, nhưng năm nay không phải làm vậy.<br>
                      <strong>✓ C (helping tidy up) là đáp án chính xác.</strong>`,

                q14: `<strong>Đáp án: C – He wants to play tennis first</strong><br>
                      Tommy nói: <em>"<span class='keyword-highlight'>I want to be in the tennis match at my sports club.</span> I won't have time to get the bus, but my mum will drive me to the party."</em><br>
                      Tommy muốn chơi tennis trước nên đến muộn và nhờ mẹ chở.<br><br>
                      <strong>✗ A (wait for a lift) sai:</strong> Mẹ sẽ chở Tommy, nhưng lý do đến muộn là vì trận tennis, không phải vì phải chờ.<br>
                      <strong>✗ B (not many buses) sai:</strong> Tommy không đề cập đến ít xe buýt; anh nói "won't have time to get the bus" vì còn đang đánh tennis.<br>
                      <strong>✓ C (wants to play tennis first) là đáp án chính xác.</strong>`,

                q15: `<strong>Đáp án: A – some balloons</strong><br>
                      Tommy hỏi: <em>"You've got some balloons, haven't you?"</em><br>
                      Olga xác nhận: <em>"<span class='keyword-highlight'>That's right.</span>"</em><br>
                      Olga sẽ mang bóng bay đến bữa tiệc.<br><br>
                      <strong>✗ B (paper plates) sai:</strong> Tommy và mẹ sẽ mang đĩa giấy ("we'll bring some paper plates").<br>
                      <strong>✗ C (food) sai:</strong> Mẹ Tommy sẽ nấu đồ ăn ("Is your mum cooking some food for the party? Yes").<br>
                      <strong>✓ A (some balloons) là đáp án chính xác.</strong>`
            },

            transcript: `
            <p><strong>PART 3</strong></p>
            <p><em>For each question, choose the correct answer.</em></p>
            <p>You will hear Tommy talking to his friend Olga about their class party.</p>

            <p><strong>Tommy:</strong> Olga, you're coming to the class party at school, aren't you?<br>
            <strong>Olga:</strong> Yes, Tommy. I'm glad it's at the end of June because I'm having my birthday party on the first of July.<br>
            <strong>Tommy:</strong> <span class="highlightable" data-q="11">And the twenty-eighth's better than the twenty-fifth because it's a Friday!</span></p>

            <p><strong>Olga:</strong> What are you going to wear?<br>
            <strong>Tommy:</strong> Either my black jeans or blue shorts.<br>
            <strong>Olga:</strong> <span class="highlightable" data-q="12">Wear your new black T-shirt with blue shorts.</span><br>
            <strong>Tommy:</strong> OK.</p>

            <p><strong>Olga:</strong> I'm a bit worried about the party.<br>
            <strong>Tommy:</strong> Why? You're not singing in front of everyone like in the school concert or playing the guitar like last year.<br>
            <strong>Olga:</strong> <span class="highlightable" data-q="13">But I've got to help make sure everything's clean and tidy after the party, and that might take a long time.</span><br>
            <strong>Tommy:</strong> I don't think so.</p>

            <p><strong>Tommy:</strong> Actually, I'll probably arrive late.<br>
            <strong>Olga:</strong> Why?<br>
            <strong>Tommy:</strong> <span class="highlightable" data-q="14">I want to be in the tennis match at my sports club.</span> I won't have time to get the bus, but my mum will drive me to the party.<br>
            <strong>Olga:</strong> Oh, OK.</p>

            <p><strong>Olga:</strong> Is your mum cooking some food for the party?<br>
            <strong>Tommy:</strong> Yes, and we'll bring some paper plates. And you've got some balloons, haven't you?<br>
            <strong>Olga:</strong> <span class="highlightable" data-q="15">That's right.</span></p>

            <p><em>Now listen again. [repeat]</em></p>
            <p><em>That is the end of Part Three.</em></p>
            `,

            questions: [
                { num: 11, text: "Which date is the class party?", options: ["25th June", "28th June", "1st July"] },
                { num: 12, text: "What does Olga think Tommy should wear to the party?", options: ["his black jeans", "his blue shorts", "his green T-shirt"] },
                { num: 13, text: "What's Olga worried about?", options: ["singing at the party", "playing the guitar", "helping tidy up"] },
                { num: 14, text: "Why will Tommy arrive at the party late?", options: ["He'll have to wait for a lift.", "There aren't many buses.", "He wants to play tennis first."] },
                { num: 15, text: "What's Olga going to take to the party?", options: ["some balloons", "some paper plates", "some food"] }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest4Part3Data);
            console.log('KET 6 Test 4 Listening Part 3 loaded');
        });
    </script>
</body>

</html>
