</head>

<body>

                        <option value="0.7">0.7x</option>
                        <option value="0.9">0.9x</option>

                    </select>

                </div>
            </div>
        </div>

        <!-- Question navigator -->
        <div class="question-nav">
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">

            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 16–20</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 4 &nbsp; Questions 16–20</h3>

                    </div>

            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>

            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest3Part4Data = {
            title: "KET 6 · Test 3 · Listening Part 4",
            type: "multiple-choice",
            part: 4,
            book: 6,
            test: 3,

            answerKey: { q16: 'B', q17: 'C', q18: 'A', q19: 'B', q20: 'B' },
            displayAnswers: { q16: 'B', q17: 'C', q18: 'A', q19: 'B', q20: 'B' },

            detailedExplanations: {
                q16: `<strong>Đáp án: B – the middle</strong><br>
                      Millie nói: <em>"It started by showing the different places different animals like to live in, and all that bit was clear. <span class='keyword-highlight'>The next bit was difficult though. I needed my mum to explain it to me!</span> Then the last part was good and I didn't have any problems understanding it."</em><br>
                      Phần đầu rõ ràng, phần cuối ổn — chỉ có phần giữa (the middle) là khó hiểu.<br><br>
                      <strong>✗ A (the beginning) sai:</strong> Millie nói "all that bit was clear" về phần đầu.<br>
                      <strong>✗ C (the end) sai:</strong> Millie nói "I didn't have any problems understanding it" về phần cuối.<br>
                      <strong>✓ B (the middle) là đáp án chính xác.</strong>`,

                q17: `<strong>Đáp án: C – It was unusual</strong><br>
                      Tom nói: <em>"<span class='keyword-highlight'>I've never heard music like that before or seen some of those instruments before.</span>"</em><br>
                      Tom chưa từng nghe âm nhạc hay nhìn thấy nhạc cụ như vậy = buổi hòa nhạc độc đáo, khác thường (unusual).<br><br>
                      <strong>✗ A (It was boring) sai:</strong> Tom nói "Doing the same thing's awful" – chính sự lặp lại mới nhàm, còn buổi này thì khác biệt.<br>
                      <strong>✗ B (It was terrible) sai:</strong> Jess nghĩ nhạc công chơi dở, nhưng Tom phản bác "I think they played well".<br>
                      <strong>✓ C (It was unusual) là đáp án chính xác.</strong>`,

                q18: `<strong>Đáp án: A – to meet someone</strong><br>
                      Cậu bé hỏi bố: <em>"Shall I phone Mum now to say we'll be at the café in the main square in 30 minutes?"</em><br>
                      Họ đang đến trung tâm để gặp mẹ ở quán café (to meet someone).<br><br>
                      <strong>✗ B (to buy something) sai:</strong> Bố nhờ mẹ mua báo, nhưng đây là việc nhờ mẹ làm — không phải lý do bố con đi vào thành phố.<br>
                      <strong>✗ C (to watch something) sai:</strong> Bố đang xem bóng đá ở nhà trước khi đi, không phải đi xem gì ở trung tâm.<br>
                      <strong>✓ A (to meet someone) là đáp án chính xác.</strong>`,

                q19: `<strong>Đáp án: B – They're going to have their lesson outside</strong><br>
                      Thầy giáo nói: <em>"<span class='keyword-highlight'>we're allowed to go to the park today!</span>"</em><br>
                      Học sinh được ra công viên học — tức là học ngoài trời (lesson outside).<br><br>
                      <strong>✗ A (They're going to start a new project) sai:</strong> Dự án địa lý đã bắt đầu trước đó, hôm nay chỉ đi chụp thêm ảnh.<br>
                      <strong>✗ C (They're going to have a longer lesson) sai:</strong> Thầy nói về giờ quay lại lớp nhưng không đề cập tiết học dài hơn.<br>
                      <strong>✓ B (They're going to have their lesson outside) là đáp án chính xác.</strong>`,

                q20: `<strong>Đáp án: B – a tour guide</strong><br>
                      Cậu bé nói: <em>"<span class='keyword-highlight'>Her husband travels a lot in his job, showing tourists round different cities.</span>"</em><br>
                      Chồng Emma dẫn khách du lịch tham quan các thành phố = hướng dẫn viên du lịch (tour guide).<br><br>
                      <strong>✗ A (an artist) sai:</strong> Chính Emma mới là người học nghệ thuật và có việc làm vẽ minh họa sách — không phải chồng cô.<br>
                      <strong>✗ C (a cook) sai:</strong> Emma sống trên căn hộ phía trên nhà hàng Marco's, nhưng chồng cô không làm nghề bếp.<br>
                      <strong>✓ B (a tour guide) là đáp án chính xác.</strong>`
            },

            transcript: `
            <p><strong>PART 4</strong></p>
            <p><em>For each question, choose the correct answer.</em></p>

            <p><strong>Question 16</strong><br>
            You will hear a girl talking about a video. Which part of the video didn't she understand?<br>
            <strong>Millie:</strong> I liked that film about animals that live in the Amazon Forest. It started by showing the different places different animals like to live in, and all that bit was clear. <span class="highlightable" data-q="16">The next bit was difficult though. I needed my mum to explain it to me!</span> Then the last part was good and I didn't have any problems understanding it.</p>

            <p><strong>Question 17</strong><br>
            You will hear two friends talking about a concert. What's the boy's opinion of the concert?<br>
            <strong>Jess:</strong> I didn't like the school concert yesterday, mainly because the musicians hadn't practised enough. They were really bad, I think.<br>
            <strong>Tom:</strong> Really? I think they played well, but <span class="highlightable" data-q="17">I've never heard music like that before or seen some of those instruments before.</span><br>
            <strong>Jess:</strong> It must be interesting to play new stuff, I guess.<br>
            <strong>Tom:</strong> Exactly! Doing the same thing's awful.</p>

            <p><strong>Question 18</strong><br>
            You will hear a boy talking to his dad about going to the city centre. Why are they going to the city centre?<br>
            <strong>Boy:</strong> When are we going to the city centre?<br>
            <strong>Dad:</strong> I just want to see the end of this football match. Then, we can go.<br>
            <strong>Boy:</strong> <span class="highlightable" data-q="18">Shall I phone Mum now to say we'll be at the café in the main square in 30 minutes?</span><br>
            <strong>Dad:</strong> Yes, please. And could you ask her to get today's newspaper for me?<br>
            <strong>Boy:</strong> Sure.</p>

            <p><strong>Question 19</strong><br>
            You will hear a teacher talking to his class. What information is he giving his students?<br>
            <strong>Man:</strong> Listen, everyone. Because you still need some photos to add to your geography project, <span class="highlightable" data-q="19">we're allowed to go to the park today!</span> I know you love working there, but you must still make sure you do your school work carefully. We're coming back to the classroom at ten, so that we have time to put everything away.</p>

            <p><strong>Question 20</strong><br>
            You will hear a boy talking about his sister, Emma. Who has Emma married?<br>
            <strong>Boy:</strong> My sister Emma got married last week to a guy she met in Paris. And now she lives in an apartment above that restaurant called Marco's in Green Street. She finished studying art and design last year and has just got a job drawing pictures for a book! <span class="highlightable" data-q="20">Her husband travels a lot in his job, showing tourists round different cities.</span></p>

            <p><em>That is the end of Part Four.</em></p>
            `,

            questions: [
                {
                    num: 16,
                    text: "You will hear a girl talking about a video. Which part of the video didn't she understand?",
                    options: ["the beginning", "the middle", "the end"]
                },
                {
                    num: 17,
                    text: "You will hear two friends talking about a concert. What's the boy's opinion of the concert?",
                    options: ["It was boring.", "It was terrible.", "It was unusual."]
                },
                {
                    num: 18,
                    text: "You will hear a boy talking to his dad about going to the city centre. Why are they going to the city centre?",
                    options: ["to meet someone", "to buy something", "to watch something"]
                },
                {
                    num: 19,
                    text: "You will hear a teacher talking to his class. What information is he giving his students?",
                    options: ["They're going to start a new project.", "They're going to have their lesson outside.", "They're going to have a longer lesson."]
                },
                {
                    num: 20,
                    text: "You will hear a boy talking about his sister, Emma. Who has Emma married?",
                    options: ["an artist", "a tour guide", "a cook"]
                }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest3Part4Data);
            console.log('KET 6 Test 3 Listening Part 4 loaded');
        });
    </script>
