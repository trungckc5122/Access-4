<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KET 6 - Test 3 - Listening Part 1</title>
    <link rel="stylesheet" href="listening-pet-common.css" id="styleLink">
    <style>
        .question-item img {
            max-width: 760px !important;
            width: 100%;
            display: block;
        }

        .question-item .options {
            display: grid !important;
            grid-template-columns: 1fr 1fr 1fr;
            max-width: 760px;
            margin-top: 15px;
            gap: 15px;
        }

        .question-item .option {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            margin-bottom: 0 !important;
            padding: 10px 0 !important;
        }

        .question-item .option label {
            margin-left: 8px !important;
            flex: 0 1 auto !important;
            width: auto !important;
        }
    </style>
</head>

<body>
    <div class="test-wrapper" id="testWrapper">
        <!-- Header -->
        <div class="ielts-header">
            <div class="brand">
                <div class="ielts-logo">KET</div>
                <div class="candidate"></div>
                <div class="audio-controls">
                    <audio id="listeningAudio" controls>
                        <source src="audio/KET 6 - Test 3 Part 1.mp3" type="audio/mpeg">
                    </audio>
                    <select class="speed-select" id="speedSelect">
                        <option value="0.7">0.7x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1x</option>
                        <option value="1.1">1.1x</option>
                        <option value="1.25">1.25x</option>
                    </select>
                    <span class="volume-icon">🔊</span>
                </div>
            </div>
        </div>

        <!-- Question navigator -->
        <div class="question-nav">
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">
            <!-- Transcript panel -->
            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 1–5</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 1 &nbsp; Questions 1–5</h3>
                        <p><em>For each question, choose the correct answer.</em></p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>
            <div class="explanation-header">
                <span id="explanationTitle">Giải thích</span>
                <span class="close-btn" id="closeExplanation">✕ Đóng</span>
            </div>
            <div class="explanation-content" id="explanationText"></div>
        </div>
    </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest3Part1Data = {
            title: "KET 6 · Test 3 · Listening Part 1",
            type: "multiple-choice",
            part: 1,
            book: 6,
            test: 3,

            answerKey: { q1: 'B', q2: 'C', q3: 'A', q4: 'C', q5: 'A' },
            displayAnswers: { q1: 'B', q2: 'C', q3: 'A', q4: 'C', q5: 'A' },

            detailedExplanations: {
                q1: `<strong>Đáp án: B – 7:10</strong><br>
                      Dad kiểm tra và nói: <em>"it's on just after the six-thirty sports programme, so ten past seven actually."</em><br>
                      Ten past seven = 7:10.<br><br>
                      <strong>✗ A (6:30) sai:</strong> Đó là giờ bắt đầu chương trình thể thao, không phải chương trình thiên nhiên.<br>
                      <strong>✗ C (7:30) sai:</strong> Catherine đoán là 7:30 nhưng bố đã kiểm tra và xác nhận là 7:10.<br>
                      <strong>✓ B (7:10) là đáp án chính xác.</strong>`,

                q2: `<strong>Đáp án: C – Bạn Sarah (friend Sarah)</strong><br>
                      Mum giải thích: <em>"She's asking her friend Sarah, you know, our neighbour's daughter, about some maths homework."</em><br>
                      Diana đang gọi điện cho bạn Sarah – con gái của hàng xóm.<br><br>
                      <strong>✗ A (cậu bé / boy) sai:</strong> Cậu bé hỏi chứ không phải người Diana gọi.<br>
                      <strong>✗ B (Dì Christine) sai:</strong> Cậu bé đoán Diana gọi cho dì Christine nhưng thực ra không phải.<br>
                      <strong>✓ C (Sarah) là đáp án chính xác.</strong>`,

                q3: `<strong>Đáp án: A – Phòng ngủ (bedroom)</strong><br>
                      Mum nói: <em>"On that little table next to my bed would be great."</em><br>
                      Henry sẽ đặt đồng hồ lên bàn nhỏ bên cạnh giường của mẹ, trong phòng ngủ.<br><br>
                      <strong>✗ B (bếp / kitchen) sai:</strong> Đồng hồ đang ở cạnh bếp nhưng mẹ không muốn để lại đó.<br>
                      <strong>✗ C (phòng khách / sitting room) sai:</strong> Mẹ tưởng đồng hồ trên sofa trong phòng khách nhưng thực ra không phải.<br>
                      <strong>✓ A (bedroom) là đáp án chính xác.</strong>`,

                q4: `<strong>Đáp án: C – Đi bộ về nhà (walked home)</strong><br>
                      Cô gái nói: <em>"I walked all the way home because the bus was late. It took an hour!"</em><br>
                      Cô mệt vì phải đi bộ suốt một tiếng về nhà.<br><br>
                      <strong>✗ A (chơi tennis) sai:</strong> Cô không chơi tennis – Jane chơi với người khác.<br>
                      <strong>✗ B (dọn phòng) sai:</strong> Cậu bé nhờ cô dọn phòng nhưng cô từ chối.<br>
                      <strong>✓ C (walked home) là đáp án chính xác.</strong>`,

                q5: `<strong>Đáp án: A – Có nắng (sunny / hot)</strong><br>
                      Boy 1 nói: <em>"it'll be about 25 degrees. Mum checked the temperature."</em><br>
                      Boy 2 lo ngại trời sẽ có mây nhưng Boy 1 xác nhận trời sẽ nóng khoảng 25 độ – tức là nắng.<br><br>
                      <strong>✗ B (mưa) sai:</strong> Boy 2 đề cập đến lần bơi trong mưa khi đi nghỉ, không phải dự báo Chủ nhật.<br>
                      <strong>✗ C (nhiều mây) sai:</strong> Boy 2 lo trời có mây nhưng điều đó không xảy ra – trời sẽ nóng 25 độ.<br>
                      <strong>✓ A (sunny/hot ~25°C) là đáp án chính xác.</strong>`
            },

            transcript: `
            <p><strong>PART 1</strong></p>
            <p><em>For each question, choose the correct answer.</em></p>

            <p><strong>Question 1</strong><br>
            <strong>Dad:</strong> Are you going to watch the nature programme after dinner tonight, Catherine?<br>
            <strong>Catherine:</strong> Yes, I think it begins at seven thirty, doesn't it, Dad?<br>
            <strong>Dad:</strong> Let me check … <span class="highlightable" data-q="1">Oh, it's on just after the six-thirty sports programme, so ten past seven actually.</span> We can have dinner earlier than usual if you like.<br>
            <strong>Catherine:</strong> Great!</p>

            <p><strong>Question 2</strong><br>
            <strong>Boy:</strong> Mum, who's Diana phoning? Is she calling Aunt Christine about borrowing her bike?<br>
            <strong>Mum:</strong> <span class="highlightable" data-q="2">She's asking her friend Sarah, you know, our neighbour's daughter, about some maths homework.</span> Have you done your homework?<br>
            <strong>Boy:</strong> I'm doing a project with David, remember? He's coming a bit later so that we can work here.<br>
            <strong>Mum:</strong> Oh, yes. You did tell me about David.</p>

            <p><strong>Question 3</strong><br>
            <strong>Henry:</strong> Mum, is this your watch here next to the cooker?<br>
            <strong>Mum:</strong> Oh, yes! Thank you, Henry, I was looking for it a minute ago in the sitting room. I thought it was on the sofa.<br>
            <strong>Henry:</strong> Shall I leave it in the kitchen or put it in your bedroom?<br>
            <strong>Mum:</strong> <span class="highlightable" data-q="3">On that little table next to my bed would be great.</span><br>
            <strong>Henry:</strong> OK.</p>

            <p><strong>Question 4</strong><br>
            <strong>Girl:</strong> I think I'll go to bed early tonight.<br>
            <strong>Boy:</strong> Yeah, you look tired. Did you play tennis with Jane after school?<br>
            <strong>Girl:</strong> She played with someone else. <span class="highlightable" data-q="4">I walked all the way home because the bus was late. It took an hour!</span><br>
            <strong>Boy:</strong> Wow! But can you help me tidy my bedroom?<br>
            <strong>Girl:</strong> Erm, sorry!</p>

            <p><strong>Question 5</strong><br>
            <strong>Boy 1:</strong> I'm going swimming in the lake on Sunday with my mum and dad. Do you want to come?<br>
            <strong>Boy 2:</strong> Isn't it going to be cloudy on Sunday?<br>
            <strong>Boy 1:</strong> That doesn't matter because <span class="highlightable" data-q="5">it'll be about 25 degrees. Mum checked the temperature.</span><br>
            <strong>Boy 2:</strong> Oh, OK then. I went swimming when it was raining on holiday. It was really funny!</p>

            <p><em>That is the end of Part One.</em></p>
            `,

            questions: [
                { num: 1, text: "What time does the nature programme start?<br><img src='img-ket/ket 6-test 3-1.png' alt='Question 1' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 2, text: "Who is Diana talking to on her mobile?<br><img src='img-ket/ket 6-test 3-2.png' alt='Question 2' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 3, text: "Where will Henry put his mum's watch?<br><img src='img-ket/ket 6-test 3-3.png' alt='Question 3' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 4, text: "Why is the girl tired?<br><img src='img-ket/ket 6-test 3-4.png' alt='Question 4' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 5, text: "What will the weather be like on Sunday?<br><img src='img-ket/ket 6-test 3-5.png' alt='Question 5' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest3Part1Data);
            console.log('KET 6 Test 3 Listening Part 1 loaded');
        });
    </script>
