        <div class="question-nav">
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">

            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 16–20</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 4 &nbsp; Questions 16–20</h3>
                        <p><em>For each question, choose the correct answer.</em></p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>

            </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest3Part4Data = {
            title: "KET 5 · Test 3 · Listening Part 4",
            type: "multiple-choice",
            part: 4,
            book: 5,
            test: 3,

            answerKey: { q16: 'C', q17: 'C', q18: 'B', q19: 'B', q20: 'A' },
            displayAnswers: { q16: 'C', q17: 'C', q18: 'B', q19: 'B', q20: 'A' },

            detailedExplanations: {
                q16: `<strong>Đáp án: C – asking them to do a classroom activity</strong><br>
                      Giáo viên nói: <em>"Today I'd like you to work in pairs and <span class='keyword-highlight'>make a poster about the museum.</span> We don't have lots of time so please start immediately."</em><br>
                      Cô đang yêu cầu học sinh làm một hoạt động trong lớp (làm poster) ngay tại chỗ.<br><br>
                      <strong>✗ A (giving them some homework) sai:</strong> Cô nói "it shouldn't be necessary for you to finish this at home" – không phải bài tập về nhà.<br>
                      <strong>✗ B (telling them about a school trip) sai:</strong> Chuyến đi đến bảo tàng đã diễn ra tuần trước ("our museum visit last week").<br>
                      <strong>✓ C (asking them to do a classroom activity) là đáp án chính xác.</strong>`,

                q17: `<strong>Đáp án: C – It's useful</strong><br>
                      Cậu bé nói: <em>"I know you like stories based on facts, and <span class='keyword-highlight'>this one teaches you a lot about music.</span>"</em><br>
                      Cuốn sách dạy nhiều kiến thức về âm nhạc = hữu ích (useful).<br><br>
                      <strong>✗ A (It's funny) sai:</strong> Cô gái đề cập đến cuốn sách về chú hề ("the book you lent me about a clown") là hài hước, nhưng đó là sách trước, không phải sách mới.<br>
                      <strong>✗ B (It's long) sai:</strong> Cậu bé nói "It's not got too many pages" – cuốn sách không dài.<br>
                      <strong>✓ C (It's useful) là đáp án chính xác.</strong>`,

                q18: `<strong>Đáp án: B – the length of the holiday</strong><br>
                      Cậu bé nói: <em>"<span class='keyword-highlight'>What I hated most was having to go home early because I'd hurt my foot!</span>"</em><br>
                      Tệ nhất là phải về sớm hơn dự định = kỳ nghỉ bị rút ngắn (length of holiday).<br><br>
                      <strong>✗ A (the bad weather) sai:</strong> Cậu nói trời mưa liên tục ("it rained constantly") nhưng đó không phải điều tệ nhất.<br>
                      <strong>✗ C (the noise on the campsite) sai:</strong> Cậu nói "Sometimes, but that didn't matter" về tiếng ồn.<br>
                      <strong>✓ B (the length of the holiday) là đáp án chính xác.</strong>`,

                q19: `<strong>Đáp án: B – He slept a lot</strong><br>
                      Cậu bé nói: <em>"<span class='keyword-highlight'>I'm glad I went to bed early every night last week – I needed lots of energy!</span>"</em><br>
                      Cậu ngủ sớm mỗi tối để chuẩn bị năng lượng.<br><br>
                      <strong>✗ A (He ate a lot) sai:</strong> Cô gái đề cập đến việc ăn uống quan trọng, nhưng cậu bé nói "I didn't worry about that".<br>
                      <strong>✗ C (He practised a lot) sai:</strong> Cậu bé nói rõ "I didn't even practise more than usual".<br>
                      <strong>✓ B (He slept a lot) là đáp án chính xác.</strong>`,

                q20: `<strong>Đáp án: A – She arrived too late</strong><br>
                      Louisa nói: <em>"my phone battery ran out. So <span class='keyword-highlight'>when I saw your message, it was already too late to go.</span>"</em><br>
                      Cô thấy tin nhắn nhưng đã quá muộn để đến.<br><br>
                      <strong>✗ B (She wasn't feeling well) sai:</strong> Cậu bé hỏi "Were you ill or something?" nhưng Louisa không xác nhận điều đó.<br>
                      <strong>✗ C (She didn't know about the game) sai:</strong> Cô nhận được tin nhắn, chỉ là pin điện thoại hết nên xem trễ.<br>
                      <strong>✓ A (She arrived too late) là đáp án chính xác.</strong>`
            },

            transcript: `
            <p><strong>PART 4</strong></p>
            <p><em>For each question, choose the correct answer.</em></p>

            <p><strong>Question 16</strong><br>
            You will hear a teacher talking to her students. What's she doing?<br>
            <strong>Woman:</strong> So, I can see everyone's got the information you collected during our museum visit last week. And well done if you've brought photos. <span class="highlightable" data-q="16">Today I'd like you to work in pairs and make a poster about the museum.</span> We don't have lots of time so please start immediately – it shouldn't be necessary for you to finish this at home.</p>

            <p><strong>Question 17</strong><br>
            You will hear two friends talking about reading. What does the boy say about the book he's just read?<br>
            <strong>Girl:</strong> What books have you read recently?<br>
            <strong>Boy:</strong> I've just read one about a boy who starts a school band. It's not got too many pages.<br>
            <strong>Girl:</strong> Would I like it? I didn't like the book you lent me about a clown.<br>
            <strong>Boy:</strong> Haha, I know you like stories based on facts, and <span class="highlightable" data-q="17">this one teaches you a lot about music.</span> Would you like to borrow it?<br>
            <strong>Girl:</strong> Yes, please.</p>

            <p><strong>Question 18</strong><br>
            You will hear two friends talking about holidays. What was the worst problem with the boy's holiday?<br>
            <strong>Boy:</strong> Have you been on holiday this summer?<br>
            <strong>Girl:</strong> Not yet, we're going camping next week. Do you like camping?<br>
            <strong>Boy:</strong> Yes, but last time we went it rained constantly.<br>
            <strong>Girl:</strong> Oh no, you were unlucky! Was the campsite noisy?<br>
            <strong>Boy:</strong> Sometimes, but that didn't matter. <span class="highlightable" data-q="18">What I hated most was having to go home early because I'd hurt my foot!</span></p>

            <p><strong>Question 19</strong><br>
            You will hear a boy talking after a tennis match. How did he prepare for the match?<br>
            <strong>Girl:</strong> Well done! You played really well.<br>
            <strong>Boy:</strong> Thanks, I was lucky to win – that was one of the hardest tennis matches I've ever played. <span class="highlightable" data-q="19">I'm glad I went to bed early every night last week – I needed lots of energy!</span><br>
            <strong>Girl:</strong> Yeah, what you eat is important too.<br>
            <strong>Boy:</strong> I didn't worry about that, and I didn't even practise more than usual.</p>

            <p><strong>Question 20</strong><br>
            You will hear Louisa talking to her friend about a football game. Why did Louisa miss the game?<br>
            <strong>Boy:</strong> Hi Louisa. Why didn't you come to the football game? I texted you about it. Were you ill or something?<br>
            <strong>Girl:</strong> Oh sorry, my phone battery ran out. So <span class="highlightable" data-q="20">when I saw your message, it was already too late to go.</span><br>
            <strong>Boy:</strong> Oh right.<br>
            <strong>Girl:</strong> So, tell me earlier next time. And if I feel like it, I'll come!<br>
            <strong>Boy:</strong> Cool!</p>

            <p><em>That is the end of Part Four.</em></p>
            `,

            questions: [
                {
                    num: 16,
                    text: "You will hear a teacher talking to her students. What's she doing?",
                    options: ["giving them some homework", "telling them about a school trip", "asking them to do a classroom activity"]
                },
                {
                    num: 17,
                    text: "You will hear two friends talking about reading. What does the boy say about the book he's just read?",
                    options: ["It's funny.", "It's long.", "It's useful."]
                },
                {
                    num: 18,
                    text: "You will hear two friends talking about holidays. What was the worst problem with the boy's holiday?",
                    options: ["the bad weather", "the length of the holiday", "the noise on the campsite"]
                },
                {
                    num: 19,
                    text: "You will hear a boy talking after a tennis match. How did he prepare for the match?",
                    options: ["He ate a lot.", "He slept a lot.", "He practised a lot."]
                },
                {
                    num: 20,
                    text: "You will hear Louisa talking to her friend about a football game. Why did Louisa miss the game?",
                    options: ["She arrived too late.", "She wasn't feeling well.", "She didn't know about the game."]
                }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest3Part4Data);
            console.log('KET 5 Test 3 Listening Part 4 loaded');
        });
    </script>
