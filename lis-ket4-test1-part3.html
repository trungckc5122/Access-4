<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KET 4 - Test 1 - Listening Part 3</title>
    <link rel="stylesheet" href="listening-pet-common.css" id="styleLink">
</head>

<body>
    <div class="test-wrapper" id="testWrapper">
        <!-- Header -->
        <div class="ielts-header">
            <div class="brand">
                <div class="ielts-logo">KET</div>
                <div class="candidate"></div>
                <div class="audio-controls">
                    <audio id="listeningAudio" controls>
                        <source src="audio/KET 4 - Test 1 Part 3.mp3" type="audio/mpeg">
                    </audio>
                    <select class="speed-select" id="speedSelect">
                        <option value="0.7">0.7x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1x</option>
                        <option value="1.1">1.1x</option>
                        <option value="1.25">1.25x</option>
                    </select>
                    <span class="volume-icon">🔊</span>
                </div>
            </div>
        </div>

        <!-- Question navigator -->
        <div class="question-nav">
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">
            <!-- Transcript panel -->
            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 11–15</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 3 &nbsp; Questions 11–15</h3>
                        <p><em>For each question, choose the correct answer.</em></p>
                        <p style="margin-bottom:8px;">You will hear Edward talking to his friend Michaela about dance
                            classes.</p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>
            <div class="explanation-header">
                <span id="explanationTitle">Giải thích</span>
                <span class="close-btn" id="closeExplanation">✕ Đóng</span>
            </div>
            <div class="explanation-content" id="explanationText"></div>
        </div>
    </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest1Part3Data = {
            title: "KET 4 · Test 1 · Listening Part 3",
            type: "multiple-choice",
            part: 3,
            book: 4,
            test: 1,

            answerKey: { q11: 'A', q12: 'B', q13: 'B', q14: 'A', q15: 'C' },
            displayAnswers: { q11: 'A', q12: 'B', q13: 'B', q14: 'A', q15: 'C' },

            detailedExplanations: {
                q11: `<strong>Đáp án: A – a college</strong><br>
                      Michaela hỏi: <em>"Do you go to the dance school for your dance classes?"</em><br>
                      Edward đáp: <em>"They're too expensive there. <span class='keyword-highlight'>My classes were at the sports centre last year, but they moved to the college.</span>"</em><br><br>
                      <strong>✗ B (a dance school) sai:</strong> Quá đắt, Edward không học ở đó.<br>
                      <strong>✗ C (a sports centre) sai:</strong> Đây là nơi học năm ngoái, không phải hiện tại.<br>
                      <strong>✓ A (a college) là đúng – Lớp học đã chuyển đến trường cao đẳng.</strong>`,

                q12: `<strong>Đáp án: B – four weeks ago</strong><br>
                      Edward hỏi: <em>"And how often do you have classes?"</em><br>
                      Michaela: <em>"Once a week, and it's an eight-week course."</em><br>
                      Edward: <em>"<span class='keyword-highlight'>You've been to four classes already, haven't you?</span>"</em><br>
                      Michaela: <em>"That's right."</em><br><br>
                      <strong>✗ A (one week ago) sai:</strong> Không đề cập.<br>
                      <strong>✗ C (eight weeks ago) sai:</strong> Khóa học kéo dài 8 tuần, nhưng cô ấy mới đi được 4 buổi.<br>
                      <strong>✓ B (four weeks ago) là đúng – Cô đã tham gia 4 buổi, tương đương 4 tuần trước.</strong>`,

                q13: `<strong>Đáp án: B – She gives students presents</strong><br>
                      Edward nói về giáo viên của mình: <em>"She quickly shows us what to do instead of explaining... She laughs when we make mistakes, but in a nice way! And, what's really nice, <span class='keyword-highlight'>if you do something well, you get a little packet of sweets.</span>"</em><br><br>
                      <strong>✗ A (She's very funny) sai:</strong> Cô ấy cười khi họ sai, nhưng không nói là hài hước.<br>
                      <strong>✗ C (She explains things clearly) sai:</strong> Cô ấy không giải thích mà chỉ hướng dẫn nhanh.<br>
                      <strong>✓ B (She gives students presents) là đúng – Cô tặng kẹo khi làm tốt.</strong>`,

                q14: `<strong>Đáp án: A – trousers and a shirt</strong><br>
                      Michaela nói: <em>"When I wore shorts and a T-shirt, they weren't warm enough, and trainers and a sweater aren't good for dancing in, so I just wear <span class='keyword-highlight'>comfortable trousers and a shirt</span>."</em><br><br>
                      <strong>✗ B (shorts and a T-shirt) sai:</strong> Không đủ ấm.<br>
                      <strong>✗ C (trainers and a sweater) sai:</strong> Không tốt cho khiêu vũ.<br>
                      <strong>✓ A (trousers and a shirt) là đúng – Cô mặc quần dài và áo sơ mi.</strong>`,

                q15: `<strong>Đáp án: C – meeting his friends</strong><br>
                      Michaela hỏi: <em>"Do you enjoy your classes?"</em><br>
                      Edward trả lời: <em>"Yes. Remembering the different dances isn't easy, but <span class='keyword-highlight'>I always have fun with my classmates.</span>"</em><br>
                      Anh cũng nói về âm nhạc: <em>"I wish I could choose the music – it's not very good!"</em><br><br>
                      <strong>✗ A (learning new dances) sai:</strong> Anh nói nhớ các điệu nhảy không dễ, không phải là điều anh thích nhất.<br>
                      <strong>✗ B (listening to the music) sai:</strong> Anh không thích nhạc ("it's not very good").<br>
                      <strong>✓ C (meeting his friends) là đúng – Anh vui với bạn cùng lớp.</strong>`
            },

            transcript: `
            <p><strong>PART 3</strong></p>
            <p><em>For each question, choose the correct answer.</em></p>
            <p>You will hear Edward talking to his friend Michaela about dance classes.</p>

            <p><strong>Michaela:</strong> Hi, Edward, do you go to the dance school for your dance classes?<br>
            <strong>Edward:</strong> Hi, Michaela. <span class="highlightable" data-q="11">They're too expensive there. My classes were at the sports centre last year, but they moved to the college.</span></p>

            <p><strong>Michaela:</strong> Oh, OK.<br>
            <strong>Edward:</strong> And how often do you have classes?<br>
            <strong>Michaela:</strong> Once a week, and it's an eight-week course.<br>
            <strong>Edward:</strong> <span class="highlightable" data-q="12">You've been to four classes already, haven't you?</span><br>
            <strong>Michaela:</strong> That's right. Is your teacher good?<br>
            <strong>Edward:</strong> She quickly shows us what to do instead of explaining, which is OK most of the time. She laughs when we make mistakes, but in a nice way! And, what's really nice, <span class="highlightable" data-q="13">if you do something well, you get a little packet of sweets.</span></p>

            <p><strong>Michaela:</strong> Oh, nice!<br>
            <strong>Edward:</strong> What do you wear for your classes?<br>
            <strong>Michaela:</strong> When I wore shorts and a T-shirt, they weren't warm enough, and trainers and a sweater aren't good for dancing in, so <span class="highlightable" data-q="14">I just wear comfortable trousers and a shirt.</span></p>

            <p><strong>Edward:</strong> Me too.<br>
            <strong>Michaela:</strong> Do you enjoy your classes?<br>
            <strong>Edward:</strong> Yes. Remembering the different dances isn't easy, but <span class="highlightable" data-q="15">I always have fun with my classmates.</span> I wish I could choose the music – it's not very good!</p>

            <p><em>That is the end of Part Three.</em></p>
            `,

            questions: [
                { num: 11, text: "Where does Edward go for his dance classes?", options: ["a college", "a dance school", "a sports centre"] },
                { num: 12, text: "Michaela started going to classes", options: ["one week ago.", "four weeks ago.", "eight weeks ago."] },
                { num: 13, text: "Why does Edward like his teacher?", options: ["She's very funny.", "She gives students presents.", "She explains things clearly."] },
                { num: 14, text: "What does Michaela wear to her dance classes?", options: ["trousers and a shirt", "shorts and a T-shirt", "trainers and a sweater"] },
                { num: 15, text: "What does Edward enjoy most about the classes?", options: ["learning new dances", "listening to the music", "meeting his friends"] }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest1Part3Data);
            console.log('KET 4 Test 1 Listening Part 3 loaded');
        });
    </script>
