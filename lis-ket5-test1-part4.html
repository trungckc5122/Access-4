<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KET 5 - Test 1 - Listening Part 4</title>
    <link rel="stylesheet" href="listening-pet-common.css" id="styleLink">
</head>

<body>
    <div class="test-wrapper" id="testWrapper">
        <!-- Header -->
        <div class="ielts-header">
            <div class="brand">
                <div class="ielts-logo">KET</div>
                <div class="candidate"></div>
                <div class="audio-controls">
                    <audio id="listeningAudio" controls>
                        <source src="audio/KET 5 - Test 1 Part 4.mp3" type="audio/mpeg">
                    </audio>
                    <select class="speed-select" id="speedSelect">
                        <option value="0.7">0.7x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1x</option>
                        <option value="1.1">1.1x</option>
                        <option value="1.25">1.25x</option>
                    </select>
                    <span class="volume-icon">🔊</span>
                </div>
            </div>
        </div>

        <!-- Question navigator -->
        <div class="question-nav">
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">
            <!-- Transcript panel -->
            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 16–20</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 4 &nbsp; Questions 16–20</h3>
                        <p><em>For each question, choose the correct answer.</em></p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>
            <div class="explanation-header">
                <span id="explanationTitle">Giải thích</span>
                <span class="close-btn" id="closeExplanation">✕ Đóng</span>
            </div>
            <div class="explanation-content" id="explanationText"></div>
        </div>
    </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest1Part4Data = {
            title: "KET 5 · Test 1 · Listening Part 4",
            type: "multiple-choice",
            part: 4,
            book: 5,
            test: 1,

            answerKey: { q16: 'B', q17: 'B', q18: 'C', q19: 'A', q20: 'B' },
            displayAnswers: { q16: 'B', q17: 'B', q18: 'C', q19: 'A', q20: 'B' },

            detailedExplanations: {
                q16: `<strong>Đáp án: B – get her something to drink</strong><br>
                      Cô gái nói: <em>"I'd love <span class='keyword-highlight'>some juice</span> if you're not doing anything..."</em><br>
                      Cậu bé đáp: <em>"OK, hold on a moment."</em><br><br>
                      <strong>✗ A (make a phone call) sai:</strong> Chính cô gái lấy điện thoại để kiểm tra chính tả.<br>
                      <strong>✗ C (help with homework) sai:</strong> Cậu đề nghị giúp nhưng cô từ chối ("Thanks, but it's not hard").<br>
                      <strong>✓ B (get her something to drink) là đúng – Cô nhờ cậu lấy nước cam.</strong>`,

                q17: `<strong>Đáp án: B – work more quickly</strong><br>
                      Giáo viên nói: <em>"sometimes <span class='keyword-highlight'>it takes you a bit too long to finish an exercise.</span>"</em><br>
                      Cô gái đáp: <em>"OK, I'll try to do something about that."</em><br><br>
                      <strong>✗ A (always complete homework) sai:</strong> Bài tập về nhà luôn nộp đúng hạn – đây là điểm khen.<br>
                      <strong>✗ C (say more in class) sai:</strong> Cô luôn nói điều thú vị – cũng là điểm khen.<br>
                      <strong>✓ B (work more quickly) là đúng – Cần làm bài nhanh hơn.</strong>`,

                q18: `<strong>Đáp án: C – for the price</strong><br>
                      Cô gái nói: <em>"It was the only one left and <span class='keyword-highlight'>the discount was great.</span>"</em><br><br>
                      <strong>✗ A (colour) sai:</strong> Cô nói "I wasn't sure about getting a green one" – màu không phải lý do chọn.<br>
                      <strong>✗ B (size) sai:</strong> Cô nói "it's slightly too small for my books" – kích cỡ là nhược điểm.<br>
                      <strong>✓ C (price) là đúng – Giảm giá tốt là lý do mua.</strong>`,

                q19: `<strong>Đáp án: A – It isn't big enough.</strong><br>
                      Cô gái nói: <em>"<span class='keyword-highlight'>I've grown since I got it.</span> Soon it'll look as if I've borrowed it from my little sister!"</em><br><br>
                      <strong>✗ B (not enough pockets) sai:</strong> Mẹ hỏi về túi nhỏ nhưng cô không đề cập đó là lý do.<br>
                      <strong>✗ C (colour) sai:</strong> Cô nói "I do" (like the colour) và muốn mua áo mới cùng màu.<br>
                      <strong>✓ A (isn't big enough) là đúng – Cô đã lớn hơn kể từ khi mua, áo trở nên chật.</strong>`,

                q20: `<strong>Đáp án: B – drawing a map</strong><br>
                      Cậu bé nói: <em>"<span class='keyword-highlight'>I drew a map</span> and the others looked online for information. It was fun and I felt really proud because what I did looked great."</em><br><br>
                      <strong>✗ A (watching a video) sai:</strong> Cậu nói "That was OK" – chỉ ở mức bình thường.<br>
                      <strong>✗ C (using the internet) sai:</strong> Những học sinh khác dùng internet, không phải cậu bé.<br>
                      <strong>✓ B (drawing a map) là đúng – Cậu vẽ bản đồ và cảm thấy tự hào về kết quả.</strong>`
            },

            transcript: `
            <p><strong>PART 4</strong></p>
            <p><em>For each question, choose the correct answer.</em></p>

            <p><strong>Question 16</strong><br>
            You will hear a brother and sister talking. What does the girl want the boy to do?<br>
            <strong>Boy:</strong> I'm hungry. Shall we ask Mum if we can have a pizza?<br>
            <strong>Girl:</strong> OK, I've just got to finish my homework first.<br>
            <strong>Boy:</strong> Do you want help with it? I'm good at history.<br>
            <strong>Girl:</strong> Thanks, but it's not hard. Pass me my phone. I'll check my spelling, then I'll be ready. <span class="highlightable" data-q="16">I'd love some juice if you're not doing anything...</span><br>
            <strong>Boy:</strong> OK, hold on a moment.<br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 17</strong><br>
            You will hear a girl talking to her teacher. What should the girl try to do in the future?<br>
            <strong>Girl:</strong> What do I need to get better at next term, Mr Howard?<br>
            <strong>Man:</strong> You've worked very hard this term, Mary. Your homework's always been done on time.<br>
            <strong>Girl:</strong> Thank you.<br>
            <strong>Man:</strong> And you always say something interesting when we're discussing things. But... <span class="highlightable" data-q="17">sometimes it takes you a bit too long to finish an exercise.</span><br>
            <strong>Girl:</strong> OK, I'll try to do something about that.<br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 18</strong><br>
            You will hear a girl talking about her new bag. Why did she choose this bag?<br>
            <strong>Boy:</strong> Is that a new bag?<br>
            <strong>Girl:</strong> Yes, do you like it? I wasn't sure about getting a green one.<br>
            <strong>Boy:</strong> So, why did you get it?<br>
            <strong>Girl:</strong> <span class="highlightable" data-q="18">It was the only one left and the discount was great.</span> The colour's not too bad, is it? Unfortunately, it's slightly too small for my books. Maybe it'll be OK for my swimming kit though.<br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 19</strong><br>
            You will hear a girl talking to her mother. Why does the girl want to give her jacket to her cousin?<br>
            <strong>Girl:</strong> Can I give my blue jacket to my cousin?<br>
            <strong>Mum:</strong> The one with the tiny pockets?<br>
            <strong>Girl:</strong> That's right, <span class="highlightable" data-q="19">I've grown since I got it.</span> Soon it'll look as if I've borrowed it from my little sister!<br>
            <strong>Mum:</strong> Don't you like the colour?<br>
            <strong>Girl:</strong> I do. But I'd like to get a new one, probably the same colour though.<br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 20</strong><br>
            You will hear a boy telling his mother about a geography lesson. What did he enjoy most about the lesson?<br>
            <strong>Girl:</strong> How was geography today, Nick?<br>
            <strong>Boy:</strong> Good. We watched a video about deserts. That was OK. Then we worked in groups to find out all we could about one particular desert. Ours was the Sahara. <span class="highlightable" data-q="20">I drew a map</span> and the others looked online for information. It was fun and I felt really proud because what I did looked great.<br>
            <em>Now listen again. [repeat]</em></p>

            <p><em>That is the end of Part Four.</em></p>
            `,

            questions: [
                { num: 16, text: "You will hear a brother and sister talking. What does the girl want the boy to do?", options: ["make a phone call", "get her something to drink", "help her with her homework"] },
                { num: 17, text: "You will hear a girl talking to her teacher. What should the girl try to do in the future?", options: ["always complete her homework", "work more quickly", "say more in class"] },
                { num: 18, text: "You will hear a girl talking about her new bag. Why did she choose this bag?", options: ["for the colour", "for the size", "for the price"] },
                { num: 19, text: "You will hear a girl talking to her mother. Why does the girl want to give her jacket to her cousin?", options: ["It isn't big enough.", "There aren't enough pockets.", "She doesn't like the colour."] },
                { num: 20, text: "You will hear a boy telling his mother about a geography lesson. What did he enjoy most about the lesson?", options: ["watching a video", "drawing a map", "using the internet"] }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest1Part4Data);
            console.log('KET 5 Test 1 Listening Part 4 loaded');
        });
    </script>
</body>

</html>
