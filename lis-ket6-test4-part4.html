<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KET 6 - Test 4 - Listening Part 4</title>
    <link rel="stylesheet" href="listening-pet-common.css" id="styleLink">
</head>

<body>
    <div class="test-wrapper" id="testWrapper">
        <!-- Header -->
        <div class="ielts-header">
            <div class="brand">
                <div class="ielts-logo">KET</div>
                <div class="candidate"></div>
                <div class="audio-controls">
                    <audio id="listeningAudio" controls>
                        <source src="audio/KET 6 - Test 4 Part 4.mp3" type="audio/mpeg">
                    </audio>
                    <select class="speed-select" id="speedSelect">
                        <option value="0.7">0.7x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1x</option>
                        <option value="1.1">1.1x</option>
                        <option value="1.25">1.25x</option>
                    </select>
                    <span class="volume-icon">🔊</span>
                </div>
            </div>
        </div>

        <!-- Question navigator -->
        <div class="question-nav">
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">
            <!-- Transcript panel -->
            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 16–20</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 4 &nbsp; Questions 16–20</h3>
                        <p><em>For each question, choose the correct answer.</em></p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>
            <div class="explanation-header">
                <span id="explanationTitle">Giải thích</span>
                <span class="close-btn" id="closeExplanation">✕ Đóng</span>
            </div>
            <div class="explanation-content" id="explanationText"></div>
        </div>
    </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest4Part4Data = {
            title: "KET 6 · Test 4 · Listening Part 4",
            type: "multiple-choice",
            part: 4,
            book: 6,
            test: 4,

            answerKey: { q16: 'B', q17: 'C', q18: 'B', q19: 'A', q20: 'A' },
            displayAnswers: { q16: 'B', q17: 'C', q18: 'B', q19: 'A', q20: 'A' },

            detailedExplanations: {
                q16: `<strong>Đáp án: B – by train (bằng tàu điện ngầm)</strong><br>
                      Cậu bé hỏi: <em>"Did your dad bring you by car?"</em><br>
                      Cô gái đáp: <em>"<span class='keyword-highlight'>there were no problems on the underground! I was lucky.</span>"</em><br>
                      Cô gái đi bằng tàu điện ngầm (underground = metro/train) và may mắn không gặp sự cố.<br><br>
                      <strong>✗ A (by car) sai:</strong> Cậu bé hỏi cô có đi ô tô không nhưng cô trả lời bằng underground.<br>
                      <strong>✗ C (on foot) sai:</strong> Cậu bé nghĩ đến việc đi bộ, không phải cô gái. Cô gái nói cô sống khá xa ("I live quite far away").<br>
                      <strong>✓ B (by train) là đáp án chính xác.</strong>`,

                q17: `<strong>Đáp án: C – her folder</strong><br>
                      Cô gái nói: <em>"I left all my school papers somewhere in a blue plastic … sort of box. And I can't find them."</em><br>
                      Cô đang tìm hộp nhựa xanh đựng giấy tờ học → đó là folder (bìa/hộp đựng tài liệu).<br>
                      Và ngay sau đó cô nhận ra: <em>"<span class='keyword-highlight'>Ah, that's where it is!</span>"</em> khi đến phòng cloakroom.<br><br>
                      <strong>✗ A (her bag) sai:</strong> Cô gái có mang ba lô ("Please, don't carry your backpack round the museum") – túi không phải thứ bị mất.<br>
                      <strong>✗ B (her coat) sai:</strong> Cô gái đến phòng có "jackets and things" nhưng đó là nơi cô tìm thấy folder, không phải cô tìm áo khoác.<br>
                      <strong>✓ C (her folder) là đáp án chính xác.</strong>`,

                q18: `<strong>Đáp án: B – by watching French cartoons</strong><br>
                      Cậu bé nói: <em>"My teacher asked our class to write to children in a French school, but after a couple of weeks everyone gave up! That didn't work, but <span class='keyword-highlight'>finding funny films in French did. I like ones with talking animals!</span>"</em><br>
                      Xem phim hoạt hình vui nhộn bằng tiếng Pháp giúp cậu cải thiện được tiếng Pháp.<br><br>
                      <strong>✗ A (visiting France) sai:</strong> Chuyến đi Pháp khiến cậu nhận ra mình kém tiếng Pháp ("I realised I could hardly say a word"), không phải là cách cậu cải thiện.<br>
                      <strong>✗ C (emailing his French penpal) sai:</strong> Việc viết thư cho bạn bút (write to children in a French school) không hiệu quả ("everyone gave up", "That didn't work").<br>
                      <strong>✓ B (watching French cartoons) là đáp án chính xác.</strong>`,

                q19: `<strong>Đáp án: A – looking after animals</strong><br>
                      Tanya nói: <em>"<span class='keyword-highlight'>Whenever I have free time, I go to the riding school and I brush and feed the horses.</span>"</em><br>
                      Hiện tại Tanya thích chăm sóc ngựa tại trường cưỡi ngựa.<br><br>
                      <strong>✗ B (taking photos of animals) sai:</strong> Đó là sở thích Tanya dự định làm trong tương lai ("For my birthday, Dad's giving me a camera. Then, I can go to the zoo and start getting some amazing pictures") — chưa làm hiện tại.<br>
                      <strong>✗ C (collecting toy animals) sai:</strong> Tanya đã cho bộ sưu tập khủng long nhựa đi rồi ("I gave them to the little boy next door").<br>
                      <strong>✓ A (looking after animals) là đáp án chính xác.</strong>`,

                q20: `<strong>Đáp án: A – a cafeteria</strong><br>
                      Hiệu trưởng nói: <em>"<span class='keyword-highlight'>you've never had somewhere nice to buy and eat lunch, but all that's changed. After this meeting, go and look next to the library!</span>"</em><br>
                      Căng-tin mới (cafeteria) là điều mới của trường năm nay.<br><br>
                      <strong>✗ B (a sports hall) sai:</strong> Đội bóng chuyền thắng giải được đề cập nhưng không có phòng thể thao mới nào.<br>
                      <strong>✗ C (a music room) sai:</strong> Hiệu trưởng nói về việc mượn nhạc cụ ("borrow a guitar, violin") nhưng không đề cập phòng âm nhạc mới.<br>
                      <strong>✓ A (a cafeteria) là đáp án chính xác.</strong>`
            },

            transcript: `
            <p><strong>PART 4</strong></p>
            <p><em>For each question, choose the correct answer.</em></p>

            <p><strong>Question 16</strong><br>
            You will hear two classmates talking together. How did the girl come to school today?<br>
            <strong>Boy:</strong> You're at school early today! Did your dad bring you by car?<br>
            <strong>Girl:</strong> Actually, <span class="highlightable" data-q="16">there were no problems on the underground! I was lucky.</span><br>
            <strong>Boy:</strong> But was your platform crowded? Mine was. I even thought about walking to school instead.<br>
            <strong>Girl:</strong> Not really. And the seven forty-five was on time. Walking's good if you want to be healthy, but I live quite far away.<br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 17</strong><br>
            You will hear a girl talking to a man who works at a museum. What's the girl looking for?<br>
            <strong>Man:</strong> Please, don't carry your backpack round the museum.<br>
            <strong>Girl:</strong> Oh, sorry. Err, <span class="highlightable" data-q="17">I left all my school papers somewhere in a blue plastic … sort of box. And I can't find them.</span><br>
            <strong>Man:</strong> Which rooms have you been in?<br>
            <strong>Girl:</strong> Well, first, I went to that one by the entrance where all the jackets and things are … <span class="highlightable" data-q="17">Ah, that's where it is!</span><br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 18</strong><br>
            You will hear a boy talking about learning French. How did he improve his French?<br>
            <strong>Boy:</strong> When I was on the school trip to France, I realised I could hardly say a word! My teacher asked our class to write to children in a French school, but after a couple of weeks everyone gave up! That didn't work, but <span class="highlightable" data-q="18">finding funny films in French did. I like ones with talking animals!</span><br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 19</strong><br>
            You will hear a girl talking to her aunt about her hobbies. Which hobby does the girl like doing now?<br>
            <strong>Freya:</strong> Where are all those plastic dinosaurs you used to have?<br>
            <strong>Tanya:</strong> I gave them to the little boy next door. <span class="highlightable" data-q="19">Whenever I have free time, I go to the riding school and I brush and feed the horses.</span> For my birthday, Dad's giving me a camera. Then, I can go to the zoo and start getting some amazing pictures.<br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 20</strong><br>
            You will hear a headteacher talking to the whole school. What's new at the school this year?<br>
            <strong>Man:</strong> First, let me say how pleased I am that the volleyball team won the summer championships! Second, <span class="highlightable" data-q="20">you've never had somewhere nice to buy and eat lunch, but all that's changed. After this meeting, go and look next to the library!</span> Next, if you want to borrow a guitar, violin, etc., you must see Mrs Howard before Friday.<br>
            <em>Now listen again. [repeat]</em></p>

            <p><em>That is the end of Part Four.</em></p>
            `,

            questions: [
                { num: 16, text: "You will hear two classmates talking together. How did the girl come to school today?", options: ["by car", "by train", "on foot"] },
                { num: 17, text: "You will hear a girl talking to a man who works at a museum. What's the girl looking for?", options: ["her bag", "her coat", "her folder"] },
                { num: 18, text: "You will hear a boy talking about learning French. How did he improve his French?", options: ["by visiting France", "by watching French cartoons", "by emailing his French penpal"] },
                { num: 19, text: "You will hear a girl talking to her aunt about her hobbies. Which hobby does the girl like doing now?", options: ["looking after animals", "taking photos of animals", "collecting toy animals"] },
                { num: 20, text: "You will hear a headteacher talking to the whole school. What's new at the school this year?", options: ["a cafeteria", "a sports hall", "a music room"] }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest4Part4Data);
            console.log('KET 6 Test 4 Listening Part 4 loaded');
        });
    </script>
</body>

</html>
