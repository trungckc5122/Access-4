<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KET 4 - Test 4 - Listening Part 1</title>
    <link rel="stylesheet" href="listening-pet-common.css" id="styleLink">
    <style>
        .question-item img {
            max-width: 760px !important;
            width: 100%;
            display: block;
        }

        .question-item .options {
            display: grid !important;
            grid-template-columns: 1fr 1fr 1fr;
            max-width: 760px;
            margin-top: 15px;
            gap: 15px;
        }

        .question-item .option {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            margin-bottom: 0 !important;
            padding: 10px 0 !important;
        }

        .question-item .option label {
            margin-left: 8px !important;
            flex: 0 1 auto !important;
            width: auto !important;
        }
    </style>
</head>

<body>
    <div class="test-wrapper" id="testWrapper">
        <!-- Header -->
        <div class="ielts-header">
            <div class="brand">
                <div class="ielts-logo">KET</div>
                <div class="candidate"></div>
                <div class="audio-controls">
                    <audio id="listeningAudio" controls>
                        <source src="audio/KET 4 - Test 4 Part 1.mp3" type="audio/mpeg">
                    </audio>
                    <select class="speed-select" id="speedSelect">
                        <option value="0.7">0.7x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1x</option>
                        <option value="1.1">1.1x</option>
                        <option value="1.25">1.25x</option>
                    </select>
                    <span class="volume-icon">🔊</span>
                </div>
            </div>
        </div>

        <!-- Question navigator -->
        <div class="question-nav">
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">
            <!-- Transcript panel -->
            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 1–5</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 1 &nbsp; Questions 1–5</h3>
                        <p><em>For each question, choose the correct answer.</em></p>
                        <p style="margin-bottom:8px;">Look at the pictures and choose the correct answer for each
                            question.</p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>
            <div class="explanation-header">
                <span id="explanationTitle">Giải thích</span>
                <span class="close-btn" id="closeExplanation">✕ Đóng</span>
            </div>
            <div class="explanation-content" id="explanationText"></div>
        </div>
    </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest4Part1Data = {
            title: "KET 4 · Test 4 · Listening Part 1",
            type: "multiple-choice",
            part: 1,
            book: 4,
            test: 4,

            answerKey: { q1: 'C', q2: 'B', q3: 'B', q4: 'A', q5: 'A' },
            displayAnswers: { q1: 'C', q2: 'B', q3: 'B', q4: 'A', q5: 'A' },

            detailedExplanations: {
                q1: `<strong>Đáp án: C – Cô gái tóc đen ngắn</strong><br>
                      Cậu bé nói: <em>"Do you mean the girl with long black hair? No – my sister's got black hair too, but it's a lot shorter than that."</em><br>
                      Em gái cậu bé đang đứng cạnh cô gái tóc vàng: <em>"Look – there's my sister! She's standing next to the girl with blonde hair."</em><br>
                      Vậy em gái có tóc đen ngắn, đứng cạnh bạn tóc vàng → đáp án C.<br><br>
                      <strong>✗ A (Tóc dài đen) sai:</strong> Cậu bé chỉ đó không phải em gái mình ("my sister's got black hair too, but it's a lot shorter").<br>
                      <strong>✗ B (Tóc vàng) sai:</strong> Đó là bạn thân của em gái ("That's her best friend, Elsie"), không phải em gái.<br>
                      <strong>✓ C là đáp án chính xác.</strong>`,

                q2: `<strong>Đáp án: B – Xe của mẹ cô ấy bị hỏng</strong><br>
                      Cô gái nói: <em>"Well, my mum was giving me a lift to school when the engine suddenly stopped. And it didn't start again!"</em><br>
                      Cô ấy không đến được buổi khiêu vũ vì xe mẹ bị hỏng.<br><br>
                      <strong>✗ A (Cô ấy phải học) sai:</strong> Cô ấy đã học rất chăm để có thể đi ("I worked really hard, because I wanted to go!").<br>
                      <strong>✗ C (Cô ấy cảm thấy mệt) sai:</strong> Không đề cập đến việc mệt mỏi.<br>
                      <strong>✓ B là đáp án chính xác.</strong>`,

                q3: `<strong>Đáp án: B – Đi ăn burger ở thị trấn</strong><br>
                      Cô gái nói: <em>"I know, but Suzy's mum's taking us for a burger in town and then she's giving us a lift to the cinema."</em><br>
                      Đầu tiên cô ấy sẽ đi ăn burger, sau đó đến rạp chiếu phim.<br><br>
                      <strong>✗ A (Đi xem phim trước) sai:</strong> Cô ấy sẽ ăn burger trước, rồi đến rạp sau.<br>
                      <strong>✗ C (Đi về nhà) sai:</strong> Cô ấy sẽ về nhà lúc 8:30 sau khi xem phim và bắt xe buýt về ("get the bus back").<br>
                      <strong>✓ B là đáp án chính xác.</strong>`,

                q4: `<strong>Đáp án: A – Chương trình làm bánh</strong><br>
                      Cậu bé đề xuất: <em>"Then how about that new one, where people have to bake cakes and stuff?"</em><br>
                      Cô gái đáp: <em>"Oh, that's an even better idea than watching the music channel."</em><br>
                      Vậy họ sẽ cùng xem chương trình làm bánh.<br><br>
                      <strong>✗ B (Chương trình về gấu) sai:</strong> Cô gái đã xem rồi ("I've already seen it").<br>
                      <strong>✗ C (Kênh nhạc) sai:</strong> Cô gái nói xem làm bánh hay hơn kênh nhạc ("even better idea than watching the music channel").<br>
                      <strong>✓ A là đáp án chính xác.</strong>`,

                q5: `<strong>Đáp án: A – Đi thu thập lá</strong><br>
                      Bố nói: <em>"... Tomorrow's the last day I'll be able to collect the different types of leaves for my biology homework."</em><br>
                      Cô gái sẽ đi thu thập lá cho bài tập sinh học vào ngày mai.<br><br>
                      <strong>✗ B (Đi xem phim) sai:</strong> Cô gái xin phép bố đi xem phim nhưng bố nhắc nhở cô cần làm bài tập sinh học.<br>
                      <strong>✗ C (Đến thư viện) sai:</strong> Cô ấy đã mượn sách từ thư viện để đọc về lá ("You borrowed some library books for a reason"), nhưng ngày mai cô ra ngoài thu thập mẫu lá.<br>
                      <strong>✓ A là đáp án chính xác.</strong>`
            },

            transcript: `
            <p><strong>PART 1</strong></p>
            <p><em>For each question, choose the correct answer.</em></p>

            <p><strong>Question 1</strong><br>
            <strong>Girl:</strong> Is that your sister over there?<br>
            <strong>Boy:</strong> Do you mean the girl with long black hair? No – <span class="highlightable" data-q="1">my sister's got black hair too, but it's a lot shorter than that.</span><br>
            <strong>Girl:</strong> Oh, right.<br>
            <strong>Boy:</strong> Look – <span class="highlightable" data-q="1">there's my sister! She's standing next to the girl with blonde hair. That's her best friend, Elsie.</span></p>

            <p><strong>Question 2</strong><br>
            <strong>Boy:</strong> I didn't see you at the school dance! Don't tell me you stayed home to study?<br>
            <strong>Girl:</strong> I worked really hard, because I wanted to go! Science was especially difficult – my brain was full of facts – it almost hurt.<br>
            <strong>Boy:</strong> So, then...?<br>
            <strong>Girl:</strong> Well, <span class="highlightable" data-q="2">my mum was giving me a lift to school when the engine suddenly stopped. And it didn't start again!</span></p>

            <p><strong>Question 3</strong><br>
            <strong>Girl:</strong> See you later, Dad!<br>
            <strong>Man:</strong> Oh, bye – are you going out now? The film doesn't start until six o'clock.<br>
            <strong>Girl:</strong> I know, but <span class="highlightable" data-q="3">Suzy's mum's taking us for a burger in town</span> and then she's giving us a lift to the cinema. We're going to get the bus back. I'll be home about half past eight, is that OK?<br>
            <strong>Man:</strong> Yes – have fun!</p>

            <p><strong>Question 4</strong><br>
            <strong>Boy:</strong> Let's watch the programme about the wild bears living in the forest.<br>
            <strong>Girl:</strong> I've already seen it – I loved the music to that show – when the bears are happy the music is too!<br>
            <strong>Boy:</strong> <span class="highlightable" data-q="4">Then how about that new one, where people have to bake cakes and stuff?</span> They're like amazing artists!<br>
            <strong>Girl:</strong> Oh, <span class="highlightable" data-q="4">that's an even better idea than watching the music channel.</span></p>

            <p><strong>Question 5</strong><br>
            <strong>Girl:</strong> Dad, can I go to the cinema tomorrow?<br>
            <strong>Man:</strong> Actually, you've got something more important to do than watch a film. You borrowed some library books for a reason.<br>
            <strong>Girl:</strong> Yeah, <span class="highlightable" data-q="5">tomorrow's the last day I'll be able to collect the different types of leaves for my biology homework.</span> At least I've read about them, and know what to look for.<br>
            <strong>Man:</strong> Good.</p>

            <p><em>That is the end of Part One.</em></p>
            `,

            questions: [
                { num: 1, text: "Who is the boy's sister?<br><img src='img-ket/ket 4-test 4-1.png' alt='Question 1' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 2, text: "Why didn't the girl go to the school dance?<br><img src='img-ket/ket 4-test 4-2.png' alt='Question 2' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 3, text: "Where's the girl going first?<br><img src='img-ket/ket 4-test 4-3.png' alt='Question 3' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 4, text: "Which programme will the two friends watch together?<br><img src='img-ket/ket 4-test 4-4.png' alt='Question 4' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] },
                { num: 5, text: "Where will the girl go tomorrow?<br><img src='img-ket/ket 4-test 4-5.png' alt='Question 5' style='max-width:100%; margin-top:15px; border-radius:8px;'>", options: ["", "", ""] }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest4Part1Data);
            console.log('KET 4 Test 4 Listening Part 1 loaded');
        });
    </script>
</body>

</html>
