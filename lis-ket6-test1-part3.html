<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KET 6 - Test 1 - Listening Part 3</title>
    <link rel="stylesheet" href="listening-pet-common.css" id="styleLink">
</head>

<body>
    <div class="test-wrapper" id="testWrapper">
        <!-- Header -->
        <div class="ielts-header">
            <div class="brand">
                <div class="ielts-logo">KET</div>
                <div class="candidate"></div>
                <div class="audio-controls">
                    <audio id="listeningAudio" controls>
                        <source src="audio/KET 6 - Test 1 Part 3.mp3" type="audio/mpeg">
                    </audio>
                    <select class="speed-select" id="speedSelect">
                        <option value="0.7">0.7x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1x</option>
                        <option value="1.1">1.1x</option>
                        <option value="1.25">1.25x</option>
                    </select>
                    <span class="volume-icon">🔊</span>
                </div>
            </div>
        </div>

        <!-- Question navigator -->
        <div class="question-nav">
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">
            <!-- Transcript panel -->
            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 11–15</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 3 &nbsp; Questions 11–15</h3>
                        <p><em>For each question, choose the correct answer.</em></p>
                        <p style="margin-bottom:8px;">You will hear Luis talking to his friend Charlotte about a computer game.</p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>
            <div class="explanation-header">
                <span id="explanationTitle">Giải thích</span>
                <span class="close-btn" id="closeExplanation">✕ Đóng</span>
            </div>
            <div class="explanation-content" id="explanationText"></div>
        </div>
    </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest1Part3Data = {
            title: "KET 6 · Test 1 · Listening Part 3",
            type: "multiple-choice",
            part: 3,
            book: 6,
            test: 1,

            answerKey: { q11: 'C', q12: 'B', q13: 'B', q14: 'A', q15: 'A' },
            displayAnswers: { q11: 'C', q12: 'B', q13: 'B', q14: 'A', q15: 'A' },

            detailedExplanations: {
                q11: `<strong>Đáp án: C – from a magazine advertisement</strong><br>
                      Luis nói: <em>"<span class='keyword-highlight'>I borrowed a magazine from a schoolfriend and there was an ad for it.</span>"</em><br><br>
                      <strong>✗ A (game website) sai:</strong> Mẹ Luis mua game từ website, nhưng Luis không tìm ra game từ website – đó là bước sau.<br>
                      <strong>✗ B (school friend) sai:</strong> Bạn cho mượn tạp chí, nhưng nguồn thông tin là quảng cáo trong tạp chí đó, không phải từ bạn trực tiếp.<br>
                      <strong>✓ C (magazine advertisement) là đúng – Luis biết đến game qua quảng cáo trong tạp chí.</strong>`,

                q12: `<strong>Đáp án: B – it's hard</strong><br>
                      Charlotte nói: <em>"it's my favourite game because <span class='keyword-highlight'>it isn't easy.</span>"</em><br><br>
                      <strong>✗ A (funny) sai:</strong> Charlotte nói rõ <em>"it's not funny at all"</em>.<br>
                      <strong>✗ C (new) sai:</strong> Charlotte nói <em>"It's not new"</em>.<br>
                      <strong>✓ B (hard) là đúng – Charlotte thích vì game không dễ (= khó = hard).</strong>`,

                q13: `<strong>Đáp án: B – his granddad</strong><br>
                      Luis nói: <em>"my brother's too busy studying, and my cousin Amy only likes board games. But <span class='keyword-highlight'>my granddad has lots of time, so I want to play with him.</span>"</em><br><br>
                      <strong>✗ A (brother) sai:</strong> Anh trai quá bận học.<br>
                      <strong>✗ C (cousin) sai:</strong> Bạn Amy chỉ thích board games.<br>
                      <strong>✓ B (granddad) là đúng – Ông có nhiều thời gian nên Luis chọn chơi cùng ông.</strong>`,

                q14: `<strong>Đáp án: A – forty-five minutes</strong><br>
                      Charlotte nói: <em>"on Saturday, <span class='keyword-highlight'>three quarters of an hour!</span>"</em><br>
                      Ba phần tư giờ = 45 phút.<br><br>
                      <strong>✗ B (one hour) sai:</strong> Đó là thời gian Charlotte chơi vào thứ Sáu.<br>
                      <strong>✗ C (one hour and thirty minutes) sai:</strong> Đó là thời gian Charlotte chơi vào thứ Tư khi bị ốm.<br>
                      <strong>✓ A (forty-five minutes) là đúng – Thứ Bảy Charlotte chơi 3/4 giờ = 45 phút.</strong>`,

                q15: `<strong>Đáp án: A – finding food</strong><br>
                      Luis nói: <em>"Crossing the river's really good, but <span class='keyword-highlight'>the bit I enjoy most is finding something to eat.</span> The part about building a hut's my least favourite."</em><br><br>
                      <strong>✗ B (building a hut) sai:</strong> Luis nói đây là phần anh thích ÍT NHẤT.<br>
                      <strong>✗ C (crossing the river) sai:</strong> Đây là phần "really good" nhưng không phải thích nhất.<br>
                      <strong>✓ A (finding food) là đúng – "finding something to eat" là phần Luis thích nhất.</strong>`
            },

            transcript: `
            <p><strong>PART 3</strong></p>
            <p><em>Now look at Part Three. For each question, choose the correct answer. Look at questions 11–15 now. You have 20 seconds.</em></p>
            <p>You will hear Luis talking to his friend Charlotte about a computer game.</p>

            <p><strong>Charlotte:</strong> Where did you find out about it, Luis?<br>
            <strong>Luis:</strong> <span class="highlightable" data-q="11">I borrowed a magazine from a schoolfriend and there was an ad for it.</span> I asked my mum and she bought it for me from their website.<br>
            <strong>Charlotte:</strong> I really like that game. It's not new, but it's my favourite game because <span class="highlightable" data-q="12">it isn't easy.</span> I play it a lot, which is strange because it's not funny at all!</p>

            <p><strong>Charlotte:</strong> Who are you going to play it with?<br>
            <strong>Luis:</strong> Well, my brother's too busy studying, and my cousin Amy only likes board games. But <span class="highlightable" data-q="13">my granddad has lots of time, so I want to play with him.</span></p>

            <p><strong>Luis:</strong> How long do you usually play it for?<br>
            <strong>Charlotte:</strong> When I was sick last Wednesday, I played for an hour and a half. Then, on Friday, an hour. And on Saturday, <span class="highlightable" data-q="14">three quarters of an hour!</span></p>

            <p><strong>Charlotte:</strong> Which part do you like best?<br>
            <strong>Luis:</strong> Crossing the river's really good, but <span class="highlightable" data-q="15">the bit I enjoy most is finding something to eat.</span> The part about building a hut's my least favourite.</p>

            <p><em>Now listen again. [repeat]</em></p>
            <p><em>That is the end of Part Three.</em></p>
            `,

            questions: [
                { num: 11, text: "Where did Luis first find out about the game?", options: ["from a game website", "from a school friend", "from a magazine advertisement"] },
                { num: 12, text: "Charlotte likes the game because", options: ["it's funny.", "it's hard.", "it's new."] },
                { num: 13, text: "Who does Luis want to play the game with?", options: ["his brother", "his granddad", "his cousin"] },
                { num: 14, text: "How long did Charlotte play the game for last Saturday?", options: ["forty-five minutes", "one hour", "one hour and thirty minutes"] },
                { num: 15, text: "Which part of the game does Luis like best?", options: ["finding food", "building a hut", "crossing the river"] }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest1Part3Data);
            console.log('KET 6 Test 1 Listening Part 3 loaded');
        });
    </script>
</body>

</html>
