<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KET 6 - Test 3 - Listening Part 3</title>
    <link rel="stylesheet" href="listening-pet-common.css" id="styleLink">
</head>

<body>
    <div class="test-wrapper" id="testWrapper">
        <!-- Header -->
        <div class="ielts-header">
            <div class="brand">
                <div class="ielts-logo">KET</div>
                <div class="candidate"></div>
                <div class="audio-controls">
                    <audio id="listeningAudio" controls>
                        <source src="audio/KET 6 - Test 3 Part 3.mp3" type="audio/mpeg">
                    </audio>
                    <select class="speed-select" id="speedSelect">
                        <option value="0.7">0.7x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1x</option>
                        <option value="1.1">1.1x</option>
                        <option value="1.25">1.25x</option>
                    </select>
                    <span class="volume-icon">🔊</span>
                </div>
            </div>
        </div>

        <!-- Question navigator -->
        <div class="question-nav">
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">
            <!-- Transcript panel -->
            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 11–15</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 3 &nbsp; Questions 11–15</h3>
                        <p><em>For each question, choose the correct answer.</em></p>
                        <p style="margin-bottom:8px;">You will hear Hitomi talking to her friend Freddie about her visit to Hardin Castle.</p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>
            <div class="explanation-header">
                <span id="explanationTitle">Giải thích</span>
                <span class="close-btn" id="closeExplanation">✕ Đóng</span>
            </div>
            <div class="explanation-content" id="explanationText"></div>
        </div>
    </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest3Part3Data = {
            title: "KET 6 · Test 3 · Listening Part 3",
            type: "multiple-choice",
            part: 3,
            book: 6,
            test: 3,

            answerKey: { q11: 'C', q12: 'B', q13: 'A', q14: 'C', q15: 'B' },
            displayAnswers: { q11: 'C', q12: 'B', q13: 'A', q14: 'C', q15: 'B' },

            detailedExplanations: {
                q11: `<strong>Đáp án: C – her neighbours</strong><br>
                      Freddie hỏi đi cùng gia đình hay cả lớp, Hitomi trả lời: <em>"My class visited a factory. <span class='keyword-highlight'>I went with the family who live next door to us.</span>"</em><br>
                      Cả lớp đi thăm nhà máy, còn Hitomi đi cùng gia đình hàng xóm (neighbours).<br><br>
                      <strong>✗ A (her classmates) sai:</strong> Cả lớp đến nhà máy, không phải lâu đài.<br>
                      <strong>✗ B (her family) sai:</strong> Hitomi đi với gia đình hàng xóm, không phải gia đình mình.<br>
                      <strong>✓ C (her neighbours) là đáp án chính xác.</strong>`,

                q12: `<strong>Đáp án: B – wet</strong><br>
                      Hitomi nói: <em>"<span class='keyword-highlight'>Yeah, it rained, but I didn't mind.</span> It wasn't cold and windy like today."</em><br>
                      Trời mưa (wet) nhưng Hitomi không bận tâm vì không lạnh và không có gió.<br><br>
                      <strong>✗ A (cold) sai:</strong> Hitomi nói rõ "It wasn't cold".<br>
                      <strong>✗ C (windy) sai:</strong> Hitomi nói "It wasn't … windy like today" – ngày đó không có gió.<br>
                      <strong>✓ B (wet) là đáp án chính xác.</strong>`,

                q13: `<strong>Đáp án: A – the Queen's bathroom</strong><br>
                      Freddie nói: <em>"I saw the dining room … but <span class='keyword-highlight'>I liked upstairs better, especially the Queen's bathroom.</span>"</em><br>
                      Hitomi đáp: <em>"Me too!"</em> – cả hai đều thích phòng tắm của Nữ hoàng nhất.<br><br>
                      <strong>✗ B (the yellow bedroom) sai:</strong> Hitomi nói phòng ngủ vàng "was strange" – kỳ lạ, không phải thích nhất.<br>
                      <strong>✗ C (the dining room) sai:</strong> Freddie đề cập phòng ăn nhưng nói thích tầng trên hơn.<br>
                      <strong>✓ A (the Queen's bathroom) là đáp án chính xác.</strong>`,

                q14: `<strong>Đáp án: C – to find out about birds</strong><br>
                      Freddie trả lời: <em>"<span class='keyword-highlight'>To get some information about wild birds.</span>"</em><br>
                      Mục đích đến lâu đài là tìm hiểu về chim hoang dã.<br><br>
                      <strong>✗ A (to learn about history) sai:</strong> Freddie gặp thầy giáo lịch sử ở đó nhưng đó không phải lý do đến.<br>
                      <strong>✗ B (to take photos) sai:</strong> Hitomi đoán vì chụp ảnh là sở thích của Freddie, nhưng Freddie phủ nhận ngầm bằng cách nêu lý do thực sự.<br>
                      <strong>✓ C (to find out about birds) là đáp án chính xác.</strong>`,

                q15: `<strong>Đáp án: B – an exhibition of old cars</strong><br>
                      Freddie nói: <em>"next month, <span class='keyword-highlight'>you can see some cars that are over fifty years old!</span>"</em><br>
                      Tháng tới có triển lãm xe hơi cổ (hơn 50 năm tuổi).<br><br>
                      <strong>✗ A (a running race) sai:</strong> Cuộc đua 5km là tuần tới ("Next week"), không phải tháng tới.<br>
                      <strong>✗ C (a painting course) sai:</strong> Khóa vẽ sẽ tổ chức vào mùa hè tới ("next summer"), không phải tháng tới.<br>
                      <strong>✓ B (an exhibition of old cars) là đáp án chính xác.</strong>`
            },

            transcript: `
            <p><strong>PART 3</strong></p>
            <p><em>For each question, choose the correct answer.</em></p>
            <p>You will hear Hitomi talking to her friend Freddie about her visit to Hardin Castle.</p>

            <p><strong>Hitomi:</strong> Hi, Freddie. I went to Hardin Castle on Saturday.<br>
            <strong>Freddie:</strong> Did you go with your family or was it a class trip, Hitomi?<br>
            <strong>Hitomi:</strong> My class visited a factory. <span class="highlightable" data-q="11">I went with the family who live next door to us.</span></p>

            <p><strong>Freddie:</strong> But the weather wasn't good on Saturday …<br>
            <strong>Hitomi:</strong> <span class="highlightable" data-q="12">Yeah, it rained, but I didn't mind.</span> It wasn't cold and windy like today. Today's worse!</p>

            <p><strong>Freddie:</strong> I went to Hardin Castle last year. I saw the dining room … but <span class="highlightable" data-q="13">I liked upstairs better, especially the Queen's bathroom.</span><br>
            <strong>Hitomi:</strong> Me too! I thought the yellow bedroom was strange.</p>

            <p><strong>Hitomi:</strong> Why did you go to the castle? Was it to take photos? I know that's your hobby.<br>
            <strong>Freddie:</strong> <span class="highlightable" data-q="14">To get some information about wild birds.</span> And I saw my history teacher when I was there!<br>
            <strong>Hitomi:</strong> Did you talk to him?<br>
            <strong>Freddie:</strong> Yes.</p>

            <p><strong>Freddie:</strong> There are lots of interesting things to do at the castle. Next week, there's a race. You have to run five kilometres. Then, <span class="highlightable" data-q="15">next month, you can see some cars that are over fifty years old!</span><br>
            <strong>Hitomi:</strong> Do they do painting courses?<br>
            <strong>Freddie:</strong> The next one's next summer!</p>

            <p><em>That is the end of Part Three.</em></p>
            `,

            questions: [
                {
                    num: 11,
                    text: "Who did Hitomi go to Hardin Castle with?",
                    options: ["her classmates", "her family", "her neighbours"]
                },
                {
                    num: 12,
                    text: "What was the weather like?",
                    options: ["cold", "wet", "windy"]
                },
                {
                    num: 13,
                    text: "What do Hitomi and Freddie both like best at Hardin Castle?",
                    options: ["the Queen's bathroom", "the yellow bedroom", "the dining room"]
                },
                {
                    num: 14,
                    text: "Freddie went to the castle because he wanted",
                    options: ["to learn about history.", "to take photos.", "to find out about birds."]
                },
                {
                    num: 15,
                    text: "What's on at the castle next month?",
                    options: ["a running race", "an exhibition of old cars", "a painting course"]
                }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest3Part3Data);
            console.log('KET 6 Test 3 Listening Part 3 loaded');
        });
    </script>
</body>

</html>
