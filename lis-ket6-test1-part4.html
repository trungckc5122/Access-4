<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KET 6 - Test 1 - Listening Part 4</title>
    <link rel="stylesheet" href="listening-pet-common.css" id="styleLink">
</head>

<body>
    <div class="test-wrapper" id="testWrapper">
        <!-- Header -->
        <div class="ielts-header">
            <div class="brand">
                <div class="ielts-logo">KET</div>
                <div class="candidate"></div>
                <div class="audio-controls">
                    <audio id="listeningAudio" controls>
                        <source src="audio/KET 6 - Test 1 Part 4.mp3" type="audio/mpeg">
                    </audio>
                    <select class="speed-select" id="speedSelect">
                        <option value="0.7">0.7x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1x</option>
                        <option value="1.1">1.1x</option>
                        <option value="1.25">1.25x</option>
                    </select>
                    <span class="volume-icon">🔊</span>
                </div>
            </div>
        </div>

        <!-- Question navigator -->
        <div class="question-nav">
            <div class="nav-buttons" id="navButtons"></div>
        </div>

        <!-- Main area -->
        <div class="main-area" id="mainArea">
            <!-- Transcript panel -->
            <div class="transcript-panel" id="transcriptPanel">
                <div class="panel-header"><span>TRANSCRIPT</span></div>
                <div class="transcript-content font-large" id="transcriptContent"></div>
            </div>
            <div class="resizer" id="resizer"></div>

            <!-- Questions panel -->
            <div class="questions-panel" id="questionsPanel">
                <div class="panel-header">
                    <span>QUESTIONS 16–20</span>
                    <span class="answer-badge" id="answeredCount">0/5 answered</span>
                </div>
                <div class="questions-list font-large centered" id="questionsContent">
                    <div>
                        <h3>PART 4 &nbsp; Questions 16–20</h3>
                        <p><em>For each question, choose the correct answer.</em></p>
                        <div class="notes-box" id="questionsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="btn btn-primary" id="submitBtn">Nộp bài</button>
            <button class="btn btn-success" id="explainBtn" disabled>Xem giải thích</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
            <div class="progress" id="progressDisplay">Đã làm: 0/5</div>
        </div>

        <!-- Explanation panel -->
        <div class="explanation-panel" id="explanationPanel">
            <div class="resize-handle" id="explanationResizer"></div>
            <div class="explanation-header">
                <span id="explanationTitle">Giải thích</span>
                <span class="close-btn" id="closeExplanation">✕ Đóng</span>
            </div>
            <div class="explanation-content" id="explanationText"></div>
        </div>
    </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div onclick="applyHighlight('yellow')">Highlight vàng</div>
        <div onclick="applyHighlight('green')">Highlight xanh lá</div>
        <div onclick="applyHighlight('pink')">Highlight hồng</div>
        <div onclick="removeHighlight()">Xóa highlight</div>
    </div>

    <script src="core-listening-ket.js"></script>
    <script>
        const ketTest1Part4Data = {
            title: "KET 6 · Test 1 · Listening Part 4",
            type: "multiple-choice",
            part: 4,
            book: 6,
            test: 1,

            answerKey: { q16: 'A', q17: 'C', q18: 'B', q19: 'C', q20: 'A' },
            displayAnswers: { q16: 'A', q17: 'C', q18: 'B', q19: 'C', q20: 'A' },

            detailedExplanations: {
                q16: `<strong>Đáp án: A – something to wear</strong><br>
                      Cậu bé nói: <em>"<span class='keyword-highlight'>Everyone thinks the gloves I got yesterday are cool, too.</span>"</em><br><br>
                      <strong>✗ B (something to eat) sai:</strong> Đồ ăn nhẹ là thứ họ định mua bây giờ, không phải hôm qua.<br>
                      <strong>✗ C (something to read) sai:</strong> Đó là cuốn sách cô gái mua hôm qua, không phải cậu bé (mẹ đã mua sách và tạp chí cho cậu trước đó).<br>
                      <strong>✓ A (something to wear) là đúng – Cậu bé mua găng tay (gloves) hôm qua.</strong>`,

                q17: `<strong>Đáp án: C – She arrived back late from holiday</strong><br>
                      Lyn nói: <em>"I wasn't ill. We were camping in Switzerland for a week and <span class='keyword-highlight'>our flight was cancelled on Sunday. We flew on Monday instead.</span>"</em><br><br>
                      <strong>✗ A (sick) sai:</strong> Thầy Jones hỏi có phải bệnh không nhưng Lyn phủ nhận.<br>
                      <strong>✗ B (competition) sai:</strong> Trận tennis là vào thứ Bảy tới, không liên quan đến việc vắng học.<br>
                      <strong>✓ C (arrived back late from holiday) là đúng – Chuyến bay bị hủy, phải bay về muộn hơn dự định.</strong>`,

                q18: `<strong>Đáp án: B – by watching videos</strong><br>
                      Cậu bé nói: <em>"I found a website with a famous surfer <span class='keyword-highlight'>showing people the best way to learn. That's what helped me.</span>"</em><br><br>
                      <strong>✗ A (course) sai:</strong> Cậu thấy có tổ chức lớp học nhưng trùng với lịch bóng đá thứ Sáu nên không đăng ký.<br>
                      <strong>✗ C (practising by himself) sai:</strong> Cậu thử tự luyện với bạn bè nhưng không tiến bộ.<br>
                      <strong>✓ B (watching videos) là đúng – Video của surfer nổi tiếng trên website là thứ giúp cậu học lướt sóng.</strong>`,

                q19: `<strong>Đáp án: C – biology</strong><br>
                      Cô gái nói: <em>"the most interesting lesson was about <span class='keyword-highlight'>bees – how they live together and how they develop from eggs to adults.</span>"</em><br>
                      Đây là môn sinh học (biology).<br><br>
                      <strong>✗ A (geography) sai:</strong> Bài về đại dương và nhiệt độ nước – chỉ là bài đầu tiên, không phải thú vị nhất.<br>
                      <strong>✗ B (English) sai:</strong> Họ đọc tiểu thuyết và làm bài về nhà, không được nói là thú vị nhất.<br>
                      <strong>✓ C (biology) là đúng – Bài về ong là thú vị nhất trong ngày.</strong>`,

                q20: `<strong>Đáp án: A – Their bedroom was hot</strong><br>
                      Jake nói: <em>"<span class='keyword-highlight'>Yes, that was the problem.</span>"</em> sau khi Nathan đề nghị: <em>"Let's ask Dad to turn down the heating in our room."</em><br><br>
                      <strong>✗ B (noises in street) sai:</strong> Không có đề cập đến tiếng ồn ngoài đường.<br>
                      <strong>✗ C (excited about camping) sai:</strong> Jake đề cập bố đang chuẩn bị xe đi cắm trại nhưng đây không phải lý do ngủ không được.<br>
                      <strong>✓ A (bedroom was hot) là đúng – Hệ thống sưởi trong phòng quá nóng khiến cả hai ngủ không ngon.</strong>`
            },

            transcript: `
            <p><strong>PART 4</strong></p>
            <p><em>For each question, choose the correct answer.</em></p>

            <p><strong>Question 16</strong><br>
            You will hear two friends talking about shopping. What did the boy buy yesterday?<br>
            <strong>Female:</strong> I'm glad I got the school book I wanted yesterday.<br>
            <strong>Boy:</strong> Yes, my mum had already bought that and a new magazine for me. <span class="highlightable" data-q="16">Everyone thinks the gloves I got yesterday are cool, too.</span><br>
            <strong>Girl:</strong> The T-shirt I liked was really colourful!<br>
            <strong>Boy:</strong> But nearly one hundred pounds!<br>
            <strong>Girl:</strong> I know. Let's buy some snacks now. We can eat them during break at school.<br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 17</strong><br>
            You will hear a teacher talking to a student called Lyn. Why didn't Lyn come to school yesterday?<br>
            <strong>Lyn:</strong> Mr Jones, could I ask you about the tennis match on Saturday?<br>
            <strong>Mr Jones:</strong> Of course, Lyn. You missed class yesterday. Do you feel better?<br>
            <strong>Lyn:</strong> Oh, I wasn't ill. We were camping in Switzerland for a week and <span class="highlightable" data-q="17">our flight was cancelled on Sunday. We flew on Monday instead.</span><br>
            <strong>Mr Jones:</strong> Oh, OK. So, next Saturday's really important. If we win, we'll win the championship!<br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 18</strong><br>
            You will hear a boy talking about surfing. How did he learn to surf?<br>
            <strong>Boy:</strong> When I started surfing, I went to the beach with friends and tried and tried, but I didn't seem to improve. Then, I saw that someone was organising lessons, but they were on Fridays when I play football. In the end, <span class="highlightable" data-q="18">I found a website with a famous surfer showing people the best way to learn. That's what helped me.</span><br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 19</strong><br>
            You will hear a girl talking about her day at school. Which subject did she like best?<br>
            <strong>Girl:</strong> School was great today. First, we had a lesson about oceans and the average water temperature in each one. But <span class="highlightable" data-q="19">the most interesting lesson was about bees – how they live together and how they develop from eggs to adults.</span> In another lesson, we read part of a novel and, for homework, we can write either a story or an article.<br>
            <em>Now listen again. [repeat]</em></p>

            <p><strong>Question 20</strong><br>
            You will hear two brothers talking about last night. Why did they both sleep badly?<br>
            <strong>Jake:</strong> I'm tired this morning. I didn't sleep well.<br>
            <strong>Nathan:</strong> Neither did I. Let's ask Dad to turn down the heating in our room.<br>
            <strong>Jake:</strong> <span class="highlightable" data-q="20">Yes, that was the problem.</span> I can hear him outside. I think he's packing the car so that we are ready to go camping.<br>
            <strong>Nathan:</strong> I can hear Mum playing music downstairs. Let's ask her about the heating.<br>
            <strong>Jake:</strong> Yeah.<br>
            <em>Now listen again. [repeat]</em></p>

            <p><em>That is the end of Part Four.</em></p>
            `,

            questions: [
                { num: 16, text: "You will hear two friends talking about shopping. What did the boy buy yesterday?", options: ["something to wear", "something to eat", "something to read"] },
                { num: 17, text: "You will hear a teacher talking to a student called Lyn. Why didn't Lyn come to school yesterday?", options: ["She was sick.", "She was in a competition.", "She arrived back late from holiday."] },
                { num: 18, text: "You will hear a boy talking about surfing. How did he learn to surf?", options: ["by doing a course", "by watching videos", "by practising by himself"] },
                { num: 19, text: "You will hear a girl talking about her day at school. Which subject did she like best?", options: ["geography", "English", "biology"] },
                { num: 20, text: "You will hear two brothers talking about last night. Why did they both sleep badly?", options: ["Their bedroom was hot.", "There were noises in the street.", "They were excited about going on holiday."] }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.listeningCore = new ListeningCore();
            window.listeningCore.initializeTest(ketTest1Part4Data);
            console.log('KET 6 Test 1 Listening Part 4 loaded');
        });
    </script>
</body>

</html>
